<title>21天健康营养课</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: one phone-width column — progress header, 3×7 calendar of days, then the day's lesson card with charts and class slides */
:root{
  --bg:#eef3f0; --surface:#ffffff; --ink:#15302a; --muted:#5b6f69; --line:#d3dfda;
  --leaf:#1f6b54; --leaf-soft:#dcebe4; --sun:#e8892b; --sun-soft:#fbe9d6; --lock:#c3cfca;
  --bad:#c4473a; --bad-soft:#f8e1dd; --mid:#e3b23c; --water:#2f86c0; --water-soft:#dcecf7; --tissue:#e39b93;
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a17; --surface:#16241f; --ink:#e3eee9; --muted:#9db1aa; --line:#2a3d36;
  --leaf:#6cc2a2; --leaf-soft:#1d3a30; --sun:#f0a35a; --sun-soft:#3a2a1a; --lock:#3a4b45;
  --bad:#ef8a7c; --bad-soft:#3d2320; --mid:#e8c160; --water:#6db5e6; --water-soft:#1b3242; --tissue:#c47d76; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a17; --surface:#16241f; --ink:#e3eee9; --muted:#9db1aa; --line:#2a3d36;
  --leaf:#6cc2a2; --leaf-soft:#1d3a30; --sun:#f0a35a; --sun-soft:#3a2a1a; --lock:#3a4b45;
  --bad:#ef8a7c; --bad-soft:#3d2320; --mid:#e8c160; --water:#6db5e6; --water-soft:#1b3242; --tissue:#c47d76; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
.wrap{max-width:680px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--leaf);font-weight:700}
header{display:flex;flex-direction:column;gap:10px}
header h1{font-size:clamp(28px,7vw,40px);font-weight:900}
header p{color:var(--muted)}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog-num{font-family:var(--display);font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.prog-num small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.bar{flex:1;min-width:160px;display:grid;grid-template-columns:repeat(21,1fr);gap:3px}
.bar i{height:8px;border-radius:2px;background:var(--line)}
.bar i.on{background:var(--leaf)}
.status{background:var(--sun-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.status b{font-variant-numeric:tabular-nums;color:var(--sun)}
.cal{display:flex;flex-direction:column;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-label{font-size:12px;color:var(--muted);letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px}
.tile{aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.tile .n{font-family:var(--display);font-weight:900;font-size:clamp(15px,4.4vw,20px);line-height:1}
.tile .s{font-size:10px;color:var(--muted);line-height:1.5;display:flex;align-items:center;height:15px}
.tile .s svg{width:11px;height:11px}
.tile.done{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.tile.done .s{color:var(--surface);opacity:.85}
.tile.today{border-color:var(--sun);border-width:2.5px;background:var(--sun-soft)}
.tile.today .s{color:var(--sun);font-weight:700}
.tile.locked{background:transparent;border-style:dashed;color:var(--lock);cursor:not-allowed}
.tile.locked .s{color:var(--lock)}
.tile.preview{cursor:pointer;color:var(--muted)}
.tile.sel{outline:3px solid var(--ink);outline-offset:2px}
.tile:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px clamp(16px,5vw,32px) 28px;display:flex;flex-direction:column;gap:22px;min-width:0}
.lesson-head{display:flex;flex-direction:column;gap:6px}
.daytag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.daytag .d{font-family:var(--display);font-weight:900;color:var(--sun);font-size:15px}
.chip{background:var(--leaf-soft);color:var(--leaf);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}
.lesson h2{font-size:clamp(24px,6vw,32px);font-weight:900}
.lesson .en{color:var(--muted);font-size:13px}
.lead{font-size:18px;font-weight:700;font-family:var(--display);line-height:1.55}
.intro{color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:4px;height:1em;background:var(--sun);border-radius:2px}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:pt}
.points>li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:pt}
.points>li::before{content:counter(pt);width:26px;height:26px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.points>li>div>b{display:block;font-size:16px}
.points>li>div>span{color:var(--muted);font-size:15px}


.hook{background:var(--leaf);color:var(--surface);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hook .eyebrow{color:var(--surface);opacity:.85}
.hook .q{font-family:var(--display);font-weight:900;font-size:clamp(18px,4.8vw,21px);line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-size:15px;text-align:left;background:var(--surface);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 14px;cursor:pointer;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start}
.opt i{font-style:normal;font-weight:700;color:var(--leaf)}
.opt:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--sun);background:var(--sun-soft)}
.opt.right span::after{content:" ✓";color:var(--sun);font-weight:700}
.opt.wrong{opacity:.6;text-decoration:line-through}
.answer{background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:15px}
.answer b{color:var(--sun)}
.hook-hint{font-size:13px;opacity:.85}
.pfigs{display:grid;gap:8px;margin-top:10px}
.pfigs.n2{grid-template-columns:1fr 1fr} .pfigs.n3{grid-template-columns:1fr 1fr 1fr}
.pfig{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.pfig button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:zoom-in;display:block;width:100%}
.pfig img{display:block;width:100%;height:auto;max-width:100%}
.fg{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.fg-grp{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.fg-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 12px;color:#fff}
.fg-h b{font-size:15px} .fg-h span{font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}
.fg-grp.hi .fg-h{background:var(--bad)} .fg-grp.mid .fg-h{background:var(--mid);color:#3a2a00} .fg-grp.lo .fg-h{background:var(--leaf);color:var(--surface)}
.fg-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px 8px;padding:12px 10px}
.fg-it{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center}
.fg-it img{width:100%;max-width:100%;height:auto;aspect-ratio:1;border-radius:10px;object-fit:cover;display:block}
.fg-n{font-size:13px;line-height:1.3}
.fg-v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 8px;border-radius:99px;color:#fff}
.fg-grp.hi .fg-v{background:var(--bad)} .fg-grp.mid .fg-v{background:var(--mid);color:#3a2a00} .fg-grp.lo .fg-v{background:var(--leaf);color:var(--surface)}
.points .fg-h span{color:inherit;font-size:12px}
.points .fg-n{color:var(--ink);font-size:13px}
.points .fg-v{color:#fff;font-size:12px}
.points .fg-grp.mid .fg-v{color:#3a2a00}
.points .fg-grp.lo .fg-v{color:var(--surface)}
.pviz{margin-top:10px}
.pviz .viz{background:var(--bg)}
.kc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.kc-it{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.kc-it img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;max-width:100%}
.points .kc-n{color:var(--ink);font-size:13px;line-height:1.35}
.points .kc-v,.kc-v{background:var(--sun);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:1px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.points .kc-s{font-size:11px;color:var(--muted)}
.portion{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.portion>div{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--leaf);min-width:0}
.portion>div.pro{border-top-color:var(--sun)}
.portion h4{margin:0;font-size:16px}
.points .portion .kcal{font-family:var(--display);font-weight:900;font-size:26px;color:var(--leaf);line-height:1;font-variant-numeric:tabular-nums}
.points .portion .pro .kcal{color:var(--sun)}
.points .portion .kcal small{font-size:13px;font-family:var(--body);font-weight:700;margin-left:2px}
.points .portion .unit{font-size:12px;color:var(--muted)}
.portion ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.portion li{display:flex;align-items:center;gap:8px;font-size:14px}
.portion li img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}
.portion li i{width:40px;height:40px;border-radius:8px;flex:none;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:var(--leaf)}
.portion .pro li i{background:var(--sun-soft);color:var(--sun)}
.points .portion li em{font-style:normal;font-size:11px;color:var(--bad);font-weight:700;display:block;line-height:1.3}
.bodyw{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.bodyw svg{width:110px;height:auto;max-width:100%}
.bodyw ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bodyw li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px}
.points .bodyw li b{font-family:var(--display);font-size:22px;color:var(--water);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo figure{margin:0;background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.duo svg{width:100%;height:auto;display:block}
.duo figcaption{font-size:13px;text-align:center;font-weight:700}
.duo .ok figcaption{color:var(--leaf)} .duo .no figcaption{color:var(--bad)}
.points .duo p{font-size:12px;color:var(--muted);text-align:center;margin:0}
.sug{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sug svg{width:100%;height:auto;display:block}
.points .sug .cap{font-size:13px;font-weight:700}
.sug.no .cap{color:var(--bad)} .sug.ok .cap{color:var(--leaf)}
.flow{display:flex;flex-direction:column;gap:6px}
.flow-step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 12px}
.flow-step i{width:30px;height:30px;border-radius:50%;background:var(--leaf);color:var(--surface);font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.points .flow-step b{font-size:15px;display:block} .points .flow-step span{font-size:13px;color:var(--muted)}
.flow-arrow{text-align:center;color:var(--leaf);font-size:16px;line-height:1}
.flow-targets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.points .flow-targets span{background:var(--leaf-soft);color:var(--leaf);font-weight:700;font-size:13px;border-radius:99px;padding:3px 12px}
.swap{display:flex;flex-direction:column;gap:8px}
.swap-row{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:4px}
.swap-c{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:10px;padding:6px;min-width:0;min-height:50px}
.swap-c img{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none}
.swap-c>div{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.points .swap-c span{font-size:13px;color:var(--ink);line-height:1.3;white-space:nowrap}
.swap-c>div{flex:1}
.points .swap-c b{font-size:12px;color:#fff;border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
.swap-c.hi b{background:var(--bad)} .swap-c.lo b{background:var(--leaf);color:var(--surface)} .swap-c.mid b{background:var(--mid);color:#3a2a00}
.swap-ph{width:36px;height:36px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;background:var(--leaf-soft);color:var(--leaf)}
.swap-row>.ar{color:var(--leaf);font-weight:900;text-align:center}
.mwf{display:flex;flex-direction:column;gap:10px}
.mwf-row{display:grid;grid-template-columns:68px 1fr;gap:10px;align-items:center}
.points .mwf-row>span{font-weight:700;font-size:14px;color:var(--ink)}
.mwf-blocks{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.mwf-blocks div{border-radius:8px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1.1}
.mwf-blocks small{font-size:10px;font-weight:700}
.mwf-blocks .m{background:var(--leaf)} .mwf-blocks .w{background:var(--water)} .mwf-blocks .f{background:var(--sun)}
.points .mwf-row em{font-style:normal;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-left:4px}
.mwf-row em.ok{background:var(--leaf-soft);color:var(--leaf)} .mwf-row em.no{background:var(--bad-soft);color:var(--bad)}
.nl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:nl}
.nl li{counter-increment:nl;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px}
.nl li::before{content:counter(nl);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;background:var(--leaf)}
.nl li:nth-child(3n+2)::before{background:var(--sun)} .nl li:nth-child(3n)::before{background:var(--water)}
.bal{display:flex;flex-direction:column;gap:8px}
.bal-row{display:grid;grid-template-columns:1fr 30px 1fr 84px;gap:6px;align-items:center}
.points .bal-row>span{font-size:13px;font-weight:700;text-align:center;border-radius:8px;padding:8px 4px;color:var(--ink)}
.points .bal-row .in{background:var(--sun-soft)} .points .bal-row .out{background:var(--leaf-soft)}
.points .bal-row .op{font-family:var(--display);font-size:22px;font-weight:900;color:var(--ink);background:none;padding:0}
.points .bal-row .res{color:#fff}
.bal-row .res.down{background:var(--leaf)} .bal-row .res.same{background:var(--water)} .bal-row .res.up{background:var(--bad)}
.donut{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media (max-width:420px){.donut{grid-template-columns:1fr;justify-items:center}}
.donut svg{width:150px;height:150px}
.donut ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
.donut li{display:flex;align-items:center;gap:8px;font-size:14px}
.donut li i{width:12px;height:12px;border-radius:3px;flex:none}
.points .donut li b{margin-left:auto;font-variant-numeric:tabular-nums}
.donut-extra{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.points .donut-extra span{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--ink)}
.bub{display:flex;flex-wrap:wrap;justify-content:center;padding:6px 0}
.bub div{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;line-height:1.3;margin:0 -6px;mix-blend-mode:multiply;color:var(--ink)}
:root[data-theme="dark"] .bub div{mix-blend-mode:normal}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bub div{mix-blend-mode:normal}}
.bub div:nth-child(6n+1){background:var(--water-soft)} .bub div:nth-child(6n+2){background:var(--leaf-soft)} .bub div:nth-child(6n+3){background:var(--sun-soft)}
.bub div:nth-child(6n+4){background:var(--bad-soft)} .bub div:nth-child(6n+5){background:var(--leaf-soft)} .bub div:nth-child(6n){background:var(--water-soft)}
.cloud{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cloud span{border-radius:99px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;color:#fff;line-height:1.15;text-align:center}
.cloud span small{font-size:10px;font-weight:500;opacity:.9}
.cloud .v{background:var(--sun)} .cloud .m{background:var(--water)} .cloud .o{background:var(--leaf);color:var(--surface)}
.cloud .s1{width:62px;height:62px;font-size:13px} .cloud .s2{width:74px;height:74px;font-size:14px} .cloud .s3{width:54px;height:54px;font-size:12px}
.rb{display:flex;flex-direction:column;gap:10px}
.rb-base{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:10px}
.rb-base img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.points .rb-base b{display:block;font-size:16px;color:var(--ink)} .points .rb-base span{font-family:var(--display);font-weight:900;font-size:22px;color:var(--sun)}
.rb-eq{text-align:center;font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.1em}
.rb-items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rb-it{background:var(--surface);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;border-bottom:4px solid var(--sun);min-width:0}
.rb-it img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;display:block;max-width:100%}
.rb-tx{padding:8px 10px;display:flex;flex-direction:column;gap:2px}

.recap em{font-style:normal;color:var(--sun);font-weight:700;font-variant-numeric:tabular-nums;flex:none}

.slides{display:flex;flex-direction:column;gap:14px}
.slide{margin:0;display:flex;flex-direction:column;gap:6px}
.slide button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:zoom-in;display:block;width:100%}
.slide img{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.slide figcaption{font-size:13px;color:var(--muted)}

.myth{display:grid;grid-template-columns:1fr;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.myth div{padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.myth .m{background:var(--bad-soft)} .myth .f{background:var(--leaf-soft)}

.myth .m .k{background:var(--bad)} .myth .f .k{background:var(--leaf)}
.myth .m p{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1.5px}
.fact{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:16px}

.fact p{font-size:14px;color:var(--muted)}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.tips li{background:var(--leaf-soft);color:var(--ink);border-radius:99px;padding:5px 14px;font-size:14px}
.task{background:var(--sun-soft);border-radius:12px;padding:16px 18px}
.task .eyebrow{color:var(--sun)}
.task p{margin-top:4px;white-space:pre-line}
.calc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}
.calc select{font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.calc input{width:84px;font:inherit;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.calc output{font-weight:700;color:var(--leaf)}
.actions{display:flex;flex-direction:column;gap:8px}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--leaf);color:var(--surface)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.note{font-size:13px;color:var(--muted);text-align:center}
.locked-card{text-align:center;align-items:center}
.locked-card .clock{font-family:var(--display);font-size:clamp(34px,10vw,48px);font-weight:900;color:var(--sun);font-variant-numeric:tabular-nums;line-height:1.1}
.peek{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px}
footer{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
.confirm{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.owner{border:1.5px dashed var(--sun);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.owner label{display:flex;gap:6px;align-items:center;cursor:pointer}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,20,17,.92);display:flex;align-items:safe center;justify-content:safe center;padding:max(56px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
