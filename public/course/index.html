Gravy / sauce","1 tablespoon",100],["Fruit","1 serving",90],["Egg","1 piece",86]]}],"note":"Compiled from class references; calories are approximate and depend on portion and cooking method."}],"myth":{"m":"The magic number is the same for everyone — just eat 1200 kcal and you're fine.","f":"Everyone's metabolism and goals are different. Your magic number must be calculated for you personally by your coach — eating too little actually loses muscle and slows metabolism."},"fact":{"num":"7700","unit":"kcal","text":"Roughly the calories in 1 kg of body fat. Eating about 500 kcal less per day loses about 0.5 kg a week."},"tips":["Use a smaller bowl and plate for rice","Eat vegetables and protein first, rice last","When eating out, ask for less oil, less sauce and half rice"],"task":"1. Ask your coach to calculate your own magic number, and write down today's three meals and snacks (including drinks) to compare whether you went over.\n2. Starting today, before you eat anything — meals, snacks or drinks — plate it first, take a photo and send it to your coach, then eat.","share":"Do you know anyone who became overweight from eating too many calories, or underweight from eating too little?","template":{"title":"Plate it first, then photograph and send to your coach","img":"plate_template","tips":["Place rice, vegetables and meat separately on the plate so portions are clear at a glance","Put a fork and spoon beside the plate so your coach can estimate the portion","Shoot from directly above and include the whole plate","Photograph every meal, snack and drink, and send it to your coach before eating"],"note":"The green labels in the picture are calories your coach calculates, e.g. vegetables 200 kcal + chicken 300 kcal = 500 kcal."}},{"t":"The importance of water","en":"Importance of Water","tag":"Nutrition","lead":"Every chemical reaction in your body needs water. Drinking enough water is the first step to health.","intro":"We can go weeks without food, but just a few days without water is life-threatening. Water is the most basic — and most overlooked — nutrient.","points":[{"h":"Your body is about 60% water","p":"The human body is about 60–70% water.","viz":[{"type":"body","title":"Water in the body","level":0.65,"items":[["Brain","75%"],["Liver","86%"],["Muscle","86%"]],"note":"The whole body is about 60–70% water (from class handouts)."}],"list":["The brain, liver, muscles and blood all contain a lot of water","Temperature control and nutrient delivery depend on water","Helps your body remove waste through sweat, urine and stool"]},{"h":"How much water should you drink a day?","p":"Water matters even more when you increase nutrient intake and manage your weight.","list":["40–50 ml per kg of body weight per day","About 3–4 litres a day","At 400 ml per cup, about 8–10 cups"]},{"h":"Everyone needs enough water","p":"Except in a few special cases, everyone needs enough water.","list":["Exception: people whose doctor has told them to limit fluids because of certain conditions (e.g. some kidney or heart diseases)","If you're unsure whether this applies to you, ask your doctor first"]},{"h":"When you're thirsty, you're already short of water","p":"By the time you feel thirsty, your body is already mildly dehydrated. When short of water, your body sends warnings: muscle cramps, fatigue, constipation and dry skin."},{"h":"Thirst and hunger are often confused","p":"Often we think we're hungry when we're just thirsty. Before reaching for a snack, drink a glass of water and wait 10 minutes before deciding."},{"h":"Low-calorie hydration options","p":"Besides plain water, aloe drink and herbal tea are great ways to hydrate.","viz":[{"type":"kcal","title":"Hydrating drinks: choose right and calories differ a lot","items":[["aloe","Aloe drink","Low calorie","Helps hydration"],["tea","Herbal tea","Low calorie","Helps hydration"],["icedrink","Sugary drinks","160–200 kcal","One cup"]]}],"list":["Very low in calories","Refreshing taste makes it easier to drink enough water each day","Can replace sugary drinks"]},{"h":"Water helps metabolism","p":"Your body needs water to break down fat and remove metabolic waste. Without enough water, metabolism slows and constipation is more likely."},{"h":"Water doesn't make you puffy — not drinking enough does","p":"Many fear that drinking more water makes them puffy. It's actually the opposite.","list":["Not enough water: your body thinks it's short and holds on to water, so you get puffy","Enough water every day: your body feels safe to release excess water","Enough water: more hydrated skin and better weight-loss results"],"after":"For fewer fine lines and better skin, drink more water!"},{"h":"Not enough water may bring adjustment reactions","p":"When you first change your diet and don't drink enough water, a few people (about 5 in 100) may experience adjustment reactions.","viz":[{"type":"bubbles","title":"Possible adjustment reactions","items":["Dizziness","Headache","Nausea","Rashes","Faster heartbeat","Diarrhoea","Constipation"],"note":"If these appear, remember to drink more water — it's a natural reaction while your body adjusts. But don't treat every symptom as an adjustment reaction; if you feel unwell, see a doctor right away."}],"list":["Most importantly, drink more water","Keep following your meal plan and never stop your daily nutrition shake","Everyone's body is different; reactions vary and fade after a while"],"after":"However, don't treat every discomfort as an adjustment reaction; if you feel unwell, see a doctor right away."}],"viz":[{"type":"cups","title":"How many cups of water a day? (1 cup = 400 ml)","rows":[["General advice",10,"8–10 cups, about 3.2–4 litres"],["Men",9,"About 3.7 litres"],["Women",7,"About 2.7 litres"]],"note":"The general advice is about 8–10 cups a day. The figures for men and women come from the US National Academies of Sciences, Engineering, and Medicine; about 20% of water can come from food."}],"myth":{"m":"Soft drinks, coffee and milk tea count as drinking water.","f":"Sugary drinks bring lots of calories, and caffeine is also a diuretic. Plain water is still the best way to hydrate, followed by unsweetened tea."},"fact":{"num":"60","unit":"%","text":"The approximate share of water in an adult's body weight."},"tips":["Drink a glass of warm water when you wake up","Take a few sips of water every time after using the toilet","Set an hourly reminder on your phone to drink water"],"task":"Use the calculator below to work out how much water you should drink daily. Get a 400 ml cup or a marked bottle and record how many cups you drink today.","share":"Do you know anyone who rarely drinks plain water?","calc":"water"},{"t":"Cellular nutrition","en":"Cellular Nutrition","tag":"Nutrition","lead":"There's only one disease: sick cells. A full stomach doesn't mean well-fed cells.","intro":"Your body is made of tens of trillions of cells, and huge numbers die and renew every minute. How healthy new cells are depends on the raw materials you give them.","points":[{"h":"Cells are the basic unit of health","p":"Skin, muscles, organs and blood are all made of cells. With enough nutrition, cells work and repair normally; without it, cell function slowly declines."},{"h":"Cells need seven key nutrients","p":"Protein, carbohydrates, fat, vitamins, minerals, dietary fibre and water — all essential. Eating your fill without eating right still leaves cells \"hungry\"."},{"h":"Nutrients are absorbed in the small intestine","p":"The small intestine is lined with tiny villi that greatly increase the absorption area. Only with a healthy gut can you truly use the nutrients you eat.","viz":[{"type":"villi","title":"Intestinal villi: healthy vs damaged"}]},{"h":"What harms the intestinal villi?","p":"All of these can block or damage the villi and affect nutrient absorption:","list":["Unhealthy food: saturated fat, trans fat, refined sugar, refined starch, too much salt","Food additives and preservatives","Stress","Smoking and drinking alcohol","Medication","Pollution, pesticides and harmful substances in the air"],"after":"Balanced nutrition helps protect and repair the gut so cells get enough nutrients."},{"h":"How does protein feed your cells?","p":"This is how your body uses the protein in food:","viz":[{"type":"flow","title":"Protein's journey","steps":[["Protein in food","Chicken, fish, eggs, tofu, nutrition shake"],["Broken down into amino acids","Broken down in the digestive tract"],["Absorbed by the small intestine","Rapidly absorbed within about 15 minutes"]],"targets":["Brain cells","Skin cells","Muscle cells","Cells of other organs"]}]},{"h":"Too many calories, too little nutrition","p":"Modern diets are often high in oil, sugar and refined starch, and low in vegetables, fruit, protein and micronutrients. Many people are overweight while their cells are malnourished."},{"h":"Fill the nutrition gap","p":"First eat a balanced diet, then use supplements as needed to fill the gaps in your everyday diet."}],"viz":[{"type":"chips","title":"Seven nutrients your cells need","items":[["Protein","Builds and repairs cells"],["Carbohydrates","Main energy source"],["Fat","Cell membranes, hormone building blocks"],["Vitamins","Regulate body functions"],["Minerals","Bones, nerves, muscles"],["Dietary fibre","Gut health"],["Water","The medium for every reaction"]]}],"myth":{"m":"I eat until I'm full, so I must be getting enough nutrition.","f":"Being full only means you've had enough calories. Whether you have enough nutrition depends on whether the foods you eat are balanced."},"fact":{"num":"90","unit":"%","text":"About 90% of the nutrients your body needs are absorbed through the intestinal villi."},"tips":["One portion of protein at every meal","Eat vegetables and fruit of different colours every day","Eat fewer processed foods and more whole foods"],"task":"Look at today's plates and count how many of the seven nutrients you ate, and which ones you missed.","share":"Do you know anyone who often eats unhealthy food and doesn't have a very healthy lifestyle?","philo":"For healthy cells, nutrition must be balanced. Remember this chart:"},{"t":"The ideal breakfast","en":"Ideal Breakfast","tag":"Meal plan","lead":"A breakfast built on quality protein plus fibre helps keep your blood sugar steady all day.","intro":"After a whole night without food, your body needs nutrition most in the morning. What you eat for breakfast affects your blood sugar, energy and appetite all day.","points":[{"h":"Breakfast breaks the overnight fast","p":"Your body still uses energy while you sleep. Morning nutrition helps it start up, steadies blood sugar and gives you more energy in the morning."},{"h":"What is an ideal breakfast?","p":"Ideal breakfast = quality protein + high-fibre food + enough water.","list":["Quality protein: eggs, tofu, chicken breast, nutrition shake","High-fibre food: vegetables, fruit, oats, whole grains","Enough water: drink a glass as soon as you get up"],"after":"A breakfast like this digests slowly and keeps blood sugar steady — it keeps you full till lunch and helps steady your blood sugar all day.","viz":[{"type":"portion","title":"What to eat for an ideal breakfast?","carb":{"h":"High-fibre foods","items":[["Vegetables","vege"],["Fruit","guava"],["Oats / whole grains","brownrice_k"]]},"pro":{"h":"Quality protein","items":[["Egg","egg"],["Tofu","tofu"],["Chicken breast","chicken"],["Nutrition shake","shake"]]}}]},{"h":"Why do protein and fibre keep you from getting hungry?","p":"Your digestive system talks to your brain and tells it whether you're full. Different foods send different signals:","list":["Sweets, starch, alcohol: tell the brain \"I can eat more\", leading to overeating","Protein: after digestion, tells the brain \"I'm full, stop eating\"","Fibre: adds volume in the gut and slows digestion, making you feel full"],"after":"Remember: eat slowly. If you eat too fast, you've already overeaten before your brain gets the \"full\" signal.","viz":[{"type":"split","title":"Signals food sends to the brain","left":{"h":"\"I'm full, stop eating\"","cls":"good","items":["Protein: eggs, tofu, fish, chicken","Fibre: vegetables, fruit, whole grains","Fullness lasts longer"]},"right":{"h":"\"I can eat more\"","cls":"bad","items":["Sweets","Starch","Alcohol","Easy to keep eating more"]}}]},{"h":"The blood sugar roller coaster","p":"High-carb breakfasts like cereal, bread, porridge, noodles and rice send your blood sugar on a roller coaster:","list":["Up: blood sugar spikes after eating","Down: your body releases lots of insulin to push blood sugar down and store it as fat","Bottom: you feel tired and soon get hungry again","Back on the ride: you crave sugar and starch, and shoot up again"],"after":"Riding this roller coaster several times a day is one of the main causes of diabetes, high blood pressure and excess weight. Switch to a protein-based breakfast and blood sugar becomes much steadier.","viz":[{"type":"sugar","mode":"spike","cap":"High-carb breakfast: blood sugar roller coaster","title":"Blood sugar through the day"},{"type":"sugar","mode":"steady","cap":"Quality-protein breakfast: steady blood sugar","title":"Blood sugar through the day"}]},{"h":"Skipping breakfast does the same","p":"Skipping breakfast also traps you in the blood sugar cycle:","list":["Blood sugar drops; you feel hungry and weak","You crave simple carbs to fight the hunger","Blood sugar spikes and crashes again"]},{"h":"Small, frequent meals are steadier","p":"Eat 5 times a day: breakfast, mid-morning snack, lunch, afternoon snack, dinner. Avoid getting too hungry so you don't overeat at the next meal."},{"h":"Quick and nutritious","p":"Mornings are rushed. A nutrition shake or a simple protein breakfast takes just minutes — faster than queuing to buy breakfast outside."}],"viz":[{"type":"timeline","title":"The vicious cycle of a high-carb breakfast","items":[["Eat a high-carb breakfast","Bread, porridge, noodles, rice, sweet drinks"],["Blood sugar spikes","The pancreas releases lots of insulin"],["Sugar is turned into fat","Blood sugar crashes quickly"],["Hungry and craving sugar","Eat more carbs, and the cycle repeats"]]},{"type":"timeline","title":"Sample 5-meal daily schedule","items":[["Breakfast","About 150 kcal","Protein-based"],["9 am","About 100 kcal","One serving of fruit"],["Lunch","About 500 kcal","Vegetables + protein + complex carbs"],["4 pm","About 150 kcal","Protein snack"],["Dinner","About 500 kcal","Vegetables + lean meat / fish"]],"note":"A sample totalling about 1400 kcal. Your coach will adjust actual portions to your height, weight and goal."}],"myth":{"m":"Skipping breakfast means one less meal, so it's easier to lose weight.","f":"Skipping breakfast tends to make you eat more at lunch and dinner and crave sweets and starch. Regular meals make it easier to control total calories."},"fact":{"num":"5","unit":" meals","text":"Eating 5 times a day (3 meals + 2 snacks) helps steady blood sugar and control hunger."},"tips":["Prepare breakfast the night before","Swap sweet coffee for black coffee or unsweetened tea","Pack a serving of fruit as a mid-morning snack"],"task":"Add a portion of protein to tomorrow's breakfast, such as eggs, unsweetened soy milk, or F3 protein powder in your nutrition shake. Notice whether your mid-morning hunger is different.","share":"Do you know anyone whose breakfast is mostly carbohydrates, or who often skips breakfast?","leadHL":true,"philo":"The ideal breakfast means putting this chart into your first meal:"},{"t":"Understanding the glycaemic index","en":"Low Glycemic Index","tag":"Nutrition","lead":"Avoid sweets and you won't get diabetes? Frequent high-GI food is the real blood sugar killer.","intro":"It's not just sweets and cake that raise blood sugar. Everyday staples like white rice, white bread and noodles raise it quickly too.","points":[{"h":"What is the glycaemic index (GI)?","p":"GI shows how fast a carbohydrate food is digested into glucose and raises blood sugar. The higher the GI, the faster blood sugar rises.","foods":[{"h":"High-GI foods","sub":"70 or above","cls":"hi","items":[["chaomifen","Fried bee hoon",98],["karipap","Curry puff",87],["fries","French fries",85],["soda","Soft drinks",85],["tehtarik","Teh tarik",73],["roticanai","Roti canai",71],["bread","White bread",70]]},{"h":"Medium-GI foods","sub":"56–69","cls":"mid","items":[["burger","Burger",67],["sushi","Sushi",67],["apricot","Apricot",61],["mango","Mango",60],["udon","Udon",58],["papaya","Papaya",58]]},{"h":"Low-GI foods","sub":"55 or below","cls":"lo","items":[["apple","Apple",55],["brownrice","Brown rice",50],["sweetpotato","Sweet potato",48],["tomato","Tomato",30],["corn","White corn",26],["f1","F1 shake",16],["peanut","Peanuts",14],["broccoli","Cauliflower",10],["mushroom","Mushrooms",10]]}]},{"h":"Remember the blood sugar roller coaster from Day 4?","p":"High-GI foods are what put your blood sugar on that roller coaster.","list":["High-GI foods: blood sugar rises fast, falls fast, and you're soon hungry again","Low-GI foods: blood sugar rises slowly, steady and lasting"],"after":"So choose the right GI to get off the roller coaster and stop the ups and downs."},{"h":"An overworked pancreas will eventually \"go on strike\"","p":"When blood sugar rises, the pancreas releases insulin to bring it down. Think of the pancreas as an employee:","list":["Frequent high-GI food: the pancreas works overtime every day","The body becomes less and less sensitive to insulin: the pancreas must release more to control blood sugar — this is \"insulin resistance\"","Long-term overwork: the exhausted pancreas \"goes on strike\" and blood sugar gets out of control"],"after":"At this point, the risk of type 2 diabetes rises sharply."},{"h":"Long-term risks","p":"Large long-term blood sugar swings most commonly lead to insulin resistance and type 2 diabetes, and may also affect these parts of the body:","viz":[{"type":"chips","title":"Long-term high blood sugar may affect","items":[["Eyes","Vision problems"],["Heart","Heart attack"],["Brain","Stroke"],["Kidneys","Kidney damage"],["Nerves","Nerve damage"],["Wounds","Slow to heal"]]}]},{"h":"Low-GI choices","p":"Low-GI foods turn into blood sugar more slowly, with many benefits:","viz":[{"type":"swap","title":"Diet swap: from high GI to low GI","rows":[[["White rice","92","hi","k_rice"],["Brown rice","50","lo","k_brownrice_k"]],[["Fried bee hoon","98","hi","food_chaomifen"],["Udon","58","mid","food_udon"]],[["White bread","70","hi","food_bread"],["Wholemeal bread","64","mid"]],[["Soft drinks","85","hi","food_soda"],["Plain water","","lo"]],[["Teh tarik","73","hi","food_tehtarik"],["Unsweetened tea","","lo"]],[["Mango","60","mid","food_mango"],["Apple","55","lo","food_apple"]]],"note":"Values from class handouts."}],"list":["Fullness lasts longer","Energy delivered steadily to the whole body","Especially good for people managing their weight"],"after":"Brown rice, oats, beans and most vegetables are good choices."}],"viz":[{"type":"scale","title":"GI of common local foods","min":0,"max":100,"zones":[[0,55,"Low GI","lo"],[55,70,"Medium","mid"],[70,100,"High GI","hi"]],"marks":[["Fried bee hoon",98],["White rice",92],["Curry puff",87],["Noodles",85],["Soft drinks",85],["French fries",85],["Teh tarik",73],["Roti canai",71],["White bread",70],["Burger",67],["Wholemeal bread",64],["Mango",60],["Banana",52],["Brown rice",50],["Sweet potato",48],["Tomato",30],["F1 shake",16],["Peanuts",14],["Cauliflower",10]],"note":"Values from class handouts; actual values vary with variety and cooking method."}],"myth":{"m":"I don't eat sweet things, so I won't have blood sugar problems.","f":"Refined starches like white rice, white bread and porridge also have a high GI. Controlling blood sugar depends on your overall diet, not just sweets."},"fact":{"num":"≤55","unit":"","text":"A GI of 55 or below is low, 56–69 is medium, 70 or above is high."},"tips":["Replace white rice with half brown rice or mixed-grain rice","At meals, eat vegetables and meat first, rice last","Eat fruit whole instead of juicing it"],"task":"At one meal today, replace white rice with half brown rice, or add a portion of vegetables and eat half a bowl less rice.","share":"Do you know anyone who doesn't know about the glycaemic index or the harm of high-GI foods?"},{"t":"The importance of protein","en":"Importance of Protein","tag":"Nutrition","lead":"Apart from fat and bone, your body's \"lean mass\" is mainly made of protein.","intro":"Protein is your body's building material. Muscle, skin, hair, enzymes, hormones and antibodies all need it, and your body can't store much protein, so you need it every day.","points":[{"h":"Protein's eight key roles","p":"Protein does many jobs in the body — see the chart below:","viz":[{"type":"chips","title":"What protein does in the body","items":[["Provides body structure","Supports the body"],["Builds and repairs tissue","Muscle, skin, hair"],["Helps digestive enzymes","Speeds up chemical reactions"],["Supports immunity","Makes antibodies"],["Coordinates hormones","Regulates body functions"],["Transports nutrients","Moves essential molecules around the body"],["Regulates DNA","Supports DNA and RNA expression"],["Supports muscles","Contraction and movement"]]}]},{"h":"How much protein do you need each day?","p":"How much protein you need depends on your goal:","list":["Maintain weight: 0.8–1.2 g per kg of body weight per day","Lose weight: 1.2–1.6 g per kg of body weight per day","Gain weight: 1.6–2.2 g per kg of body weight per day"],"after":"For example, a 60 kg person needs about 48–72 g to maintain, 72–96 g to lose weight, and 96–132 g to gain. People losing weight especially need enough protein, or they keep losing muscle and regain weight easily once they stop. Use the calculator in \"Today's task\" below to work out your own needs."},{"h":"Fullness lasts longer","p":"Protein digests slowly and keeps you full longer. Enough protein at every meal is the simplest way to control appetite."},{"h":"There's healthy and unhealthy weight loss","p":"Your body is made of muscle, water and fat — which one you lose matters.","viz":[{"type":"mwf","title":"The body is muscle, water and fat: three weight-loss outcomes","rows":[["Before",44,44,44,"",""],["Dieting",28,30,44,"Unhealthy","no"],["Balanced nutrition",44,44,26,"Healthy","ok"]],"note":"M muscle, W water, F fat. Dieting loses muscle and water; balanced nutrition mainly loses fat."}],"list":["Crash dieting: you mostly lose muscle and water while fat stays, and energy, immunity and metabolism drop","Balanced-nutrition weight loss: cut calories while eating balanced nutrition, mainly losing fat and keeping muscle","Result: plenty of energy, better immunity, metabolism maintained — and you don't feel hungry"]},{"h":"Enough protein means less rebound after weight loss","p":"Only with enough protein while losing weight can your body keep its muscle.","list":["Keep your muscle and your metabolism won't slow down","With normal metabolism, your weight is more stable when you return to normal eating","Not enough protein: you keep losing muscle, metabolism slows, and weight comes back easily once you stop"],"after":"So while losing weight, eat 1.2–1.6 g of protein per kg of body weight — not just less food."},{"h":"It matters more as you age","p":"After 30, muscle mass slowly declines with age. Enough protein plus strength training can slow this process."},{"h":"Quality protein vs low-quality protein","p":"Not all protein is equal: how much your body absorbs, and how much you need to eat, differ greatly.","list":["Quality protein: high absorption, contains all the amino acids your body needs — a small amount is enough","Low-quality protein: low absorption, missing some essential amino acids — you need to eat a lot"],"after":"So choose quality protein at every meal to truly get the protein your body needs.","viz":[{"type":"versus","title":"Quality protein vs low-quality protein","good":{"h":"Quality protein · high absorption","items":[["chicken","Chicken"],["salmon","Fish"],["egg","Egg"],["tofu","Tofu"],["shake","Nutrition shake"]],"points":["High absorption, score close to 1.00","Contains all essential amino acids","A small amount is enough"]},"bad":{"h":"Low-quality protein · low absorption","items":[["redbean","Red beans"],["mungbean","Mung beans"],["brownrice_k","Whole grains"],["bread","Bread"]],"points":["Lower absorption","Missing some essential amino acids","You need to eat a lot"]}},{"type":"bars","title":"Protein absorption score (max 1.00)","unit":"","items":[["Soy",1,0],["Casein (milk)",1,0],["Egg white",1,0],["Beef",0.92],["Pea protein",0.69],["Red beans",0.68],["Pinto beans",0.63],["Whole wheat",0.4],["Wheat gluten",0.25]],"note":"This score (PDCAAS) shows how well the body absorbs and uses a protein — higher is better. Soy, milk and eggs are all quality proteins with a perfect score of 1.00."},{"type":"kcal","title":"How much do you need to eat to get about 25 g of protein?","items":[["chicken","Chicken breast","About 80 g","One palm"],["salmon","Fish","About 115 g","One fish fillet"],["egg","Egg","About 4",""],["tofu","Tofu","About 170 g","Most of a block"],["redbean","Red beans (cooked)","About 280 g","A large bowl"],["brownrice_k","Brown rice","About 830 g","About 5 bowls of rice"]],"note":"Based on approximate protein per 100 g. With low-quality protein you have to eat a lot, and the calories add up too."}]},{"h":"How can vegetarians get enough quality protein?","p":"Vegetarians can get enough quality protein too — the key is choosing the right sources and combining them:","list":["Soy foods are best: tofu, tempeh, edamame, unsweetened soy milk — perfect absorption score of 1.00","Lacto-ovo vegetarians: eggs and low-fat milk are also perfect-score quality proteins","Eat beans + grains together: e.g. red beans or peas with brown rice or oats, so the amino acids complement each other","Nutrition shake: mainly soy protein, a convenient way to top up your daily protein"],"after":"Vegans need to be extra careful: include a portion of soy food at every meal.","viz":[{"type":"kcal","title":"Vegetarian protein sources (per 100 g)","items":[["soybean","Soybeans (edamame)","About 13 g","Perfect absorption score"],["tempeh","Tempeh","About 19 g","Fermented soybeans"],["tofu","Tofu","About 17 g","Firm tofu"],["egg","Egg","About 13 g","Lacto-ovo vegetarian"],["oats","Oats","About 17 g","Eat with beans"],["redbean","Red kidney beans","About 5 g","Eat with grains"],["peas","Peas","About 5 g","Eat with grains"],["pb","Peanut butter","About 25 g","High in fat — 1 tablespoon is enough"],["shake","Nutrition shake","Soy protein","Convenient top-up"]],"note":"Approximate values. Soy foods, eggs and dairy have the highest absorption; beans and grains (oats, brown rice) should be eaten together for complete nutrition. Peanut butter is high in protein but also in fat and calories, so control the portion."},{"type":"bars","title":"Protein in plant foods (per 100 g)","unit":"g","items":[["Pumpkin seeds",33],["Peanut butter",25.1],["Almonds",22.1],["Flaxseed",19.5],["Tofu",17.2],["Oats",16.9],["Chia seeds",15.6],["Cashews",15.3],["Walnuts",15],["Soybeans (edamame)",13.1],["Lentils",9],["Chickpeas",8.9],["Wholemeal bread",8.8],["Peas",5.4],["Red kidney beans",4.8],["Quinoa",4.4],["Spinach",2.9],["Brown rice",2.6],["Potato",2.5]],"note":"Nuts and seeds are high in protein but also very high in fat and calories — a small handful a day is enough. Soy foods (tofu, tempeh, edamame) are the best protein sources for vegetarians."}]},{"h":"Find protein in natural foods","p":"Quality protein comes from two sources:","list":["Plant protein: tofu, tempeh, lentils, soybeans","Animal protein: eggs, chicken breast, fish, prawns, low-fat dairy"],"after":"Note: nuts and fatty meat are also high in calories and fat — control the portion."},{"h":"Don't just look at your weight","p":"At the same weight, bodies can look very different. The key is whether you carry more muscle or more fat:","list":["Same 1 kg: muscle is small, fat is bulky","More muscle: firm body, full of energy, burns more calories every day","More fat: soft body, tires easily, gains weight more easily"],"after":"So weight loss isn't just the number on the scale — body fat percentage and muscle mass matter more. That's why we measure and follow up regularly.","viz":[{"type":"vs2","title":"Both are 50 kg — why do they look so different?","left":{"h":"More muscle","cls":"good","bar":[["Muscle",62],["Fat",22],["Other",16]],"items":["Firm body","Full of energy","Stays lean easily","Burns more calories"]},"right":{"h":"More fat","cls":"bad","bar":[["Muscle",34],["Fat",50],["Other",16]],"items":["Soft body","Tires easily","Gains weight easily","Bulky — looks bigger"]},"note":"Illustration only; proportions for explanation. The same weight of fat takes up much more space than muscle."}]}],"viz":[{"type":"bars","title":"Protein per 100 g of food","unit":"g","items":[["Chicken breast",31],["Beef",26],["Pork",26],["Chicken thigh",25],["Salmon",22],["Egg",13],["Tofu",15],["Lentils",9],["Brown rice",3]],"note":"Approximate values per 100 g, cooked, boneless."}],"myth":{"m":"Only people who work out need protein.","f":"Everyone needs protein to maintain muscle, immunity and body repair. People losing weight, older adults and those who exercise need more."},"fact":{"num":"1.2–1.6","unit":"g/kg","text":"While losing weight, about 1.2–1.6 g of protein per kg of body weight per day is recommended. To maintain: 0.8–1.2 g; to gain: 1.6–2.2 g."},"tips":["A palm-sized portion of protein at every meal","Breakfast is most often short of protein — fix it first","Alternate animal and plant protein"],"task":"Choose your goal, enter your weight, and work out roughly how much protein you need each day:","calc":"protein","share":"Do you know anyone who often diets using their own methods?","philo":"Protein makes up 30% of daily calories — a key part of balanced nutrition:"},{"t":"Good fats and bad fats","en":"Good Fats & Bad Fats","tag":"Nutrition","lead":"Fat isn't the enemy — choosing the right kind is what matters.","intro":"Your body needs fat to make hormones, build cell membranes and absorb vitamins A, D, E and K. The question isn't whether to eat fat, but which kind.","points":[{"h":"Saturated fat: in moderation","p":"Fatty meat, butter, cream, coconut milk and palm oil contain saturated fat, which is solid at room temperature. Too much raises bad LDL cholesterol and the risk of heart disease."},{"h":"Trans fat: avoid completely","p":"The less trans fat, the better.","list":["Common in: hydrogenated vegetable oil, margarine, shortening","Biscuits, cakes, pastry and fried foods made with these oils","Raises bad cholesterol and lowers good cholesterol"]},{"h":"Fried food soaks up a lot of oil","p":"Food absorbs oil when deep-fried. Battered and bready foods absorb the most:","list":["Fried scrambled egg: absorbs up to 43% oil","Battered foods: the batter coating soaks up a lot of oil","The same ingredients steamed, boiled or baked have far less fat and fewer calories than fried"],"viz":[{"type":"bars","title":"Oil absorption of common fried foods","unit":"%","items":[["Fried scrambled egg",43,1],["Battered fried shrimp",35,1],["Battered fried mushrooms",23,1],["Fried lotus root",19],["Fried stuffed eggplant",17],["French fries",15]],"note":"Oil absorption: oil absorbed by food after frying, as a share of the food's weight. Compiled from class references; fries estimated at about 15 g oil per 100 g."}]},{"h":"Unsaturated fat: choose more","p":"Olive oil, canola oil, avocado, nuts and seeds contain mono- or polyunsaturated fats, which are liquid at room temperature and help lower bad cholesterol."},{"h":"How to choose cooking oil?","p":"Oils differ greatly in fat type. When cooking, choose oils high in unsaturated fat and low in saturated fat:","list":["Choose more: canola oil, olive oil (high in monounsaturated fat)","In moderation: sunflower, corn and soybean oil","Use less: lard, palm oil, butter, coconut oil (high in saturated fat)"],"viz":[{"type":"stack","title":"Fat composition of common cooking oils (%)","keys":[["Saturated fat","var(--bad)"],["Omega-6","var(--water)"],["Omega-3","var(--sun)"],["Omega-9","var(--leaf)"]],"rows":[["Flaxseed oil",[9,16,57,18]],["Canola oil",[7,21,11,61]],["Olive oil",[15,9,1,75]],["Soybean oil",[15,54,8,23]],["Peanut oil",[19,33,0,48]],["Corn oil",[13,57,1,29]],["Sunflower oil",[12,71,1,16]],["Lard",[43,9,1,47]],["Palm oil",[51,10,0,39]],["Butter",[68,3,1,28]],["Coconut oil",[91,2,0,7]]],"note":"Every oil contains Omega-3, 6 and 9, but in very different proportions. Orange (Omega-3) is generally small — only flaxseed oil has more. Compiled from class reference charts; figures are approximate."}]},{"h":"Omega-3: your body can't make it","p":"Omega-3 is an essential fatty acid your body can't make on its own, so it must come from food. Fish oil contains two main types of Omega-3:","list":["DHA: a key component of the brain and the retina, helps maintain brain and eye health","EPA: helps maintain normal triglyceride levels and healthy blood vessels","Sources: deep-sea fish (salmon, mackerel, sardines), flaxseed"],"viz":[{"type":"table","title":"Omega-3 dosage guide","head":["Organisation","For","Daily recommendation"],"wrap":[1],"rows":[["FDA","General adults: daily safe upper limit","3 g"],["AHA","Coronary heart disease","1 g"],["AHA","High triglycerides","3–4 g"],["AHA","High blood pressure","2 g"],["AHA","Rheumatoid arthritis","2.7 g"],["WHO","Pregnant and breastfeeding women","300 mg"],["WHO","Eye health, relieving dry eyes","1 g"]],"best":-1,"note":"FDA: US Food and Drug Administration; AHA: American Heart Association; WHO: World Health Organization. Compiled from class handouts; figures refer to EPA + DHA. Most people only need deep-sea fish twice a week or a moderate fish oil supplement; if you have a medical condition, are pregnant or take medication, consult your doctor before supplementing."},{"type":"chips","title":"What's the biggest worry with fish oil?","items":[["Mercury and heavy metals","Large fish tend to accumulate heavy metals such as mercury — the biggest worry with fish oil"],["Choose small deep-sea fish","Small fish like mackerel, anchovies and sardines accumulate fewer heavy metals"],["Check the test report","Tested for heavy metals with none detected — more peace of mind"],["Added vitamin E","Helps prevent fish oil oxidation and keeps it fresh"]]},{"type":"kcal","title":"Where does Omega-3 come from?","items":[["fishoil","Omega-3 fish oil","Heavy metals not detected","Heavy metal analysis test"],["salmon","Deep-sea fish","Twice a week","Natural source"]],"note":"Herbalife fish oil uses small North Atlantic deep-sea fish (mackerel, anchovies, sardines). Heavy metal testing showed none detected, and vitamin E is added to prevent oxidation."}],"img":[{"f":"fishoil_report","cap":"Herbalife deep-sea fish oil capsules heavy metal analysis test: heavy metals not detected"}]},{"h":"Is plant Omega-3 (ALA) enough?","p":"The Omega-3 in flaxseed, chia seeds and walnuts is called ALA. Many people think eating these is enough, but ALA still has to be converted in the body before it becomes the EPA and DHA your body actually needs:","list":["ALA to EPA: only about 5–10%","ALA to DHA: even less, only about 0.5–5% (under 1% for many people)","Conversion varies by person, and too much Omega-6 in the diet lowers it further"],"after":"So plant ALA is fine to eat, but for enough EPA and DHA, the most direct sources are still deep-sea fish and fish oil.","viz":[{"type":"bars","title":"Eat 100 units of ALA — how much can it become at most?","unit":" servings","items":[["ALA eaten",100],["Becomes EPA",10,1],["Becomes DHA",5,1]],"note":"Calculated with the higher conversion rates from research; many people are actually lower. Source: combined estimates of ALA conversion from nutrition research."}]},{"h":"What happens if you eat too much bad fat?","p":"Eating too much saturated and trans fat over time raises bad cholesterol and slowly affects your body:","list":["Blood vessels: fatty plaque builds up on the walls, narrowing and hardening them","Heart: blocked vessels raise the risk of heart attack and stroke; the heart must work harder","Liver: fat builds up in the liver, causing fatty liver","Belly: visceral fat increases and your waist grows"],"after":"The good news: by changing your eating habits and exercising more, your blood vessels can stay younger.","imgFull":true,"img":[{"f":"heart_attack","cap":"Heart attack: a vessel blocked by plaque stops oxygen-rich blood reaching heart muscle, and more tissue dies every minute"},{"f":"liver_real","cap":"Healthy liver (left) vs fatty liver (right)"}]},{"h":"Omega-3, 6, 9: it's Omega-3 you need to top up","p":"The unsaturated fats in food are mainly of three kinds: Omega-3, Omega-6 and Omega-9:","list":["Omega-6: found in most cooking oils and processed foods — you get plenty without trying. Too much promotes inflammation","Omega-9: plentiful in olive oil, canola oil and nuts, and your body can make it too","Omega-3: helps reduce abnormal inflammation, but a normal diet provides very little — this is the one you most need to top up"],"after":"Modern diets have too much Omega-6 and too little Omega-3. So there's no need to supplement Omega-6 or Omega-9 — it's Omega-3 you need more of."},{"h":"Good fats have calories too","p":"Even good fats like olive oil and nuts have 9 calories per gram — more than double protein and carbohydrates. Choose the right kind, and control the portion too."}],"viz":[{"type":"split","title":"Tell good and bad fats apart at a glance","left":{"h":"Good fats · choose more","cls":"good","items":["Deep-sea fish: salmon, mackerel, sardines","Olive oil, canola oil","Avocado","Plain nuts such as almonds and walnuts","Flaxseed, chia seeds"]},"right":{"h":"Bad fats · eat less or avoid","cls":"bad","items":["Fatty meat, chicken skin, lard","Butter, cream, condensed milk","Coconut milk, palm oil (saturated fat)","Margarine, shortening (trans fat)","Biscuits, cakes, pastry, fried foods"]}}],"myth":{"m":"To lose weight you must cut out oil completely.","f":"Cutting out oil completely affects hormones and the absorption of fat-soluble vitamins. The key is eating less bad fat and moderate amounts of good fat."},"fact":{"num":"1","unit":"g","text":"The American Heart Association notes that for people who rarely eat fish, about 1 g of Omega-3 a day may benefit health."},"tips":["Eat deep-sea fish twice a week","Swap snacks for a small handful of plain nuts","Before buying biscuits and cakes, check the ingredients for hydrogenated oil"],"task":"Plan two deep-sea fish meals this week (salmon, mackerel, sardines), or talk to your coach about fish oil.","share":"Do you know anyone who often eats bad fats like fatty meat and fried food?","philo":"Fat makes up 30% of daily calories — the key is cutting saturated fat and adding Omega-3:"},{"t":"Reading nutrition labels","en":"Reading Nutrition Labels","tag":"Meal plan","lead":"The front of the pack is advertising; the nutrition label on the back is the truth.","intro":"Words like \"low fat\", \"natural\" and \"high fibre\" are printed on the front to get you to buy. To know whether a food is really healthy, turn it over and read the nutrition label and ingredient list.","points":[{"h":"Three quick principles","p":"When buying packaged food, most people look at price, packaging and expiry date. To eat healthily, we'll teach you a simple way to read nutrition labels — just remember three principles:","list":["Low calorie: check the weight per serving and convert","High protein","Low fat: pay special attention to trans and saturated fat"],"viz":[{"type":"split","title":"What do most people look at? What do we look at?","left":{"h":"We teach you to read: the nutrition label","cls":"good","items":["Low calorie","High protein","Low fat"]},"right":{"h":"Most people only look at: the outside","cls":"bad","items":["Price, brand","Package pictures","Expiry date, net weight","Container condition, country of origin"]}}]},{"h":"Step 1: check the serving size","p":"The numbers on a nutrition label are usually \"per serving\".","list":["First see how many grams one serving is","Then see how many servings are in a pack","Many snack packs actually hold 2–3 servings — multiply the calories"]},{"h":"Step 2: compare per 100 g","p":"When comparing two products, use the \"per 100 g\" column to be fair, since each company defines a serving differently."},{"h":"Step 3: check the key nutrients","p":"Calories, sugar, sodium, saturated fat and trans fat — the lower the better; protein and dietary fibre — the higher the better."},{"h":"Step 4: read the ingredient list","p":"Ingredients are listed from most to least. If sugar or oil is in the top three, be careful. Sugar has many other names: glucose syrup, fructose, maltose, sucrose."},{"h":"Step 5: find hidden trans fat","p":"If the ingredients include \"hydrogenated vegetable oil\", \"partially hydrogenated oil\" or \"shortening\", the product may contain trans fat."}],"viz":[{"type":"photos","title":"Nutrition labels of three canned tunas","items":[["tuna_a","Tuna A (in oil): 130 calories, 8 g protein, 16% fat"],["tuna_b","Tuna B: 110 calories, 18 g protein, 5% fat"],["tuna_c","Tuna C (in water): 80 calories, 20 g protein, 0% fat"]]},{"type":"table","title":"All canned tuna, but the labels differ a lot (per serving)","head":["","Calories","Protein","Fat"],"rows":[["Tuna A (in oil)","130","8 g","16%"],["Tuna B","110","18 g","5%"],["Tuna C (in water)","80","20 g","0%"]],"best":2,"note":"Tuna C has the fewest calories, the most protein and the least fat — the best choice. From class handouts."},{"type":"bars","title":"Daily added-sugar limit vs one can of soft drink","unit":"g","items":[["Ideal limit (WHO)",25],["One 330 ml can of soft drink",35,1],["Maximum limit (WHO)",50]],"note":"The World Health Organization recommends free sugars below 10% of daily calories (about 50 g), ideally below 5% (about 25 g). One teaspoon of sugar is about 4 g."},{"type":"table","title":"Breakfast cereal vs nutrition shake (grams)","head":["Per 100 g","Calories","Protein","Carbs","Fibre"],"rows":[["Instant cereal","364","6.5","79","6.3"],["Oatmeal A","403","8.8","76.5","1.6"],["Organic oats","379","13.2","67.7","10.1"],["Nutrition shake","378","35.8","26.9","18.1"]],"best":3,"note":"Similar calories, but the nutrition shake has much more protein and fibre, far fewer carbs, and 16 vitamins and minerals (oatmeal A has only vitamin E). Compiled from class handouts."}],"myth":{"m":"If the pack says \"low fat\", it's healthy.","f":"Many low-fat products add more sugar to make up for taste. Always check the sugar and total calories on the nutrition label."},"fact":{"num":"2000","unit":"mg","text":"The World Health Organization recommends adults consume less than 2000 mg of sodium a day (about 5 g of salt)."},"tips":["Spend 10 seconds reading the label before you buy","For drinks check sugar; for snacks check sodium and oil","The shorter and simpler the ingredient list, the better"],"task":"Pick up a snack or drink at home, find its calories, sugar and sodium per pack, and send a photo to your coach.","share":"Do you know anyone who only looks at the price when buying food, not the nutrition label?"},{"t":"Exercise","en":"Exercise","tag":"Plan","lead":"Exercise matters, but exercise alone won't make you lose weight.","intro":"Many people think more exercise alone will make them slim. Today we look at common mistakes, how many calories exercise really burns, and the benefits of exercise.","points":[{"h":"8 big weight-loss mistakes","p":"Many people make these mistakes when trying to lose weight — they end up more tired and rebound easily:","viz":[{"type":"chips","title":"How many are you making?","items":[["Cutting out carbs","No energy for the body to function"],["Starving yourself","Metabolism drops"],["Skipping dinner","Metabolism drops"],["Eating only fruit and vegetables","Fruit is high in sugar; muscle is lost"],["Avoiding meat","Can't build muscle"],["Staying up late","Body can't repair itself"],["Not drinking water","Nutrients aren't absorbed well"],["Exercising like crazy","Eating more than you burn, and losing muscle too"]],"cols":2}]},{"h":"Myth: can exercise alone make you lose weight?","p":"Many people think they can lose weight just by exercising more. In fact, exercise burns far fewer calories than you'd think:","viz":[{"type":"burn","title":"Eat one thing — how long must you exercise to burn it off?","items":[["1 can of soft drink",200,"Lunges",54],["1 piece of fried chicken breast",444,"Stationary bike",65],["1 milkshake",780,"Skipping rope",72],["1 doughnut",242,"Sit-ups",88],["Burger + fries",691,"Elliptical machine",141],["1 slice of cheesecake",710,"Brisk walking",148],["2 slices of pizza",626,"Climbing stairs",159]],"note":"Compiled from class reference charts; approximate values — actual burn depends on body weight and intensity."},{"type":"bars","title":"Roughly how many calories 30 minutes of exercise burns","unit":"kcal","items":[["Skipping rope",264],["Jogging",249],["Cycling",225],["Swimming",174],["Badminton",165],["Brisk walking",129],["Walking",105]],"note":"Values from class handouts; actual burn varies with body weight and intensity."}],"list":["A burger with fries takes about 141 minutes on an exercise bike to burn off","A big meal after exercise \"pays back\" the calories you burned — with interest","The 30 minutes after exercise are the golden time to refuel and repair muscle — eat right, not more"],"after":"So don't reward yourself with a feast after exercise."},{"h":"Benefits of exercise","p":"Although exercise alone rarely makes you lose weight, it has many benefits for your body:","viz":[{"type":"chips","title":"Benefits of exercise","items":[["Boosts metabolism","More muscle burns more"],["Improves heart and lung fitness","Walking and climbing stairs feel easier"],["Builds strength and endurance","More power for daily activities"],["Strengthens resistance","A stronger body"],["Better mood","Relieves stress"],["Shapes your body","Better muscle tone"]]}]},{"h":"What kind of exercise works best?","p":"No need to go all out at the start — consistency matters most:","list":["Cardio: brisk walking, jogging, swimming, cycling — start with 20–30 minutes a day","Strength training: squats, push-ups, resistance bands — keep muscle and raise metabolism","After exercise: rehydrate soon, and eat a portion of protein within 30–60 minutes","A little movement every day, consistently, works better than the occasional all-out session — and you're less likely to get injured"]},{"h":"Summary: exercise and nutrition go hand in hand","p":"Balanced nutrition and moderate exercise are the only sure way to stay healthy.","list":["Exercise without controlling your diet rarely shows results","Dieting without exercise easily loses muscle","Combine both: 80% nutrition + 20% exercise"],"viz":[{"type":"ratio","title":"Health = 80% nutrition + 20% exercise","parts":[["Nutrition",80,"Eat right, eat enough, stay within your magic number","var(--leaf)"],["Exercise",20,"Boost metabolism, keep muscle","var(--sun)"]]}]}],"viz":[],"myth":{"m":"I exercise, so I can eat whatever I want.","f":"Exercise burns fewer calories than you think. Without controlling your diet, it's easy to eat it all back — or more."},"fact":{"num":"150","unit":" min","text":"The World Health Organization recommends adults do at least 150 minutes of moderate exercise a week, plus strength training on 2 days a week."},"tips":["Take a 10–15 minute walk after meals","Take the stairs instead of the lift whenever you can","Exercising with a friend makes it easier to keep going"],"task":"Walk briskly for 20 minutes today, or do 3 sets of 10 squats at home, and remember to drink water afterwards.","share":"Do you know anyone who rarely exercises, or who eats a huge meal after exercising?","leadHL":false,"philo":"Exercise is just one part — nutrition, water and sleep matter just as much:"},{"t":"Food comparisons","en":"Food Comparison","tag":"Plan","lead":"Two meals can be worlds apart in nutrition and calories.","intro":"Over the first 9 days we learned about calories, water, cellular nutrition, breakfast, GI, protein, fat, labels and exercise. Today we put it all together to compare everyday foods.","points":[{"h":"Nutrient-rich vs empty calories","p":"The same 2000 calories can be eaten very differently:","viz":[{"type":"split","title":"The same 2000 calories","left":{"h":"Nutrient-rich foods","cls":"good","items":["High in nutrients, low in calories","Low sugar, less bad fat","Helps keep a healthy body and weight"]},"right":{"h":"Calorie-dense foods","cls":"bad","items":["High in calories, low in nutrients","High fat, high sugar","Easily leads to weight gain and malnutrition"]}}]},{"h":"What do we choose for breakfast?","p":"Breakfasts differ a lot in calories:","viz":[{"type":"kcal","title":"What do we choose for breakfast?","items":[["muffin","Muffin and coffee","640 kcal"],["campur","Economy rice / mixed rice","520 kcal"],["shake","Nutrition shake breakfast","150 kcal","3 scoops F1 + 2 scoops F3"]],"note":"Source: Indonesian Ministry of Health Food Composition Table 2015, class handouts."}]},{"h":"Hidden calories","p":"A drink with condensed milk, a portion of fried chicken skin, the coconut milk in a bowl of nasi lemak — all easily overlooked sources of calories."},{"h":"How many calories do you eat in a day?","p":"Three meals plus snacks a day — depending on how you eat, the total can differ hugely:","list":["Typical eating: about 3000 calories","Social events or holidays: on indulgent days, it can exceed 2000–2900 calories","Replacing one or two meals with a nutrition shake: about 1100–1400 calories"],"after":"
