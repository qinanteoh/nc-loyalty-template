<title>21天健康营养课</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: one phone-width column — progress header, 3×7 calendar of days, then the day's lesson card with charts and class slides */
:root{
  --bg:#eef3f0; --surface:#ffffff; --ink:#15302a; --muted:#5b6f69; --line:#d3dfda;
  --leaf:#1f6b54; --leaf-soft:#dcebe4; --sun:#e8892b; --sun-soft:#fbe9d6; --lock:#c3cfca;
  --bad:#c4473a; --bad-soft:#f8e1dd; --mid:#e3b23c; --water:#2f86c0; --water-soft:#dcecf7; --tissue:#e39b93;
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a17; --surface:#16241f; --ink:#e3eee9; --muted:#9db1aa; --line:#2a3d36;
  --leaf:#6cc2a2; --leaf-soft:#1d3a30; --sun:#f0a35a; --sun-soft:#3a2a1a; --lock:#3a4b45;
  --bad:#ef8a7c; --bad-soft:#3d2320; --mid:#e8c160; --water:#6db5e6; --water-soft:#1b3242; --tissue:#c47d76; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a17; --surface:#16241f; --ink:#e3eee9; --muted:#9db1aa; --line:#2a3d36;
  --leaf:#6cc2a2; --leaf-soft:#1d3a30; --sun:#f0a35a; --sun-soft:#3a2a1a; --lock:#3a4b45;
  --bad:#ef8a7c; --bad-soft:#3d2320; --mid:#e8c160; --water:#6db5e6; --water-soft:#1b3242; --tissue:#c47d76; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
.wrap{max-width:680px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--leaf);font-weight:700}
header{display:flex;flex-direction:column;gap:10px}
header h1{font-size:clamp(28px,7vw,40px);font-weight:900}
header p{color:var(--muted)}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog-num{font-family:var(--display);font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.prog-num small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.bar{flex:1;min-width:160px;display:grid;grid-template-columns:repeat(21,1fr);gap:3px}
.bar i{height:8px;border-radius:2px;background:var(--line)}
.bar i.on{background:var(--leaf)}
.status{background:var(--sun-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.status b{font-variant-numeric:tabular-nums;color:var(--sun)}
.cal{display:flex;flex-direction:column;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-label{font-size:12px;color:var(--muted);letter-spacing:.08em;display:flex;justify-content:space-between;gap:8px}
.tile{aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.tile .n{font-family:var(--display);font-weight:900;font-size:clamp(15px,4.4vw,20px);line-height:1}
.tile .s{font-size:10px;color:var(--muted);line-height:1.5;display:flex;align-items:center;height:15px}
.tile .s svg{width:11px;height:11px}
.tile.done{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.tile.done .s{color:var(--surface);opacity:.85}
.tile.today{border-color:var(--sun);border-width:2.5px;background:var(--sun-soft)}
.tile.today .s{color:var(--sun);font-weight:700}
.tile.locked{background:transparent;border-style:dashed;color:var(--lock);cursor:not-allowed}
.tile.locked .s{color:var(--lock)}
.tile.preview{cursor:pointer;color:var(--muted)}
.tile.sel{outline:3px solid var(--ink);outline-offset:2px}
.tile:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px clamp(16px,5vw,32px) 28px;display:flex;flex-direction:column;gap:22px;min-width:0}
.lesson-head{display:flex;flex-direction:column;gap:6px}
.daytag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.daytag .d{font-family:var(--display);font-weight:900;color:var(--sun);font-size:15px}
.chip{background:var(--leaf-soft);color:var(--leaf);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}
.lesson h2{font-size:clamp(24px,6vw,32px);font-weight:900}
.lesson .en{color:var(--muted);font-size:13px}
.lead{font-size:18px;font-weight:700;font-family:var(--display);line-height:1.55}
.intro{color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:4px;height:1em;background:var(--sun);border-radius:2px}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:pt}
.points>li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:pt}
.points>li::before{content:counter(pt);width:26px;height:26px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.points>li>div>b{display:block;font-size:16px}
.points>li>div>span{color:var(--muted);font-size:15px}


.hook{background:var(--leaf);color:var(--surface);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hook .eyebrow{color:var(--surface);opacity:.85}
.hook .q{font-family:var(--display);font-weight:900;font-size:clamp(18px,4.8vw,21px);line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-size:15px;text-align:left;background:var(--surface);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 14px;cursor:pointer;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start}
.opt i{font-style:normal;font-weight:700;color:var(--leaf)}
.opt:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--sun);background:var(--sun-soft)}
.opt.right span::after{content:" ✓";color:var(--sun);font-weight:700}
.opt.wrong{opacity:.6;text-decoration:line-through}
.answer{background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:15px}
.answer b{color:var(--sun)}
.hook-hint{font-size:13px;opacity:.85}
.pfigs{display:grid;gap:8px;margin-top:10px}
.pfigs.n2{grid-template-columns:1fr 1fr} .pfigs.n3{grid-template-columns:1fr 1fr 1fr}
.pfig{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.pfig button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:zoom-in;display:block;width:100%}
.pfig img{display:block;width:100%;height:auto;max-width:100%}
.fg{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.fg-grp{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.fg-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 12px;color:#fff}
.fg-h b{font-size:15px} .fg-h span{font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}
.fg-grp.hi .fg-h{background:var(--bad)} .fg-grp.mid .fg-h{background:var(--mid);color:#3a2a00} .fg-grp.lo .fg-h{background:var(--leaf);color:var(--surface)}
.fg-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px 8px;padding:12px 10px}
.fg-it{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center}
.fg-it img{width:100%;max-width:100%;height:auto;aspect-ratio:1;border-radius:10px;object-fit:cover;display:block}
.fg-n{font-size:13px;line-height:1.3}
.fg-v{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 8px;border-radius:99px;color:#fff}
.fg-grp.hi .fg-v{background:var(--bad)} .fg-grp.mid .fg-v{background:var(--mid);color:#3a2a00} .fg-grp.lo .fg-v{background:var(--leaf);color:var(--surface)}
.points .fg-h span{color:inherit;font-size:12px}
.points .fg-n{color:var(--ink);font-size:13px}
.points .fg-v{color:#fff;font-size:12px}
.points .fg-grp.mid .fg-v{color:#3a2a00}
.points .fg-grp.lo .fg-v{color:var(--surface)}
.pviz{margin-top:10px}
.pviz .viz{background:var(--bg)}
.kc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.kc-it{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.kc-it img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;max-width:100%}
.points .kc-n{color:var(--ink);font-size:13px;line-height:1.35}
.points .kc-v,.kc-v{background:var(--sun);color:#fff;font-weight:700;font-size:12px;border-radius:99px;padding:1px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.points .kc-s{font-size:11px;color:var(--muted)}
.portion{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.portion>div{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--leaf);min-width:0}
.portion>div.pro{border-top-color:var(--sun)}
.portion h4{margin:0;font-size:16px}
.points .portion .kcal{font-family:var(--display);font-weight:900;font-size:26px;color:var(--leaf);line-height:1;font-variant-numeric:tabular-nums}
.points .portion .pro .kcal{color:var(--sun)}
.points .portion .kcal small{font-size:13px;font-family:var(--body);font-weight:700;margin-left:2px}
.points .portion .unit{font-size:12px;color:var(--muted)}
.portion ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.portion li{display:flex;align-items:center;gap:8px;font-size:14px}
.portion li img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}
.portion li i{width:40px;height:40px;border-radius:8px;flex:none;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:var(--leaf)}
.portion .pro li i{background:var(--sun-soft);color:var(--sun)}
.points .portion li em{font-style:normal;font-size:11px;color:var(--bad);font-weight:700;display:block;line-height:1.3}
.bodyw{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.bodyw svg{width:110px;height:auto;max-width:100%}
.bodyw ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bodyw li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px}
.points .bodyw li b{font-family:var(--display);font-size:22px;color:var(--water);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo figure{margin:0;background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.duo svg{width:100%;height:auto;display:block}
.duo figcaption{font-size:13px;text-align:center;font-weight:700}
.duo .ok figcaption{color:var(--leaf)} .duo .no figcaption{color:var(--bad)}
.points .duo p{font-size:12px;color:var(--muted);text-align:center;margin:0}
.sug{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sug svg{width:100%;height:auto;display:block}
.points .sug .cap{font-size:13px;font-weight:700}
.sug.no .cap{color:var(--bad)} .sug.ok .cap{color:var(--leaf)}
.flow{display:flex;flex-direction:column;gap:6px}
.flow-step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 12px}
.flow-step i{width:30px;height:30px;border-radius:50%;background:var(--leaf);color:var(--surface);font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.points .flow-step b{font-size:15px;display:block} .points .flow-step span{font-size:13px;color:var(--muted)}
.flow-arrow{text-align:center;color:var(--leaf);font-size:16px;line-height:1}
.flow-targets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.points .flow-targets span{background:var(--leaf-soft);color:var(--leaf);font-weight:700;font-size:13px;border-radius:99px;padding:3px 12px}
.swap{display:flex;flex-direction:column;gap:8px}
.swap-row{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:4px}
.swap-c{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:10px;padding:6px;min-width:0;min-height:50px}
.swap-c img{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none}
.swap-c>div{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.points .swap-c span{font-size:13px;color:var(--ink);line-height:1.3;white-space:nowrap}
.swap-c>div{flex:1}
.points .swap-c b{font-size:12px;color:#fff;border-radius:99px;padding:0 8px;font-variant-numeric:tabular-nums}
.swap-c.hi b{background:var(--bad)} .swap-c.lo b{background:var(--leaf);color:var(--surface)} .swap-c.mid b{background:var(--mid);color:#3a2a00}
.swap-ph{width:36px;height:36px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;background:var(--leaf-soft);color:var(--leaf)}
.swap-row>.ar{color:var(--leaf);font-weight:900;text-align:center}
.mwf{display:flex;flex-direction:column;gap:10px}
.mwf-row{display:grid;grid-template-columns:68px 1fr;gap:10px;align-items:center}
.points .mwf-row>span{font-weight:700;font-size:14px;color:var(--ink)}
.mwf-blocks{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.mwf-blocks div{border-radius:8px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1.1}
.mwf-blocks small{font-size:10px;font-weight:700}
.mwf-blocks .m{background:var(--leaf)} .mwf-blocks .w{background:var(--water)} .mwf-blocks .f{background:var(--sun)}
.points .mwf-row em{font-style:normal;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-left:4px}
.mwf-row em.ok{background:var(--leaf-soft);color:var(--leaf)} .mwf-row em.no{background:var(--bad-soft);color:var(--bad)}
.nl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:nl}
.nl li{counter-increment:nl;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px}
.nl li::before{content:counter(nl);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;background:var(--leaf)}
.nl li:nth-child(3n+2)::before{background:var(--sun)} .nl li:nth-child(3n)::before{background:var(--water)}
.bal{display:flex;flex-direction:column;gap:8px}
.bal-row{display:grid;grid-template-columns:1fr 30px 1fr 84px;gap:6px;align-items:center}
.points .bal-row>span{font-size:13px;font-weight:700;text-align:center;border-radius:8px;padding:8px 4px;color:var(--ink)}
.points .bal-row .in{background:var(--sun-soft)} .points .bal-row .out{background:var(--leaf-soft)}
.points .bal-row .op{font-family:var(--display);font-size:22px;font-weight:900;color:var(--ink);background:none;padding:0}
.points .bal-row .res{color:#fff}
.bal-row .res.down{background:var(--leaf)} .bal-row .res.same{background:var(--water)} .bal-row .res.up{background:var(--bad)}
.donut{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media (max-width:420px){.donut{grid-template-columns:1fr;justify-items:center}}
.donut svg{width:150px;height:150px}
.donut ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
.donut li{display:flex;align-items:center;gap:8px;font-size:14px}
.donut li i{width:12px;height:12px;border-radius:3px;flex:none}
.points .donut li b{margin-left:auto;font-variant-numeric:tabular-nums}
.donut-extra{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.points .donut-extra span{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--ink)}
.bub{display:flex;flex-wrap:wrap;justify-content:center;padding:6px 0}
.bub div{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;line-height:1.3;margin:0 -6px;mix-blend-mode:multiply;color:var(--ink)}
:root[data-theme="dark"] .bub div{mix-blend-mode:normal}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bub div{mix-blend-mode:normal}}
.bub div:nth-child(6n+1){background:var(--water-soft)} .bub div:nth-child(6n+2){background:var(--leaf-soft)} .bub div:nth-child(6n+3){background:var(--sun-soft)}
.bub div:nth-child(6n+4){background:var(--bad-soft)} .bub div:nth-child(6n+5){background:var(--leaf-soft)} .bub div:nth-child(6n){background:var(--water-soft)}
.cloud{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cloud span{border-radius:99px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;color:#fff;line-height:1.15;text-align:center}
.cloud span small{font-size:10px;font-weight:500;opacity:.9}
.cloud .v{background:var(--sun)} .cloud .m{background:var(--water)} .cloud .o{background:var(--leaf);color:var(--surface)}
.cloud .s1{width:62px;height:62px;font-size:13px} .cloud .s2{width:74px;height:74px;font-size:14px} .cloud .s3{width:54px;height:54px;font-size:12px}
.rb{display:flex;flex-direction:column;gap:10px}
.rb-base{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:10px}
.rb-base img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.points .rb-base b{display:block;font-size:16px;color:var(--ink)} .points .rb-base span{font-family:var(--display);font-weight:900;font-size:22px;color:var(--sun)}
.rb-eq{text-align:center;font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.1em}
.rb-items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rb-it{background:var(--surface);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;border-bottom:4px solid var(--sun);min-width:0}
.rb-it img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;display:block;max-width:100%}
.rb-tx{padding:8px 10px;display:flex;flex-direction:column;gap:2px}

.slides{display:flex;flex-direction:column;gap:14px}

.actions{display:flex;flex-direction:column;gap:8px}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:var(--leaf);color:var(--surface)}

餐、零食和饮料，都要先摆盘，拍照传给教练看，然后才吃。","share":"你有认识谁吃了过多的卡路里而超重，或者吃得太少而过轻的吗？","template":{"title":"先摆盘，再拍照传给教练","img":"plate_template","tips":["把饭、菜、肉分开摆在盘子上，一眼就看得出分量","叉子和汤匙放在盘边，方便教练估算分量","从正上方拍，把整个盘子拍进去","每一餐、每一样零食和饮料都要拍，吃之前先传给教练"],"note":"图中的绿色标签是教练帮你计算的卡路里，例如：菜 200 kcal + 鸡 300 kcal = 500 kcal。"}},{"t":"水的重要性","en":"Importance of Water","tag":"营养","lead":"身体里每一个化学反应都需要水，喝够水是健康的第一步。","intro":"我们可以几个星期不吃东西，但几天不喝水就会有生命危险。水是身体最基本、也最容易被忽略的营养素。","points":[{"h":"身体有六成是水","p":"人体约六到七成是水。","viz":[{"type":"body","title":"身体里的水分","level":0.65,"items":[["大脑","75%"],["肝脏","86%"],["肌肉","86%"]],"note":"全身约六到七成是水，资料来自课堂讲义。"}],"list":["大脑、肝脏、肌肉、血液都含有大量水分","体温调节、营养输送都要靠水","帮助身体通过汗水、尿液和粪便排出废物"]},{"h":"一天要喝多少水？","p":"增加营养摄取和进行体重管理时，水分更加重要。","list":["每公斤体重每天 40–50 毫升","大约是每天 3–4 公升","以 400 毫升一杯计算，约 8–10 杯"]},{"h":"每个人都需要足够的水","p":"除了少数特殊情况，每个人都需要摄取足够的水分。","list":["例外：因为特殊疾病（例如某些肾脏或心脏疾病），医生交代要限制喝水的人","不确定自己是否属于这种情况，请先问医生"]},{"h":"口渴时已经缺水了","p":"等到觉得口渴，身体其实已经轻微缺水。缺水时身体会发出警报，可能出现肌肉痉挛、疲劳、便秘和皮肤干燥。"},{"h":"渴和饿常被搞混","p":"很多时候我们以为自己饿了，其实只是渴了。想吃零食之前，先喝一杯水，等 10 分钟再决定。"},{"h":"低卡路里的补水选择","p":"除了白开水，芦荟汁和草本茶饮也是很好的补水选择。","viz":[{"type":"kcal","title":"补水饮品：选对了，热量差很多","items":[["aloe","芦荟汁","低卡路里","帮助补水"],["tea","草本茶饮","低卡路里","帮助补水"],["icedrink","含糖饮料","160–200 kcal","一杯"]]}],"list":["热量很低","味道清爽，更容易喝够一天的水","可以用来代替含糖饮料"]},{"h":"喝水帮助代谢","p":"身体分解脂肪、排出代谢废物都需要水。水喝不够，代谢效率会变差，也容易便秘。"},{"h":"喝水不会水肿，喝不够才会","p":"很多人怕喝多了水会水肿，其实刚好相反。","list":["水喝不够：身体以为缺水，会把水分留住，人反而容易浮肿","每天喝够水：身体才会放心把多余的水分排出去","水喝足够：皮肤更水润，减重的效果也会更好"],"after":"想要脸部少细纹、皮肤好，就要多喝水！"},{"h":"水喝不够，可能出现好转反应","p":"刚开始调整饮食时，如果水喝得不够，少数人（大约每 100 人中有 5 人）可能出现身体调整的反应。","viz":[{"type":"bubbles","title":"可能出现的好转反应","items":["头晕","头痛","恶心作呕","长疹","心跳加速","腹泻","便秘"],"note":"出现这些反应时，记得多喝水，这是身体调整期的自然反应。但不要把所有症状都当成好转反应，如有不适，请马上咨询医生。"}],"list":["最重要的是多喝水","继续按餐单进食，千万不要中断每天的营养奶昔","每个人体质不同，反应因人而异，一段日子后会慢慢消失"],"after":"不过，不要把所有的不舒服都当成好转反应；如有不适，请马上咨询医生。"}],"viz":[{"type":"cups","title":"每天喝多少杯水？（一杯以 400 毫升计算）","rows":[["一般建议",10,"8–10 杯，约 3.2–4 公升"],["男性",9,"约 3.7 公升"],["女性",7,"约 2.7 公升"]],"note":"一般建议每天约 8–10 杯水。男性和女性的数字来自美国国家科学、工程和医学研究院，约两成水分可以来自食物。"}],"myth":{"m":"喝汽水、咖啡、奶茶也算是喝水。","f":"含糖饮料会带来大量热量，咖啡因也有利尿作用。补充水分最好还是白开水，其次是无糖茶。"},"fact":{"num":"60","unit":"%","text":"成年人体重中水分大约占的比例。"},"tips":["早上起床先喝一杯温水","每次上完厕所就喝几口水","在手机设定每小时提醒喝水"],"task":"用下面的计算器算出你每天应该喝多少水，准备一个 400 毫升的水杯或有刻度的水瓶，记录今天一共喝了几杯。","share":"你有认识谁平时很少喝白开水的吗？","calc":"water"},{"t":"细胞营养","en":"Cellular Nutrition","tag":"营养","lead":"人只生一种病：细胞生病。吃饱肚子，不等于喂饱了细胞。","intro":"身体由数十万亿个细胞组成，每分钟都有大量细胞死亡和更新。新细胞健不健康，取决于你给它什么原料。","points":[{"h":"细胞是健康的基本单位","p":"皮肤、肌肉、器官、血液都由细胞组成。细胞得到足够营养，就能正常运作和修复；营养不够，细胞功能就会慢慢变差。"},{"h":"细胞需要七大营养","p":"蛋白质、碳水化合物、脂肪、维他命、矿物质、膳食纤维和水，缺一不可。只吃饱而没吃对，细胞仍然会「饿」。"},{"h":"营养在小肠被吸收","p":"小肠内壁布满细小的绒毛，大大增加了吸收面积。肠道健康，吃进去的营养才真正用得上。","viz":[{"type":"villi","title":"小肠绒毛：健康 vs 受损"}]},{"h":"什么会伤害小肠绒毛？","p":"以下这些都可能让小肠绒毛阻塞或受损，影响营养吸收：","list":["不健康的食物：饱和脂肪、反式脂肪、精制糖、精致淀粉、过多的盐","食品添加剂和防腐剂","压力","吸烟、喝酒","药物","污染、农药和空气中的有害物质"],"after":"均衡营养有助于保护和修复肠道，让细胞得到充足的营养。"},{"h":"蛋白质怎样喂饱细胞？","p":"食物里的蛋白质，是这样被身体利用的：","viz":[{"type":"flow","title":"蛋白质的旅程","steps":[["食物里的蛋白质","鸡、鱼、蛋、豆腐、营养奶昔"],["分解成氨基酸","在消化道被分解"],["被小肠吸收","约 15 分钟内迅速吸收"]],"targets":["脑细胞","皮肤细胞","肌肉细胞","其他器官的细胞"]}]},{"h":"热量过多，营养不足","p":"现代饮食常常是油、糖、精致淀粉多，蔬果、蛋白质和微量营养素少。很多人体重超标，细胞却营养不良。"},{"h":"填补营养缺口","p":"先把饮食吃均衡，再按需要使用营养补充品，帮助填补日常饮食的营养缺口。"}],"viz":[{"type":"chips","title":"细胞需要的七大营养素","items":[["蛋白质","构成和修复细胞"],["碳水化合物","主要能量来源"],["脂肪","细胞膜、荷尔蒙原料"],["维他命","调节身体机能"],["矿物质","骨骼、神经、肌肉"],["膳食纤维","肠道健康"],["水","一切反应的环境"]]}],"myth":{"m":"我吃得很饱，所以营养一定够。","f":"吃饱只代表热量够了。营养够不够，要看吃进去的食物种类是否均衡。"},"fact":{"num":"90","unit":"%","text":"身体所需的营养，大约九成是通过小肠绒毛吸收的。"},"tips":["每餐都有一份蛋白质","每天吃不同颜色的蔬果","少吃加工食品，多吃原形食物"],"task":"看看今天的餐盘，数一数七大营养素你吃到了几种，缺了哪几种。","share":"你有认识谁经常吃不健康的食物，生活方式又不太理想的吗？","philo":"细胞要健康，营养就要均衡。记住这张图："},{"t":"理想早餐","en":"Ideal Breakfast","tag":"餐单","lead":"以优质蛋白质为主、加上高纤维的早餐，可以帮你稳定一整天的血糖。","intro":"经过一整晚没有进食，早上身体最需要补充营养。早餐吃什么，会影响一整天的血糖、精神和食欲。","points":[{"h":"早餐打破一夜空腹","p":"睡眠时身体仍在消耗能量。早上补充营养，帮助身体启动、稳定血糖，让你上午更有精神。"},{"h":"什么是理想早餐？","p":"理想早餐 = 优质蛋白质 + 高纤维食物 + 足够的水。","list":["优质蛋白质：鸡蛋、豆腐、鸡胸肉、营养奶昔","高纤维食物：蔬菜、水果、燕麦、全谷类","足够的水：起床先喝一杯"],"after":"这样的早餐消化慢，血糖稳，不但饱到中午，还能帮你稳定一整天的血糖。","viz":[{"type":"portion","title":"理想早餐吃什么？","carb":{"h":"高纤维食物","items":[["蔬菜","vege"],["水果","guava"],["燕麦 / 全谷类","brownrice_k"]]},"pro":{"h":"优质蛋白质","items":[["鸡蛋","egg"],["豆腐","tofu"],["鸡胸肉","chicken"],["营养奶昔","shake"]]}}]},{"h":"为什么蛋白质和纤维让你不容易饿？","p":"消化系统会和大脑沟通，告诉它「饱了没有」。不同的食物，传给大脑的信号不一样：","list":["甜食、淀粉、酒精：刺激大脑「还可以吃更多」，容易暴食","蛋白质：消化后会告诉大脑「已经饱了，不要再吃了」","纤维：增加肠胃里的体积，消化变慢，产生饱腹感"],"after":"记住：要吃得够慢。吃太快的话，大脑还没收到「饱」的信号，你就已经吃太多了。","viz":[{"type":"split","title":"食物给大脑的信号","left":{"h":"「饱了，不要再吃」","cls":"good","items":["蛋白质：鸡蛋、豆腐、鱼、鸡肉","纤维：蔬菜、水果、全谷类","饱足感更持久"]},"right":{"h":"「还可以吃更多」","cls":"bad","items":["甜食","淀粉","酒精","容易越吃越多"]}}]},{"h":"血糖过山车","p":"谷类、面包、粥、面、饭这类高碳水化合物早餐，会让血糖像坐过山车一样：","list":["冲上去：吃完血糖急速升高","掉下来：身体分泌大量胰岛素，把血糖压下去，转成脂肪储存","掉到谷底：觉得疲倦、很快又饿","再上车：特别想吃糖和淀粉，又一次冲上去"],"after":"一天坐好几次过山车，是糖尿病、高血压和超重的主要原因之一。换成以蛋白质为主的早餐，血糖就会平稳得多。","viz":[{"type":"sugar","mode":"spike","cap":"高碳水早餐：血糖过山车","title":"一天的血糖变化"},{"type":"sugar","mode":"steady","cap":"以优质蛋白为主的早餐：血糖平稳","title":"一天的血糖变化"}]},{"h":"不吃早餐也一样","p":"不吃早餐，同样会掉进血糖循环：","list":["血糖降低，觉得饿、没力气","特别想吃简单碳水化合物来解饿","血糖又急升急降"]},{"h":"少量多餐更稳定","p":"一天分 5 次进食：早餐、上午小点心、午餐、下午小点心、晚餐。避免饿过头，下一餐就不容易暴饮暴食。"},{"h":"快速又营养","p":"早上时间紧，一份营养奶昔或简单的蛋白质早餐，几分钟就能准备好，比在外排队买早餐更省时。"}],"viz":[{"type":"timeline","title":"高碳水早餐的恶性循环","items":[["吃高碳水早餐","面包、粥、面、饭、甜饮料"],["血糖急速升高","胰脏分泌大量胰岛素"],["糖分转成脂肪","血糖短时间内骤降"],["又饿又想吃糖","再吃更多碳水化合物，循环重来"]]},{"type":"timeline","title":"一天 5 餐参考时间表","items":[["早餐","约 150 kcal","以蛋白质为主"],["上午 9 点","约 100 kcal","一份水果"],["午餐","约 500 kcal","蔬菜 + 蛋白质 + 复合碳水"],["下午 4 点","约 150 kcal","蛋白质小点心"],["晚餐","约 500 kcal","蔬菜 + 瘦肉 / 鱼"]],"note":"总计约 1400 kcal 的参考示例。实际份量请教练按你的身高、体重和目标调整。"}],"myth":{"m":"不吃早餐可以少吃一餐，更容易瘦。","f":"不吃早餐容易让午餐和晚餐吃得更多，也更想吃甜食和淀粉。规律进食更容易控制总热量。"},"fact":{"num":"5","unit":"餐","text":"一天分 5 次进食（3 正餐 + 2 小点心），有助于稳定血糖和控制饥饿感。"},"tips":["前一晚先把早餐准备好","把甜咖啡换成黑咖啡或无糖茶","上午准备一份水果当点心"],"task":"明天早餐加入一份蛋白质，比如鸡蛋、无糖豆浆，或在营养奶昔里加入 F3 蛋白粉，加强蛋白质。留意上午的饥饿感有没有不同。","share":"你有认识谁经常吃以碳水化合物为主的早餐，或者常常不吃早餐的吗？","leadHL":true,"philo":"理想早餐，就是把这张图放进你的第一餐："},{"t":"认识升糖指数","en":"Low Glycemic Index","tag":"营养","lead":"不吃甜食就不会得糖尿病？常吃高升糖食物才是真正的血糖杀手。","intro":"不只是糖果和蛋糕会让血糖升高。白饭、白面包、面条这些天天吃的主食，同样会让血糖快速上升。","points":[{"h":"什么是升糖指数（GI）？","p":"GI 反映碳水化合物食物被消化成葡萄糖、让血糖上升的速度。GI 越高，血糖升得越快。","foods":[{"h":"高升糖指数食品","sub":"70 或以上","cls":"hi","items":[["chaomifen","炒米粉",98],["karipap","咖喱角",87],["fries","炸薯条",85],["soda","汽水",85],["tehtarik","拉茶",73],["roticanai","Roti canai",71],["bread","白面包",70]]},{"h":"中等升糖指数食品","sub":"56–69","cls":"mid","items":[["burger","汉堡包",67],["sushi","寿司",67],["apricot","杏果",61],["mango","芒果",60],["udon","乌冬面",58],["papaya","木瓜",58]]},{"h":"低升糖指数食品","sub":"55 或以下","cls":"lo","items":[["apple","苹果",55],["brownrice","糙米饭",50],["sweetpotato","番薯",48],["tomato","番茄",30],["corn","白玉米",26],["f1","F1 奶昔",16],["peanut","花生",14],["broccoli","花椰菜",10],["mushroom","菇类",10]]}]},{"h":"还记得第 4 天的血糖过山车吗？","p":"让血糖坐上过山车的，就是高 GI 食物。","list":["高 GI 食物：血糖冲得快、掉得快，很快又饿","低 GI 食物：血糖慢慢上升，平稳又持久"],"after":"所以选对 GI，就能让血糖下车，不再上上下下。"},{"h":"胰脏太辛苦，最后会「罢工」","p":"血糖升高时，胰脏要分泌胰岛素把血糖降下来。可以把胰脏想象成一个员工：","list":["常吃高 GI 食物：胰脏每天都要加班","身体对胰岛素越来越不敏感：胰脏要分泌更多胰岛素才压得住血糖，这就是「胰岛素抵抗」（insulin resistance）","长期过劳：胰脏累坏了，开始「罢工」，血糖就控制不住"],"after":"这时候，二型糖尿病的风险就大大增加了。"},{"h":"长期的风险","p":"长期血糖起伏大，最常见的是胰岛素抵抗和二型糖尿病，也可能影响身体这些部位：","viz":[{"type":"chips","title":"长期血糖过高，可能影响","items":[["眼睛","视力问题"],["心脏","心脏病发作"],["大脑","中风"],["肾脏","肾脏损坏"],["神经","神经损伤"],["伤口","不易愈合"]]}]},{"h":"低 GI 的选择","p":"低 GI 的食物转化成血糖的速度较慢，好处很多：","viz":[{"type":"swap","title":"饮食转换：从高 GI 换成低 GI","rows":[[["白饭","92","hi","k_rice"],["糙米饭","50","lo","k_brownrice_k"]],[["炒米粉","98","hi","food_chaomifen"],["乌冬面","58","mid","food_udon"]],[["白面包","70","hi","food_bread"],["全麦面包","64","mid"]],[["汽水","85","hi","food_soda"],["白开水","","lo"]],[["拉茶","73","hi","food_tehtarik"],["无糖茶","","lo"]],[["芒果","60","mid","food_mango"],["苹果","55","lo","food_apple"]]],"note":"数值来自课堂讲义。"}],"list":["饱足感更持久","能量稳定地输送到全身","特别适合正在管理体重的人"],"after":"糙米、燕麦、豆类、大部分蔬菜都是好选择。"}],"viz":[{"type":"scale","title":"本地常见食物的升糖指数","min":0,"max":100,"zones":[[0,55,"低 GI","lo"],[55,70,"中","mid"],[70,100,"高 GI","hi"]],"marks":[["炒米粉",98],["白饭",92],["咖喱角",87],["面条",85],["汽水",85],["炸薯条",85],["拉茶",73],["Roti canai",71],["白面包",70],["汉堡包",67],["全麦面包",64],["芒果",60],["香蕉",52],["糙米饭",50],["番薯",48],["番茄",30],["F1 奶昔",16],["花生",14],["花椰菜",10]],"note":"数值来自课堂讲义，实际数值会因品种和煮法而不同。"}],"myth":{"m":"我不吃甜的，所以不会有血糖问题。","f":"白饭、白面包、粥等精致淀粉的 GI 也很高。控制血糖要看整体饮食，不只是甜食。"},"fact":{"num":"≤55","unit":"","text":"GI 值 55 以下为低升糖，56–69 为中，70 以上为高升糖。"},"tips":["白饭换成一半糙米或杂粮饭","吃饭时先吃菜和肉，最后吃饭","水果直接吃，不要打成果汁"],"task":"今天其中一餐，把白饭换成一半糙米，或者多加一份蔬菜、少吃半碗饭。","share":"你有认识谁不知道食物的升糖指数，也不知道高升糖食物的危害吗？"},{"t":"蛋白质的重要性","en":"Importance of Protein","tag":"营养","lead":"除了脂肪和骨骼，身体的「瘦体重」主要由蛋白质构成。","intro":"蛋白质是身体的建筑材料。肌肉、皮肤、头发、酵素、荷尔蒙、抗体都需要它，而身体无法大量储存蛋白质，所以每天都要补充。","points":[{"h":"蛋白质的八大作用","p":"蛋白质在身体里的工作很多，看看下面这张图：","viz":[{"type":"chips","title":"蛋白质在身体里的作用","items":[["提供身体结构","支撑身体"],["组成和修复组织","肌肉、皮肤、头发"],["帮助消化酵素","促进化学反应"],["支持免疫","制造抗体"],["协调荷尔蒙","调节身体功能"],["运送营养","在体内移动必需分子"],["调节 DNA","支持 DNA 和 RNA 的表达"],["支持肌肉","收缩和活动"]]}]},{"h":"每天需要多少蛋白质？","p":"蛋白质的需要量，要看你的目标：","list":["维持体重：每公斤体重每天 0.8–1.2 克","减重：每公斤体重每天 1.2–1.6 克","增重：每公斤体重每天 1.6–2.2 克"],"after":"例如 60 公斤的人：维持体重约 48–72 克，减重约 72–96 克，增重约 96–132 克。减重的人特别要吃够蛋白质，不然肌肉会不断流失，一停下来就很容易复胖。用下面「今日小任务」的计算器算算你自己的需要量。"},{"h":"饱足感更持久","p":"蛋白质消化较慢，能让你更久不饿。每餐有足够蛋白质，是控制食欲最简单的方法。"},{"h":"减重有健康和不健康之分","p":"身体由肌肉、水分和脂肪组成，减掉的是哪一种很重要。","viz":[{"type":"mwf","title":"人体由肌肉、水分和脂肪组成：减重的三种结果","rows":[["原本",44,44,44,"",""],["节食减重",28,30,44,"不健康","no"],["均衡营养",44,44,26,"健康","ok"]],"note":"M 肌肉、W 水分、F 脂肪。节食减掉的是肌肉和水分，均衡营养主要减掉脂肪。"}],"list":["节食减肥：减掉的多是肌肉和水分，脂肪留下来，精神、免疫力和代谢都会下降","均衡营养减重：减少卡路里，同时吃到均衡营养，主要减掉脂肪、保住肌肉","结果：体力充足、免疫力提升、代谢维持，而且不会觉得饿"]},{"h":"吃够蛋白质，减重后不容易复胖","p":"减重时蛋白质吃得够，身体才能保住肌肉。","list":["肌肉保住了，新陈代谢就不会变慢","代谢正常，恢复正常饮食后体重比较稳定","蛋白质不够：肌肉不断流失，代谢变慢，一停下来就很容易复胖"],"after":"所以减重期间，蛋白质要吃到每公斤体重 1.2–1.6 克，不只是少吃。"},{"h":"年龄越大越重要","p":"30 岁以后，肌肉量会随年龄慢慢流失。足够的蛋白质加上肌力训练，可以减缓这个过程。"},{"h":"优质蛋白 vs 低质蛋白","p":"同样是蛋白质，身体能吸收多少、要吃多少才够，差别很大。","list":["优质蛋白：吸收率高，含有身体需要的完整氨基酸，吃少量就够","低质蛋白：吸收率低，缺少某些必需氨基酸，要吃很多才够"],"after":"所以每餐要选优质蛋白，才能真正吃够身体需要的蛋白质。","viz":[{"type":"versus","title":"优质蛋白 vs 低质蛋白","good":{"h":"优质蛋白 · 吸收率高","items":[["chicken","鸡肉"],["salmon","鱼"],["egg","鸡蛋"],["tofu","豆腐"],["shake","营养奶昔"]],"points":["吸收率高，评分接近 1.00","含有完整的必需氨基酸","吃少量就能吃够"]},"bad":{"h":"低质蛋白 · 吸收率低","items":[["redbean","红豆"],["mungbean","绿豆"],["brownrice_k","全谷类"],["bread","面包"]],"points":["吸收率较低","缺少某些必需氨基酸","要吃很多才够"]}},{"type":"bars","title":"蛋白质吸收率评分（满分 1.00）","unit":"","items":[["大豆",1,0],["酪蛋白（牛奶）",1,0],["鸡蛋蛋白",1,0],["牛肉",0.92],["青豆粉",0.69],["红豆",0.68],["斑豆",0.63],["全麦",0.4],["小麦面筋",0.25]],"note":"这个评分（PDCAAS）代表蛋白质被人体吸收利用的程度，分数越高越好。大豆、牛奶和鸡蛋都是满分 1.00 的优质蛋白质。"},{"type":"kcal","title":"要吃多少，才有约 25 克蛋白质？","items":[["chicken","鸡胸肉","约 80 克","一个手掌"],["salmon","鱼","约 115 克","一块鱼片"],["egg","鸡蛋","约 4 粒",""],["tofu","豆腐","约 170 克","大半块"],["redbean","红豆（煮熟）","约 280 克","一大碗"],["brownrice_k","糙米饭","约 830 克","约 5 碗饭"]],"note":"按每 100 克的约略蛋白质含量计算。低质蛋白要吃很多，热量也会跟着增加。"}]},{"h":"素食者怎样吃够优质蛋白？","p":"吃素一样可以吃够优质蛋白，重点是选对来源、懂得搭配：","list":["黄豆类最好：豆腐、天贝、毛豆、无糖豆浆，吸收率评分满分 1.00","蛋奶素：鸡蛋和低脂牛奶也是满分的优质蛋白","豆类 + 谷类一起吃：例如红豆、豌豆配糙米饭或燕麦，氨基酸可以互相补足","营养奶昔：以大豆蛋白为主，方便补足每天的蛋白质"],"after":"吃全素的人更要留意，每一餐都要有一份黄豆类食物。","viz":[{"type":"kcal","title":"素食者的蛋白质来源（每 100 克）","items":[["soybean","黄豆（毛豆）","约 13 克","吸收率满分"],["tempeh","天贝","约 19 克","黄豆发酵"],["tofu","豆腐","约 17 克","板豆腐"],["egg","鸡蛋","约 13 克","蛋奶素"],["oats","燕麦","约 17 克","配豆类吃"],["redbean","红腰豆","约 5 克","配谷类吃"],["peas","豌豆","约 5 克","配谷类吃"],["pb","花生酱","约 25 克","脂肪高，1 汤匙就好"],["shake","营养奶昔","大豆蛋白","方便补充"]],"note":"约略数值。黄豆类和蛋奶的吸收率最高；豆类和谷类（燕麦、糙米）要搭配着吃，营养才完整。花生酱蛋白质高，但脂肪和热量也高，要控制分量。"},{"type":"bars","title":"植物性食物的蛋白质含量（每 100 克）","unit":"g","items":[["南瓜子",33],["花生酱",25.1],["杏仁",22.1],["亚麻籽",19.5],["豆腐",17.2],["燕麦",16.9],["奇亚籽",15.6],["腰果",15.3],["核桃",15],["黄豆（毛豆）",13.1],["扁豆",9],["鹰嘴豆",8.9],["全麦面包",8.8],["豌豆",5.4],["红腰豆",4.8],["藜麦",4.4],["菠菜",2.9],["糙米",2.6],["马铃薯",2.5]],"note":"坚果和种子蛋白质高，但脂肪和热量也很高，每天一小把就够。黄豆类（豆腐、天贝、毛豆）是素食者最好的蛋白质来源。"}]},{"h":"从天然食物中找蛋白质","p":"优质蛋白质有两种来源：","list":["植物蛋白：豆腐、天贝、扁豆、黄豆","动物蛋白：鸡蛋、鸡胸肉、鱼、虾、低脂奶制品"],"after":"注意：坚果和肥肉的热量和脂肪也很高，要控制分量。"},{"h":"不只看体重","p":"体重一样，身材可以差很多。关键在于你身上是肌肉多，还是脂肪多：","list":["同样 1 公斤：肌肉体积小，脂肪体积大","肌肉多：身材紧实、充满活力，每天燃烧更多卡路里","脂肪多：身材松垮、容易疲累，更容易变胖"],"after":"所以减重不只看体重计上的数字，更要看体脂率和肌肉量，这就是为什么要定期测量和跟进。","viz":[{"type":"vs2","title":"同样都是 50 公斤，为什么体型差这么多？","left":{"h":"肌肉多","cls":"good","bar":[["肌肉",62],["脂肪",22],["其他",16]],"items":["身材紧实","充满活力","易瘦体质","燃烧更多卡路里"]},"right":{"h":"脂肪多","cls":"bad","bar":[["肌肉",34],["脂肪",50],["其他",16]],"items":["身材松垮","容易疲累","易胖体质","体积大，看起来更胖"]},"note":"示意图，比例仅供说明。同样重量的脂肪，体积比肌肉大很多。"}]}],"viz":[{"type":"bars","title":"每 100 克食物的蛋白质含量","unit":"g","items":[["鸡胸肉",31],["牛肉",26],["猪肉",26],["鸡腿肉",25],["三文鱼",22],["鸡蛋",13],["豆腐",15],["扁豆",9],["糙米饭",3]],"note":"每 100 克、煮熟、去骨计算的约略数值。"}],"myth":{"m":"只有健身的人才需要蛋白质。","f":"每个人都需要蛋白质来维持肌肉、免疫和身体修复。减重中、年长者和运动的人需要更多。"},"fact":{"num":"1.2–1.6","unit":"g/kg","text":"减重期间，每公斤体重每天建议 1.2–1.6 克蛋白质。维持体重 0.8–1.2 克，增重 1.6–2.2 克。"},"tips":["每餐有一个手掌大小的蛋白质","早餐最容易缺蛋白质，优先补上","动物蛋白和植物蛋白轮流吃"],"task":"选择你的目标，输入体重，算一算你每天大约需要多少蛋白质：","calc":"protein","share":"你有认识谁经常用自己的方法节食减肥的吗？","philo":"蛋白质占每天热量的 30%，是均衡营养的重要一环："},{"t":"好脂肪与坏脂肪","en":"Good Fats & Bad Fats","tag":"营养","lead":"脂肪不是敌人，选对种类才是关键。","intro":"身体需要脂肪来制造荷尔蒙、构成细胞膜、吸收维他命 A、D、E、K。问题不在于吃不吃脂肪，而在于吃哪一种。","points":[{"h":"饱和脂肪：适量就好","p":"肥肉、牛油、奶油、椰浆、棕榈油都含饱和脂肪，室温下是固体。吃太多会提高坏胆固醇 LDL，增加心血管疾病风险。"},{"h":"反式脂肪：完全避免","p":"反式脂肪越少越好。","list":["常见于：氢化植物油、人造黄油、起酥油","用这些油做的饼干、蛋糕、酥皮和油炸食品","会升高坏胆固醇、降低好胆固醇"]},{"h":"油炸食物会吸进很多油","p":"食物下锅油炸时，会把油吸进去。越是裹面糊、面包类的食物，吸油越多：","list":["炸散鸡蛋：吸油率高达 43%","裹面糊的食物：外层面糊特别会吸油","同样的食材，蒸、煮、烤会比油炸少很多脂肪和热量"],"viz":[{"type":"bars","title":"常见油炸食物的吸油率","unit":"%","items":[["炸散鸡蛋",43,1],["炸面糊小虾",35,1],["炸面糊裹香菇",23,1],["炸莲藕",19],["炸茄盒",17],["炸薯条",15]],"note":"吸油率：油炸后食物吸进去的油，占食物重量的比例。资料整理自课堂参考资料；炸薯条按一般每 100 克约含 15 克油估算。"}]},{"h":"不饱和脂肪：多选","p":"橄榄油、芥花籽油、牛油果、坚果和种子含单元或多元不饱和脂肪，室温下是液体，有助降低坏胆固醇。"},{"h":"常用食油怎么选？","p":"不同的油，脂肪的种类差很多。煮食时尽量选不饱和脂肪多、饱和脂肪少的油：","list":["多选：芥花籽油、橄榄油（单元不饱和脂肪高）","适量：葵花油、玉米油、大豆油","少用：猪油、棕榈油、牛油、椰油（饱和脂肪高）"],"viz":[{"type":"stack","title":"常用食油的脂肪组成（%）","keys":[["饱和脂肪","var(--bad)"],["Omega-6","var(--water)"],["Omega-3","var(--sun)"],["Omega-9","var(--leaf)"]],"rows":[["亚麻籽油",[9,16,57,18]],["芥花籽油",[7,21,11,61]],["橄榄油",[15,9,1,75]],["大豆油",[15,54,8,23]],["花生油",[19,33,0,48]],["玉米油",[13,57,1,29]],["葵花油",[12,71,1,16]],["猪油",[43,9,1,47]],["棕榈油",[51,10,0,39]],["牛油",[68,3,1,28]],["椰油",[91,2,0,7]]],"note":"每一种油都含有 Omega-3、6、9，但比例差很多。橙色（Omega-3）普遍很少，只有亚麻籽油比较多。资料整理自课堂参考图，数字为约略值。"}]},{"h":"Omega-3：身体做不出来","p":"Omega-3 是必需脂肪酸，身体无法自己制造，要从食物中摄取。鱼油里的 Omega-3 主要有两种：","list":["DHA：是大脑和眼睛视网膜的重要成分，有助维持脑部和视力健康","EPA：有助维持正常的三酸甘油酯水平和血管健康","来源：深海鱼（三文鱼、鲭鱼、沙丁鱼）、亚麻籽"],"viz":[{"type":"table","title":"Omega-3 剂量指南","head":["机构","对象","每天建议"],"wrap":[1],"rows":[["FDA","一般成人：每天安全上限","3 克"],["AHA","冠状动脉心脏病","1 克"],["AHA","三酸甘油酯高","3–4 克"],["AHA","高血压","2 克"],["AHA","类风湿关节炎","2.7 克"],["WHO","孕妇和哺乳期妇女","300 毫克"],["WHO","眼睛健康、改善干眼症","1 克"]],"best":-1,"note":"FDA：美国食品药品管理局；AHA：美国心脏协会；WHO：世界卫生组织。资料整理自课堂讲义，数字指 EPA + DHA。一般人每周吃 2 次深海鱼或适量补充鱼油即可；有疾病、怀孕或正在服药的人，补充前请先咨询医生。"},{"type":"chips","title":"鱼油最担心什么？","items":[["水银和重金属","大型鱼类容易累积水银等重金属，这是鱼油最让人担心的地方"],["选小型深海鱼","鲭鱼、鳀鱼、沙丁鱼这类小型鱼，重金属累积较少"],["看检测报告","有重金属检测，结果为未检出，吃得更安心"],["添加维他命 E","帮助防止鱼油氧化，保持品质"]]},{"type":"kcal","title":"Omega-3 从哪里来？","items":[["fishoil","Omega-3 鱼油","重金属未检出","重金属分析测试"],["salmon","深海鱼","每周 2 次","天然来源"]],"note":"康宝莱鱼油采用北大西洋小型深海鱼（鲭鱼、鳀鱼、沙丁鱼），重金属检测结果为未检出，并添加维他命 E 防止氧化。"}],"img":[{"f":"fishoil_report","cap":"康宝莱深海鱼油胶囊重金属分析测试：重金属未检出"}]},{"h":"植物的 Omega-3（ALA）够不够？","p":"亚麻籽、奇亚籽、核桃里的 Omega-3 叫做 ALA。很多人以为吃这些就够了，其实 ALA 吃进身体后，还要再经过转换，才会变成身体真正需要的 EPA 和 DHA：","list":["ALA 转换成 EPA：只有约 5–10%","ALA 转换成 DHA：更少，只有约 0.5–5%（很多人不到 1%）","转换率因人而异，饮食中 Omega-6 太多，转换率会更低"],"after":"所以植物的 ALA 可以吃，但想要足够的 EPA 和 DHA，最直接的来源还是深海鱼和鱼油。","viz":[{"type":"bars","title":"吃进 100 份 ALA，最多能变成多少？","unit":"份","items":[["吃进的 ALA",100],["变成 EPA",10,1],["变成 DHA",5,1]],"note":"以研究中较高的转换率计算，实际上很多人更低。资料来源：营养学研究对 ALA 转换率的综合估计。"}]},{"h":"坏脂肪吃太多，身体会怎样？","p":"长期吃太多饱和脂肪和反式脂肪，坏胆固醇升高，会慢慢影响身体：","list":["血管：脂肪斑块堆积在血管壁，血管变窄、变硬","心脏：血管被堵住，增加心脏病发作和中风的风险；心脏要更用力工作","肝脏：脂肪堆积在肝脏，形成脂肪肝","肚子：内脏脂肪增加，腰围变大"],"after":"好消息是，改变饮食习惯、多运动，血管可以保持得更年轻。","imgFull":true,"img":[{"f":"heart_attack","cap":"心脏病发作：血管被斑块堵住，心脏肌肉得不到含氧的血液，每过一分钟就有更多组织受损坏死"},{"f":"liver_real","cap":"健康的肝脏（左）vs 脂肪肝（右）"}]},{"h":"Omega-3、6、9：要补的是 Omega-3","p":"食物里的不饱和脂肪，主要有 Omega-3、Omega-6 和 Omega-9 三种：","list":["Omega-6：大部分食油和加工食品都有，随便吃都吃得到。吃太多会促进身体发炎","Omega-9：橄榄油、芥花籽油、坚果里很多，身体也能自己制造","Omega-3：帮助减少不正常的发炎，但一般饮食很少吃得到，是最需要补充的"],"after":"现代人的饮食 Omega-6 太多、Omega-3 太少。所以不需要特别补 Omega-6 和 Omega-9，要多摄取的是 Omega-3。"},{"h":"好脂肪也有热量","p":"即使是橄榄油、坚果这些好脂肪，每克也有 9 卡路里，比蛋白质和碳水化合物高一倍多。选对种类，也要控制分量。"}],"viz":[{"type":"split","title":"一眼分辨好脂肪与坏脂肪","left":{"h":"好脂肪 · 多选","cls":"good","items":["深海鱼：三文鱼、鲭鱼、沙丁鱼","橄榄油、芥花籽油","牛油果","杏仁、核桃等原味坚果","亚麻籽、奇亚籽"]},"right":{"h":"坏脂肪 · 少吃或避免","cls":"bad","items":["肥肉、鸡皮、猪油","牛油、奶油、炼奶","椰浆、棕榈油（饱和脂肪）","人造黄油、起酥油（反式脂肪）","饼干、蛋糕、酥皮、油炸食品"]}}],"myth":{"m":"想减重就要完全不吃油。","f":"完全不吃油会影响荷尔蒙和脂溶性维他命吸收。重点是少吃坏脂肪、适量吃好脂肪。"},"fact":{"num":"1","unit":"g","text":"美国心脏协会指出，平时少吃鱼的人，每天约 1 克 Omega-3 可能对健康有益。"},"tips":["每周吃 2 次深海鱼","零食换成一小把原味坚果","买饼干糕点前看看配料有没有氢化油"],"task":"本周安排两餐深海鱼（三文鱼、鲭鱼、沙丁鱼），或和教练聊聊鱼油补充。","share":"你有认识谁经常吃肥肉、油炸食物这些坏脂肪的吗？","philo":"脂肪占每天热量的 30%，重点是减少饱和脂肪、补充 Omega-3："},{"t":"读懂营养标签","en":"Reading Nutrition Labels","tag":"餐单","lead":"包装正面是广告，背面的营养标签才是真相。","intro":"「低脂」「天然」「高纤」这些字眼印在包装正面，是为了吸引你购买。要知道食物到底健不健康，要翻到背面看营养标签和配料表。","points":[{"h":"快速掌握的三个原则","p":"一般人买包装食品时，看的多是价钱、包装和有效日期。要吃得健康，我们教你用简单的方法看营养标签，只要记住三个原则：","list":["低卡路里：注意每份的重量，要换算","高蛋白质","低脂肪：特别注意反式脂肪和饱和脂肪"],"viz":[{"type":"split","title":"一般人看什么？我们看什么？","left":{"h":"我们教你看：营养标签","cls":"good","items":["低卡路里","高蛋白质","低脂肪"]},"right":{"h":"一般人只看：外表","cls":"bad","items":["价钱、品牌","包装图片","有效日期、净重","容器状况、出产国家"]}}]},{"h":"第一步：看份量","p":"营养标签上的数字通常是「每份」。","list":["先看一份是多少克","再看一包有几份","很多零食一包其实是 2–3 份，热量要乘上去"]},{"h":"第二步：用每 100 克比较","p":"比较两种产品时，用「每 100 克」那一栏才公平，因为每家公司定义的一份大小不同。"},{"h":"第三步：看重点营养","p":"热量、糖、钠、饱和脂肪、反式脂肪越低越好；蛋白质和膳食纤维越高越好。"},{"h":"第四步：看配料表","p":"配料按含量从多到少排列。排在前三的是糖或油，就要小心。糖有很多别名：葡萄糖浆、果糖、麦芽糖、蔗糖。"},{"h":"第五步：找出隐藏的反式脂肪","p":"配料表中出现「氢化植物油」「部分氢化油」「起酥油」，就代表可能含有反式脂肪。"}],"viz":[{"type":"photos","title":"三种金枪鱼罐头的营养标签","items":[["tuna_a","金枪鱼 A（油浸）：130 卡路里，8 克蛋白质，16% 脂肪"],["tuna_b","金枪鱼 B：110 卡路里，18 克蛋白质，5% 脂肪"],["tuna_c","金枪鱼 C（水浸）：80 卡路里，20 克蛋白质，0% 脂肪"]]},{"type":"table","title":"同样是金枪鱼罐头，标签差很多（每份）","head":["","卡路里","蛋白质","脂肪"],"rows":[["金枪鱼 A（油浸）","130","8 克","16%"],["金枪鱼 B","110","18 克","5%"],["金枪鱼 C（水浸）","80","20 克","0%"]],"best":2,"note":"金枪鱼 C 热量最低、蛋白质最高、脂肪最少，是最好的选择。资料来自课堂讲义。"},{"type":"bars","title":"每天添加糖的建议上限 vs 一罐汽水","unit":"g","items":[["理想上限（WHO）",25],["一罐 330ml 汽水",35,1],["最高上限（WHO）",50]],"note":"世界卫生组织建议游离糖少于每日热量的 10%（约 50 克），最好少于 5%（约 25 克）。一茶匙糖约 4 克。"},{"type":"table","title":"早餐谷物 vs 营养奶昔（单位：克）","head":["每 100 克","热量","蛋白质","碳水","纤维"],"rows":[["即食麦片","364","6.5","79","6.3"],["燕麦片 A","403","8.8","76.5","1.6"],["有机燕麦","379","13.2","67.7","10.1"],["营养奶昔","378","35.8","26.9","18.1"]],"best":3,"note":"热量差不多，但营养奶昔的蛋白质和纤维高很多，碳水化合物低很多，还含有 16 种维他命和矿物质（麦片 A 只有维他命 E）。资料整理自课堂讲义。"}],"myth":{"m":"包装写「低脂」就代表健康。","f":"很多低脂产品会加更多糖来补回口感。一定要看营养标签上的糖和总热量。"},"fact":{"num":"2000","unit":"mg","text":"世界卫生组织建议成人每天钠摄取少于 2000 毫克（约 5 克盐）。"},"tips":["买东西前花 10 秒看标签","饮料看糖，零食看钠和油","配料越短越简单通常越好"],"task":"拿起家里一包零食或饮料，找出它每包的热量、糖和钠，拍照分享给教练。","share":"你有认识谁买食物时只看价钱，不看营养标签的吗？"},{"t":"运动","en":"Exercise","tag":"计划","lead":"运动很重要，但单靠运动减不了肥。","intro":"很多人以为只要多运动就能瘦下来。今天我们先看看常见的误区，再了解运动真正能消耗多少卡路里，以及运动带来的好处。","points":[{"h":"减肥的 8 大误区","p":"很多人一减肥就犯这些错，结果越减越累，还容易反弹：","viz":[{"type":"chips","title":"你中了几个？","items":[["不吃碳水化合物","身体没有能量运作"],["少吃节食","新陈代谢下降"],["不吃晚餐","新陈代谢下降"],["只吃蔬菜水果","水果糖分高，肌肉流失"],["不敢吃肉","无法建立肌肉"],["熬夜","身体无法修复"],["不喝水","营养无法好好吸收"],["拼命运动","吃得比消耗多，还会流失肌肉"]],"cols":2}]},{"h":"迷思：光运动就能减重？","p":"很多人以为只要多运动就能减肥。其实运动燃烧的卡路里，远比你想象的少：","viz":[{"type":"burn","title":"吃一样东西，要运动多久才消耗得完？","items":[["汽水 1 罐",200,"弓步蹲",54],["炸鸡胸 1 块",444,"踩健身脚车",65],["奶昔 1 杯",780,"跳绳",72],["甜甜圈 1 个",242,"仰卧起坐",88],["汉堡 + 薯条",691,"椭圆机",141],["芝士蛋糕 1 块",710,"快走",148],["比萨 2 片",626,"爬楼梯",159]],"note":"资料整理自课堂讲义的参考图，为约略数值，实际消耗视体重和运动强度而定。"},{"type":"bars","title":"30 分钟运动大约消耗多少热量","unit":"kcal","items":[["跳绳",264],["慢跑",249],["骑脚车",225],["游泳",174],["羽毛球",165],["快走",129],["散步",105]],"note":"数值来自课堂讲义，实际消耗因体重和强度而不同。"}],"list":["吃一份汉堡加薯条，要在健身器上踩约 141 分钟才消耗得完","运动后大吃一顿，消耗的热量会「加倍奉还」","运动后 30 分钟是补充营养、修复肌肉的黄金时间，要吃对，不是吃多"],"after":"所以运动后不要用大餐奖励自己。"},{"h":"运动的好处","p":"虽然单靠运动很难减肥，但运动对身体的好处非常多：","viz":[{"type":"chips","title":"运动的好处","items":[["提升新陈代谢","肌肉越多，消耗越多"],["增加心肺功能","走路爬楼梯更轻松"],["增强肌力和耐力","日常活动更有力"],["增强抵抗力","身体更强壮"],["心情愉快","舒缓压力"],["修饰体型","肌肉线条更好看"]]}]},{"h":"怎样运动最有效？","p":"不需要一开始就很拼，持续最重要：","list":["有氧运动：快走、慢跑、游泳、骑车，从每天 20–30 分钟开始","肌力训练：深蹲、俯卧撑、弹力带，保住肌肉、提高代谢","运动后：尽快补充水分，30–60 分钟内吃一份蛋白质","每天动一点、持续做，比偶尔一次拼命更有效，也更不容易受伤"]},{"h":"总结：运动与营养的关系密切","p":"均衡营养与适度运动，是维持健康的不二法门。","list":["只运动不控制饮食，很难看到效果","只节食不运动，容易流失肌肉","两者配合：80% 营养 + 20% 运动"],"viz":[{"type":"ratio","title":"健康 = 80% 营养 + 20% 运动","parts":[["营养",80,"吃对、吃够、守住神奇数字","var(--leaf)"],["运动",20,"提升代谢、保住肌肉","var(--sun)"]]}]}],"viz":[],"myth":{"m":"我有运动，所以想吃什么都可以。","f":"运动消耗的热量比想象中少，饮食不控制，很容易吃回去甚至更多。"},"fact":{"num":"150","unit":"分钟","text":"世界卫生组织建议成人每周至少 150 分钟中等强度运动，另加每周 2 天肌力训练。"},"tips":["饭后散步 10–15 分钟","能走楼梯就不搭电梯","找朋友一起运动更容易坚持"],"task":"今天快走 20 分钟，或在家做 3 组深蹲（每组 10 下），运动后记得喝水。","share":"你有认识谁很少运动，或者运动后反而大吃一顿的吗？","leadHL":false,"philo":"运动只是其中一部分，营养、水分和睡眠同样重要："},{"t":"食物对比","en":"Food Comparison","tag":"计划","lead":"同样是一顿饭，营养和热量可以差很远。","intro":"前 9 天我们学了热量、水、细胞营养、早餐、升糖指数、蛋白质、脂肪、标签和运动。今天把这些知识放在一起，用来比较日常食物。","points":[{"h":"营养丰富 vs 空热量","p":"同样 2000 卡路里，可以吃得很不一样：","viz":[{"type":"split","title":"同样 2000 卡路里","left":{"h":"营养丰富的食物","cls":"good","items":["营养高、热量低","低糖、少坏脂肪","帮助保持健康的身体和体重"]},"right":{"h":"热量密集的食物","cls":"bad","i ,"p":"康宝莱背后有一支由医生、营养师和科学家组成的专业团队，负责产品研发和营养教育：","list":["全球超过 200 位国际认可的专家，包括医生、教练、营养师和顾问委员","产品在全球 16 个实验室进行检测","实验室达到国际最高标准 ISO 17025"],"imgFull":true,"img":[{"f":"sci_team","cap":"康宝莱营养顾问委员会：医生、营养师和科学家团队"}],"viz":[{"type":"chips","cols":3,"title":"科学背后的数字","items":[["200+","国际认可的专家"],["16 个","全球检测实验室"],["ISO 17025","国际实验室最高标准"]]}]},{"h":"以研究为基础","p":"好的配方以营养科学研究为依据，而不是只靠广告和口碑。"},{"h":"成分透明","p":"标签清楚列出所有成分和含量，并符合各地食品法规的要求。"},{"h":"多重品质检测","p":"从原料、生产过程到成品，都要经过检测，确保每一份产品都和标签一致、安全可靠。"},{"h":"大使计划","p":"如果你对产品和效果满意，可以了解大使计划，享有更多优惠。成为大使有两个条件：","list":["忠诚顾客：对产品和公司有信心，愿意帮助 2 个人和你一样开始营养计划","产品爱用者：决定把营养早餐当作长期的理想早餐"]},{"h":"好东西要分享","p":"邀请家人一起参加营养计划，全家一起拥有健康活跃的生活方式。教练会一直协助你。"}],"viz":[{"type":"timeline","title":"选择营养产品时问自己 4 个问题","items":[["谁研发？","有没有营养和科学专业团队"],["有根据吗？","配方是否以研究为基础"],["标签清楚吗？","所有成分和含量是否列明"],["有检测吗？","原料和成品是否经过品质检测"]]}],"myth":{"m":"营养品都差不多，买最便宜的就好。","f":"原料来源、配方和品质管理的差别很大。选择有科学根据和严格品质把关的产品更安心。"},"fact":{"num":"3","unit":"关","text":"原料检验、生产过程、成品检测：三道品质关卡。"},"tips":["买产品前先看成分和营养标签","不要相信「速效」「神奇」的广告","有疑问就问教练或专业人士"],"task":"想一想，身边有谁也想变得更健康？把这 21 天课程分享给他。","share":"你有认识谁买营养品只看价钱和广告的吗？"},{"t":"从种子到餐桌","en":"Seed to Feed","tag":"公司","lead":"一份好产品，要从源头开始把关。","intro":"「从种子到餐桌」的意思是，产品的品质不是在工厂最后一关才检查，而是从原料种植开始，每一个步骤都有标准。","points":[{"h":"源自于科学的营养","p":"科学团队确保产品配方来自最新的营养研究。","imgFull":true,"img":[{"f":"sci_quality","cap":"科学品质流程：种植采收后、原料、混合后、运输后、包装后，5 次检测"}]},{"h":"最好的产品源自最好的原材料","p":"产品中的成分必须通过严格的验证和纯度检验，一直检验到分子水平。"},{"h":"每个步骤严格测试","p":"从验证成分的纯度和功效，到成品的最终检验，生产线上不停测试，确保产品符合或超越最严格的监管准则。"},{"h":"安全生产","p":"产品的制造达到或超越「良好生产规范」（cGMP）的标准，确保生产过程和设施都受到适当的设计和监控。"},{"h":"品质送到你手中","p":"用先进的技术监控成品存放的环境，也会保留样品，确保产品在保质期内的品质。"}],"viz":[{"type":"timeline","title":"5 次品质检测","items":[["种植和采收后","检测原料来源"],["原料检测","验证成分和纯度"],["混合后检测","确保配方准确"],["运输后检测","确认品质没有改变"],["包装后检测","确保与标签一致"]]}],"myth":{"m":"只要是「天然」的就一定安全。","f":"天然原料也可能受到污染或品质不稳定。经过严格检验的原料才更安全。"},"fact":{"num":"4","unit":"步","text":"种植 → 原料检验 → 生产 → 成品检测。"},"tips":["看产品是否有清楚的制造商资料","留意产品的有效日期和储存方式","按建议份量使用"],"task":"拿起你正在使用的营养产品，看看标签上的成分、营养资料和制造商资料。","share":"你有认识谁很在意食物安全和品质的吗？"},{"t":"每日营养补充","en":"Daily Nutritional Supplements","tag":"营养","lead":"营养补充品是用来填补饮食缺口，不是取代正餐。","intro":"理想状况下，营养应该全部来自食物。但忙碌的生活、外食多、蔬果吃得少，让很多人每天都有营养缺口。","points":[{"h":"为什么会有营养缺口？","p":"外食多油多盐、蔬果吃得少、饮食种类单一，再加上压力和作息不规律，都会让身体缺少某些维他命和矿物质。"},{"h":"原型食物的营养，比以前少了","p":"很多人说「吃原型食物就够了」。原型食物当然要吃，但今天的蔬果营养，已经和几十年前不一样：","list":["美国营养学院期刊的研究，比较了 1950 年和 1999 年 43 种蔬果的营养数据","多种蔬果的钙、铁、维他命 C、核黄素（维他命 B2）等营养素都下降了","例如西兰花的钙，从 1950 年的每份 130 毫克，下降到约 48 毫克","原因包括土壤营养流失、品种改良追求产量和外观等"],"after":"所以每日营养补充，是在我们没办法每天吃得均衡时，帮忙补上营养的漏洞，而不是取代原型食物。","imgFull":true,"img":[{"f":"nut_study","cap":"《美国营养学院期刊》2004 年研究：1950–1999 年 43 种园艺作物的营养成分变化"},{"f":"nut_decline","cap":"西兰花、花椰菜、哈密瓜、茄子、番茄、芦笋，1950 年 vs 1999 年的营养变化（%）"}]},{"h":"常见容易不足的营养","p":"膳食纤维、钙、维他命 D、铁（尤其是女性）和 Omega-3，是许多人饮食中容易缺乏的营养。"},{"h":"维他命与矿物质的作用","p":"身体需要适量的维他命和矿物质来维持机能平衡。","viz":[{"type":"cloud","title":"身体每天需要的维他命与矿物质","items":[["维他命 A","","v",1],["B1","","v",3],["B2","","v",3],["B3","","v",3],["B5","","v",3],["B6","","v",3],["B12","","v",3],["维他命 C","","v",2],["维他命 D","","v",1],["维他命 E","","v",1],["维他命 K","","v",3],["叶酸","","v",3],["生物素","","v",3],["钙","","m",2],["铁","","m",1],["锌","","m",1],["镁","","m",1],["钾","","m",1],["碘","","m",3],["硒","","m",3],["铬","","m",3],["钼","","m",3],["锰","","m",3]],"note":"橙色为维他命，蓝色为矿物质。"}],"after":"需要量不大，但日常饮食未必每天都吃得够。"},{"h":"补充要适量","p":"补充品不是吃越多越好，要按建议份量使用。某些维他命和矿物质过量也可能有害。"},{"h":"特殊情况先问医生","p":"有慢性病、怀孕、哺乳或正在服药的人，开始任何补充品前，请先咨询医生或药剂师。"},{"h":"运动和睡眠也是营养的一部分","p":"除了吃对营养，适量的运动和充足的睡眠，也是健康生活方式的一部分。"}],"viz":[{"type":"chips","title":"常见营养缺口和食物来源","items":[["膳食纤维","蔬菜、水果、全谷类、豆类"],["钙","牛奶、豆腐、小鱼干、深绿色蔬菜"],["维他命 D","阳光、鸡蛋、深海鱼"],["铁","红肉、深绿色蔬菜、豆类"],["Omega-3","三文鱼、鲭鱼、沙丁鱼、亚麻籽"]]}],"myth":{"m":"吃了维他命，就可以不用吃蔬菜。","f":"蔬果含有纤维和许多补充品没有的营养成分。补充品是辅助，不能取代均衡饮食。"},"fact":{"num":"5","unit":"份","text":"建议每天吃至少 5 份蔬菜水果（约 400 克），这是最基础的营养来源。"},"tips":["每餐蔬菜占餐盘一半","每天晒 10–15 分钟太阳","补充品随餐吃，吸收更好"],"task":"数一数今天吃了几份蔬菜水果（一份约一个拳头大小），目标是 5 份。","share":"你有认识谁外食多、很少吃蔬菜水果的吗？","philo":"维他命和矿物质，帮你补足均衡营养的缺口："},{"t":"外在营养","en":"Outer Nutrition","tag":"产品","lead":"好皮肤要里应外合：内在营养 + 外在护理，一起配合才能达到最好的效果。","intro":"皮肤是身体最大的器官，应该好好呵护。美丽是由内而外的，皮肤、头发和指甲每天都在更新，原料来自你吃进去的营养。","points":[{"h":"维他命 B 群","p":"维他命 B2、B3、B6 和生物素有助维持皮肤和头发的健康。B 群是水溶性的，需要每天补充。"},{"h":"锌和铜","p":"锌有助维持健康的皮肤、头发和指甲；铜有助头发和皮肤的正常色素。"},{"h":"蛋白质","p":"头发和指甲主要由蛋白质构成，皮肤的胶原蛋白也需要蛋白质作原料。蛋白质吃不够，头发会变干、易断。"},{"h":"水分和好脂肪","p":"喝够水让皮肤保持水润；Omega-3 等好脂肪有助维持皮肤屏障。"},{"h":"外在护理同样重要","p":"每天防晒、充足睡眠、温和清洁、少熬夜、不吸烟，都能帮助皮肤保持健康。"},{"h":"康宝莱的外在营养产品","p":"皮肤是身体最大的器官，除了由内吃对营养，也要由外好好呵护。康宝莱有一系列外在护理产品：","list":["SKIN 系列：洁面、爽肤水、精华、日霜、晚霜、去角质等日常护理","芦荟系列：护手霜、沐浴露、舒缓凝胶、洗发水和护发素","维他命面膜：12 种维他命，加上芦荟和牛油果成分，帮助保湿"],"after":"皮肤要里应外合：由内吃对营养，由外好好护理，两者配合才能达到最好的效果。有兴趣了解更多？请教练为你安排一次 Skin Spa，亲身体验我们的外在营养。","imgFull":true,"img":[{"f":"skin_products2","cap":"康宝莱外在营养：SKIN 护肤系列、芦荟身体和头发护理系列、维他命面膜"}]}],"viz":[{"type":"chips","title":"美肤美发营养和食物来源","items":[["维他命 B2","牛奶、鸡蛋、绿叶菜"],["维他命 B3","鸡肉、鱼、花生"],["维他命 B6","鸡肉、香蕉、马铃薯"],["生物素","蛋黄、坚果、种子"],["铜","坚果、贝类、全谷类"],["锌","牡蛎、红肉、南瓜子"]]}],"myth":{"m":"皮肤好不好只靠保养品。","f":"保养品作用在表面，皮肤的原料来自饮食。内在营养加外在护理，效果才更好。"},"fact":{"num":"7–9","unit":"小时","text":"成人每晚建议睡眠时间。睡眠时是皮肤修复的重要时段。"},"tips":["出门前擦防晒","睡前一小时放下手机","每天一小把坚果"],"task":"今晚比平时早 30 分钟上床，放下手机，明早看看精神有没有不同。想了解外在护理的话，可以请教练帮你安排一次 Skin Spa 体验。","share":"你有认识谁很重视皮肤和头发保养的吗？","leadHL":true},{"t":"补水与细胞健康","en":"Hydration & Cellular Health","tag":"营养","lead":"喝水不只是解渴，水分是细胞运作的环境。","intro":"第 2 天我们知道了要喝够水。今天更进一步：怎么判断自己喝得够不够，以及水分和细胞健康的关系。","points":[{"h":"补水三问：喝多少？为什么？喝什么？","p":"每个人的需要不同，但记住这三个重点：","list":["喝多少：建议每天 8–10 杯水（以 400 毫升一杯计算，约 3–4 公升），让身体保持最佳状态","为什么：缺水会引起疲倦、便秘、皮肤干燥、偏头痛和肌肉痉挛","喝什么：除了白开水，康宝莱的芦荟浓缩饮和洛神花草本茶，加水冲泡后也能帮助补充每天需要的水分"],"after":"觉得白开水没味道、喝不下？冲一杯芦荟饮或草本茶，热量低、味道清爽，更容易喝够 8–10 杯。","viz":[{"type":"kcal","title":"帮你喝够水的好帮手","items":[["aloe","芦荟浓缩饮","低卡路里","加水冲泡"],["tea","洛神花草本茶","低卡路里","冷热都可以"],["s_water","白开水","0 卡路里","每天 8–10 杯"]]}]},{"h":"每天 8–10 杯（3–4 公升）","p":"无论是平时活动还是运动时，水对身体都非常重要。","list":["每天 8–10 杯，约 3–4 公升","或每公斤体重 40–50 毫升","运动流汗时要喝更多"]},{"h":"缺水的后果","p":"缺乏水分可能引起头痛、肌肉痉挛、肌肉疲劳、便秘、皮肤干燥，也会常常觉得疲倦。","viz":[{"type":"bubbles","title":"缺乏水分的后果","items":["头痛","肌肉痉挛","肌肉疲劳","便秘","皮肤干燥","常感疲倦"]}]},{"h":"细胞内外的平衡","p":"细胞内外的水分和电解质（钠、钾、镁）保持平衡，肌肉、神经和能量代谢才能正常运作。"},{"h":"流汗多要补电解质","p":"运动或在炎热天气下大量流汗时，除了补水，也要补充电解质，避免抽筋和疲倦。"},{"h":"用尿液颜色判断","p":"尿液接近淡黄色，代表水分大致充足；颜色越深，越需要喝水。（服用某些维他命可能让尿液变黄，属正常现象。）"},{"h":"可以补水的饮品","p":"白开水最好，花草茶、无糖茶也可以帮助补水。含糖饮料不算，反而会多出热量。"},{"h":"喝水的好时机","p":"起床后、每餐前、运动前后、觉得疲倦或想吃零食时，都是喝水的好时机。"}],"viz":[{"type":"swatch","title":"用尿液颜色检查水分","items":[["#f6f2c8","水分充足"],["#f1e58f","水分充足"],["#e9cf55","可以多喝一点"],["#d9ad2d","需要喝水"],["#b9831d","明显缺水，马上喝水"]],"note":"仅供日常参考。颜色异常或持续偏深，请咨询医生。"}],"myth":{"m":"冬天或在冷气房里不流汗，就不用喝那么多水。","f":"呼吸和皮肤每天都会流失水分，冷气房里空气干燥，同样需要补水。"},"fact":{"num":"淡黄","unit":"","text":"尿液接近淡黄色，代表身体水分大致充足。"},"tips":["把水瓶放在看得见的地方","在水里加柠檬片或薄荷叶","每餐前先喝一杯水"],"task":"今天把一杯含糖饮料换成白开水或无糖茶，并留意尿液颜色。","share":"你有认识谁常常觉得疲倦、头痛，却很少喝水的吗？","philo":"充足的水分，是均衡营养不可少的一部分："},{"t":"健康老化与纤维","en":"Healthy Aging · Greens Power","tag":"营养","lead":"活得久不够，还要活得有力气、有精神。","intro":"健康老化的意思是，年纪增长时依然能自由活动、有精神、少病痛。饮食中的蛋白质和纤维，是两个最重要的帮手。","points":[{"h":"肌肉是健康老化的本钱","p":"老化是身体结构或功能慢慢减退的过程。如果没有锻炼，30 岁以后肌肉每年大约减少 1%：","list":["肌肉减少，脂肪增加，体重不变也会显得更胖","肌肉少了，燃烧脂肪的能力变差，更容易发胖","到 70 岁，肌肉可能只剩下 30 岁时的约三分之二","保持活跃、规律运动、吃够蛋白质，可以减缓肌肉流失"],"viz":[{"type":"bars","title":"没有锻炼时，肌肉量随年龄的变化（示意）","unit":"%","items":[["30 岁",100],["40 岁",90],["50 岁",82],["60 岁",74],["70 岁",67,1]],"note":"以 30 岁的肌肉量为 100% 计算的示意值。适度运动加上足够蛋白质，可以维持肌肉量。"}]},{"h":"纤维的三大好处","p":"膳食纤维不只帮助排便，对身体的好处还有很多：","list":["帮助消化：促进肠道蠕动、增加粪便体积，支持肠道好菌生长，降低肠胃疾病风险","支持免疫：菊粉和抗性淀粉这类可发酵纤维是「益生元」，是肠道好菌的食物。好菌产生的短链脂肪酸，有助调节免疫反应、减少发炎","代谢健康：多吃蔬菜、水果、鱼、奶制品、咖啡和茶，有助预防代谢综合征"],"imgFull":true,"img":[{"f":"fib_benefit","cap":"纤维与消化、免疫和代谢综合征（参考：Microorganisms 2023；美国营养与饮食学会 2015）"}]},{"h":"研究证明：吃够蛋白质和纤维，减重更成功","p":"2024 年发表在《肥胖科学与实践》（Obesity Science and Practice）期刊的研究，追踪了参加减重计划的人一整年：","list":["减重成功的人，一年后平均体重下降约 13%","失败的人只下降约 2%","关键差别：成功的人吃了更多蛋白质和纤维，同时控制热量"],"after":"研究结论：体重管理要成功，就要在控制热量的同时，多吃蛋白质和纤维。","imgFull":true,"img":[{"f":"fib_study","cap":"Lee 等人，2024 年，《肥胖科学与实践》：成功的饮食改变与减重效果相关"}]},{"h":"纤维稳定血糖和胆固醇","p":"可溶性纤维（燕麦、豆类、苹果）能减缓糖分吸收，也有助降低胆固醇。"},{"h":"大多数人纤维不够","p":"成人每天需要约 25 克纤维，但只靠天然食物，要吃很多才够：","list":["5 克纤维 ≈ 2 个番薯，或 3 个橙","25 克纤维 ≈ 10 个番薯，或 15 个橙","大多数人每天只吃到一半左右"],"imgFull":true,"img":[{"f":"fib_25g","cap":"25 克纤维 ≈ 10 个番薯 ≈ 15 个橙"}],"viz":[{"type":"cmp2","title":"吃够纤维，要吃进多少热量？","a":"天然食物","b":"Herbalife 综合纤维饮","rows":[{"h":"5 克纤维","a":[["2 个番薯","约 200 kcal"],["3 个橙","约 190 kcal"]],"b":["1 份","9 kcal"]},{"h":"25 克纤维","a":[["10 个番薯","约 1000 kcal"],["15 个橙","约 930 kcal"]],"b":["5 份","45 kcal"]}],"note":"天然食物热量为约略数值。天然食物仍然要吃，纤维饮帮你在不增加太多热量的情况下补足缺口。"}]},{"h":"纤维有三种，最好一起补","p":"纤维不是只有一种，不同的纤维有不同的作用：","list":["水溶性纤维：在肠道形成凝胶，减缓糖分吸收，帮助稳定血糖和胆固醇，增加饱足感","非水溶性纤维：增加粪便体积，促进肠道蠕动，帮助排便顺畅","菊粉（Inulin）：一种益生元，是肠道好菌的食物，帮助维持肠道健康"],"after":"Herbalife 综合纤维饮（含菊粉），同时有水溶性和非水溶性纤维，每份 5 克纤维、只有 9 卡路里，帮你轻松补足每天需要的纤维。","viz":[{"type":"chips","cols":3,"title":"三种纤维，各有作用","items":[["水溶性","稳血糖、降胆固醇"],["非水溶性","帮助排便"],["菊粉","喂养肠道好菌"]]}],"imgFull":true,"img":[{"f":"fib_product","cap":"康宝莱综合纤维饮（含菊粉）：水溶性 + 非水溶性纤维，每份 5 克"}]},{"h":"慢慢增加，多喝水","p":"突然大量增加纤维可能会胀气。要循序渐进，同时多喝水，纤维才能发挥作用。"}],"viz":[{"type":"bars","title":"常见食物一份的纤维和热量","unit":"g","target":[25,"每日目标 25 克"],"items":[["一碗煮熟扁豆（约 200 克）",15,0,230],["一个梨",5.5,0,100],["Herbalife 综合纤维饮（1 份）",5,0,9],["一碗煮熟西兰花",5,0,55],["一碗燕麦粥",4,0,160],["一片全麦面包",2,0,80],["一碗白饭",0.6,0,200]],"note":"约略数值。Herbalife 综合纤维饮每份 5 克纤维，只有 9 卡路里。"}],"myth":{"m":"吃纤维会让人一直跑厕所。","f":"适量的纤维让排便更规律。循序渐进、多喝水，身体会慢慢适应。"},"fact":{"num":"25–30","unit":"g","text":"成人每天建议的膳食纤维摄取量。很多人只吃到一半左右。"},"tips":["午餐或晚餐把白米换成糙米","每餐加一份蔬菜、水果或豆类","零食选全麦饼干、水果、坚果或绿豆汤"],"task":"今天每一餐都加一份绿色蔬菜，并多喝两杯水。","share":"你有认识谁常常便秘、很少吃蔬菜的吗？","philo":"每天 25 克纤维素，也是均衡营养的一部分："},{"t":"健康生活与减重阶段","en":"Healthy Active Lifestyle","tag":"提升计划","lead":"了解减重的不同阶段，遇到平台期就不会慌。","intro":"减重不是一条直线往下的过程。了解每个阶段会发生什么，才能在体重停住时不放弃，继续调整前进。","points":[{"h":"先认识体脂率","p":"体脂率是身体里脂肪占体重的百分比，比体重更能看出你的身材和健康状况。","list":["同样体重，体脂率越低，身材越紧实","男性和女性的标准不一样，女性本来就需要多一点脂肪","下面每个阶段的判断标准，都是看体脂率"],"viz":[{"type":"table","title":"体脂率参考","head":["分类","女性","男性"],"rows":[["运动员","14–20%","6–13%"],["健康","21–24%","14–17%"],["一般","25–31%","18–24%"],["肥胖","32% 以上","25% 以上"]],"best":1,"note":"参考一般体脂率分类，数字为约略范围。请教练帮你测量，了解自己在哪一个范围。"}]},{"h":"你的脂肪藏在哪里？","p":"每个人囤积脂肪的位置不一样：","list":["肚子（苹果型）：脂肪集中在腰腹，男性比较常见","臀部和大腿（梨型）：女性比较常见","全身型：脂肪平均分布在全身"],"after":"最需要留意的是肚子上的脂肪。腰腹的脂肪很多是包在内脏外面的「内脏脂肪」，和心脏病、糖尿病、脂肪肝的关系最密切。所以除了体重，也要定期量腰围。","viz":[{"type":"chips","title":"腰围参考（亚洲人）","items":[["男性","腰围 90 厘米以下"],["女性","腰围 80 厘米以下"]]}]},{"h":"第一阶段：肥变中","p":"判断标准：男性体脂率高于 25%，女性高于 30%。饮食上，食量比过去少，戒掉零食和夜宵，远离油炸和高糖食物。"},{"h":"第二阶段：中变瘦","p":"判断标准：男性体脂率 20%–25%，女性 25%–30%。这个阶段要认真跟着教练给的餐单。"},{"h":"第三阶段：平台期","p":"身体对减重出现「适应」，代谢降低，体重暂时不再下降。这是正常的，不要气馁。","list":["饮食：多吃富含 B 族维他命、膳食纤维和优质蛋白质的食物","水果：换成低升糖的苹果、奇异果、西柚","运动：改变运动方式来突破"]},{"h":"最后阶段：瘦变完美（雕塑期）","p":"恭喜你已经走过最艰难的阶段！","list":["饮食：减脂餐，并确保蛋白质充足，帮助肌肉合成","运动：每天有氧运动，每周至少 3 次力量训练","针对还不满意的部位做加强","运动后记得拉伸"]},{"h":"健康活跃生活的好处","p":"规律饮食、足够睡眠、每天活动，不只帮助身材，还能舒缓压力、提高工作效率、增加自信心，让心情和生活都变得更好。"}],"viz":[{"type":"timeline","title":"减肥的 4 个阶段","items":[["肥变中","男 > 25% · 女 > 30%","少吃零食夜宵，远离油炸高糖"],["中变瘦","男 20–25% · 女 25–30%","认真跟着餐单"],["平台期","体重暂停","调整饮食和运动方式来突破"],["瘦变完美","雕塑期","高蛋白 + 有氧 + 每周 3 次力量训练"]],"note":"百分比为体脂率判断标准，资料来自课堂讲义。"}],"myth":{"m":"体重一停住就代表方法没效了。","f":"平台期是正常过程。坚持并做小调整，身体会继续进步。"},"fact":{"num":"3","unit":"次 / 周","text":"雕塑期建议每周至少 3 次力量训练，加上每天的有氧运动。"},"tips":["每周同一天、同一时间量体重","同时记录腰围和体脂","照一张全身照，一个月后对比"],"task":"和教练一起订下下一个阶段的目标（体重、腰围或体脂），并写下来。","share":"你有认识谁减重遇到平台期就放弃的吗？","philo":"不管在哪个阶段，都按这张图来吃："},{"t":"为什么有信心","en":"What Makes Us Confident","tag":"信心","lead":"对产品、对公司、对自己的改变，都有信心。","intro":"走到第 19 天，你对营养已经有了扎实的认识。今天来谈谈信心：对产品、对公司，以及最重要的，对你自己。","points":[{"h":"产品信心","p":"根据国际市场调查机构 Euromonitor 2024 年的数据，康宝莱获得三个全球第一：","imgFull":true,"img":[{"f":"no1_three","cap":"三个全球第一（资料来源：Euromonitor，2025 年版，2024 年零售额数据）"}],"list":["全球第一的体重管理与健康品牌","全球第一的蛋白奶昔","全球第一的活跃生活营养品牌"],"after":"再加上看成分、看品质检测，以及你自己和身边人真实的改变，这就是我们对产品的信心。"},{"h":"公司信心","p":"康宝莱于 1980 年在美国洛杉矶创立，至今在全球 90 多个国家和地区营运，并在纽约证券交易所上市。"},{"h":"国际第三方认证","p":"康宝莱的产品获得多个国际第三方机构认证，包括：","list":["低升糖指数（Low GI）认证","NSF 运动认证：不含运动员禁用物质","清真（Halal）认证","非转基因（Non-GMO）验证","素食、无麸质、美国有机等认证"],"imgFull":true,"img":[{"f":"sci_cert","cap":"康宝莱产品获得的国际认证"}]},{"h":"亚太区 187 个卓越奖项","p":"2015 到 2024 年，康宝莱在亚太区获得 187 个卓越奖项，包括：","list":["韩国：连续 13 年最受信赖品牌奖（保健功能食品类）","台湾：连续 13 年国家品质标章","越南：连续 9 年公共健康金牌产品奖","泰国：连续 7 年获玛希隆大学营养研究所「健康选择」标志","马来西亚：2019 年健康与保健品牌奖"],"imgFull":true,"img":[{"f":"sci_187","cap":"2015–2024 年亚太区 187 个卓越奖项"},{"f":"sci_award1","cap":"亚太区产品品质奖项（韩国）"},{"f":"sci_award2","cap":"亚太区产品品质奖项（越南、台湾、泰国、香港、马来西亚）"}]},{"h":"运动员也在用","p":"康宝莱的营养产品也用在运动领域。","list":["赞助了 190 多名运动员、球队和体育赛事","运动员用它来帮助保持运动时的体力"]},{"h":"专注营养四十多年","p":"四十多年来专注于营养产品和营养教育，产品配方由营养和科学团队负责研发。"},{"h":"系统信心","p":"有教练跟进、有课程、有团队支持，不是一个人孤单地减重。"},{"h":"对自己的信心","p":"最重要的信心来自你自己。这 19 天，你已经在改变饮食、喝水和运动的习惯了。"}],"viz":[{"type":"chips","title":"康宝莱小档案","items":[["1980 年","创立于美国洛杉矶"],["90 多个","营运的国家和地区"],["纽约证交所","上市公司"],["40 多年","专注营养领域"],["190 多","赞助的运动员、球队和赛事"]]}],"myth":{"m":"改变习惯太难了，我做不到。","f":"你已经坚持了 19 天。每一个小改变，都证明你做得到。"},"fact":{"num":"1980","unit":"年","text":"康宝莱创立年份。"},"tips":["回顾第 1 天的记录","把进步写下来贴在显眼处","和教练分享你的改变"],"task":"写下这 19 天你身体或习惯上最明显的一个改变，分享给教练。","share":"你有认识谁想要改变，却对自己没有信心的吗？"},{"t":"互助精神与团队","en":"Bayanihan Spirit & Teamwork","tag":"教育系统","lead":"一个人走得快，一群人走得远。","intro":"健康习惯最难的不是开始，而是坚持。一个支持你的团队，能让坚持变得容易很多。","points":[{"h":"什么是 Bayanihan？","p":"Bayanihan 是菲律宾语，原意是邻里一起帮忙搬房子，代表互相帮助、一起扛起重担的精神。"},{"h":"同伴的力量","p":"有同伴一起打卡、一起运动、一起分享餐单，遇到困难时有人鼓励，坚持下去的机会更高。"},{"h":"什么是营养俱乐部？","p":"营养俱乐部是一个充满乐趣、享用健康早餐的地方。","list":["分享健康、健身和营养资讯","分享成功的经验","地点可以在家里或其他地方"],"after":"欢迎邀请想要健康的家人和朋友一起来。"},{"h":"教育系统","p":"营养俱乐部的教育系统包括健康知识课程、教练个人化跟进和团队活动，帮助你持续学习和进步。"},{"h":"健康与财富","p":"教育系统涵盖健康和财富两方面。当你自己有了改变，也可以成为帮助别人的人。"},{"h":"从受助者到助人者","p":"如果你也想帮助身边的人变健康，可以向教练了解分享计划。"}],"viz":[{"type":"timeline","title":"你的支持系统","items":[["教练","个人化餐单、饮食指导、效果跟进"],["课程","持续学习营养知识"],["团队","一起打卡、运动、互相鼓励"],["分享","帮助身边的人一起变健康"]]}],"myth":{"m":"健康是自己的事，不需要别人帮忙。","f":"研究和经验都显示，有支持系统的人更容易坚持健康习惯。"},"fact":{"num":"1+1","unit":"","text":"找一个健康伙伴，互相提醒、互相鼓励。"},"tips":["参加一次营养俱乐部的活动","和健康伙伴每天互相打卡","分享你的餐单给朋友看"],"task":"邀请一位朋友或家人，明天和你一起吃一顿健康早餐。","share":"你有认识谁想变健康，但一个人很难坚持的吗？"},{"t":"成为会员，继续前进","en":"Become a Member","tag":"会员","lead":"恭喜完成 21 天！这是新习惯的开始，不是结束。","intro":"21 天，你学会了热量、水分、细胞营养、早餐、升糖指数、蛋白质、脂肪、标签、运动和更多。接下来，要把这些知识变成一辈子的习惯。","points":[{"h":"回顾你的收获","p":"从第 1 天的热量观念，到第 18 天的减重阶段，你已经有了一套完整的健康饮食知识。"},{"h":"会员的好处","p":"成为会员后，你可以：","list":["以至少 25% 的折扣订购所有产品","用自己的户口推荐新会员","累计点数，达成更高的优惠","成为活跃会员后，了解零售和批发收入的机会"]},{"h":"成为会员只需 2 件事","p":"申请会员很简单：","list":["参加 75–90 分钟的康宝莱商机会议（NCOM）","购买会员资料袋（IBP），价格请向教练询问最新资料"]},{"h":"持续的指导","p":"继续获得教练的个人化餐单、饮食指导和效果跟进，按你的进展调整计划。"},{"h":"团队和活动","p":"参加营养俱乐部的课程和活动，和团队一起朝下一个目标前进。"},{"h":"下一个目标","p":"设定接下来 3 个月的目标，一步一步实现更健康的自己。"}],"viz":[{"type":"chips","title":"会员的好处","items":[["至少 25% 折扣","订购所有产品"],["推荐新会员","使用自己的个人户口"],["累计点数","达成更高的优惠"],["收入机会","活跃会员可了解零售与批发收入"]]},{"type":"recap","title":"这 21 天你学会了"}],"myth":{"m":"21 天结束，就可以回到以前的饮食了。","f":"21 天只是习惯的开始。持续下去，成果才会长久。"},"fact":{"num":"21","unit":"天","text":"你已经完成全部课程。为自己鼓掌！"},"tips":["每天继续喝够水","每餐继续有蛋白质","每周至少运动 150 分钟"],"task":"和教练约一个时间，回顾这 21 天的成果，订下接下来 3 个月的目标。","share":"你有认识谁也想开始这 21 天的健康旅程吗？","philo":"21 天学到的，都在这一张图里："}];
window.QUESTIONS = [{"q":"你知道什么是「神奇数字」吗？","opts":["每个人都一样，大约每天 2000 kcal","教练为你个人算出的每日卡路里目标","吃得越少越好的数字"],"a":1,"why":"神奇数字是你自己的号码。你的教练会帮你算出属于你自己的每日卡路里目标，每个人都不一样。"},{"q":"觉得口渴的时候，身体处于什么状态？","opts":["水分刚刚好，提醒你可以喝了","已经轻微缺水了","身体水分太多"],"a":1,"why":"口渴是身体缺水后才发出的信号。所以要定时喝水，不要等渴了才喝。"},{"q":"吃得很饱，是不是就代表身体的营养够了？","opts":["是，吃饱就够了","不一定，吃饱只代表热量够","只要吃很多肉就够"],"a":1,"why":"吃饱和吃到营养是两回事。细胞需要七大营养素，种类均衡才算真正喂饱细胞。"},{"q":"下面哪一份早餐，最能让你撑到中午都不饿？","opts":["一份椰浆饭加一杯甜咖啡","两片白面包加果酱","有蛋白质和纤维的早餐，例如鸡蛋加全麦面包或营养奶昔"],"a":2,"why":"蛋白质和纤维消化较慢，让血糖稳定，饱足感更持久。油、糖和精致淀粉多的早餐，很快又饿。"},{"q":"白米饭和一块蛋糕，哪一个让血糖升得比较快？","opts":["当然是蛋糕","白米饭的升糖指数其实也很高","两个都不会让血糖升高"],"a":1,"why":"白饭属于高 GI 食物（课堂讲义列为 92），炒米粉更高达 98。不吃甜食，不代表血糖就不会飙升。"},{"q":"一个 60 公斤、想维持体重的人，每天大约需要多少克蛋白质？","opts":["大约 10–20 克","大约 48–72 克","200 克以上"],"a":1,"why":"维持体重的参考量是每公斤体重 0.8–1.2 克，60 公斤 × 0.8–1.2 ≈ 48–72 克。想减重的话要提高到每公斤 1.2–1.6 克（约 72–96 克），想增重则是每公斤 1.6–2.2 克（约 96–132 克）。"},{"q":"想减重，是不是应该完全不吃油？","opts":["是，油越少越好","不是，要选对脂肪的种类","只吃椰浆和牛油就好"],"a":1,"why":"身体需要好脂肪来制造荷尔蒙和吸收维他命。要避免的是反式脂肪，并减少饱和脂肪。"},{"q":"一包零食的营养标签写「每份 150 kcal」，这包零食一共就是 150 kcal 吗？","opts":["是的","不一定，要看一包有几份","标签上的数字都不准"],"a":1,"why":"很多零食一包有 2–3 份，热量要乘上份数。先看份量，再看数字。"},{"q":"慢跑 30 分钟，大约消耗多少热量？","opts":["大约 250 kcal","大约 1000 kcal","大约 2000 kcal"],"a":0,"why":"慢跑 30 分钟约消耗 250 kcal，一杯奶茶就补回来了。所以运动后不要用大餐奖励自己。"},{"q":"同样是 2000 kcal，一整天的均衡营养餐和几个汉堡加薯条，对身体的影响一样吗？","opts":["一样，热量相同就好","不一样，营养完全不同","汉堡比较有营养"],"a":1,"why":"热量相同，营养可以差很远。营养丰富的食物让你更饱、更健康；热量密集的食物营养低，很快又饿。"},{"q":"晚上特别嘴馋，最常见的原因是什么？","opts":["天生意志力不够","白天蛋白质和水不够，或太晚吃饭","晚上肠胃比较好"],"a":1,"why":"晚上嘴馋常常是白天没吃够、没喝够。先把白天的三餐和点心吃对，晚上就比较不会想吃。"},{"q":"选择营养产品时，最应该看什么？","opts":["价钱越便宜越好","广告说得最神奇的","研发团队、成分标签和品质检测"],"a":2,"why":"可靠的产品要有科学团队研发、成分透明，并经过原料到成品的品质检测。"},{"q":"「天然」的原料，是不是一定安全？","opts":["是，天然就是安全","不一定，还要经过检验","天然的反而不好"],"a":1,"why":"天然原料也可能受污染或品质不稳定。从源头到成品都经过检验，才更安心。"},{"q":"每天吃维他命补充品，是不是就可以不吃蔬菜？","opts":["可以，补充品比较方便","不可以，补充品是辅助，不能取代食物","蔬菜没什么营养"],"a":1,"why":"蔬果有纤维和许多补充品没有的营养。先把饮食吃均衡，补充品用来填补缺口。"},{"q":"头发容易干、易断，可能和饮食中缺少什么有关？","opts":["蛋白质","糖","盐"],"a":0,"why":"头发和指甲主要由蛋白质构成。蛋白质吃不够，头发就容易变干、易断。B 族维他命和锌也很重要。"},{"q":"怎样简单判断自己有没有喝够水？","opts":["看尿液颜色","看有没有出汗","看体重"],"a":0,"why":"尿液接近淡黄色，代表水分大致充足；颜色越深，越需要喝水。"},{"q":"成年人每天建议吃多少膳食纤维？","opts":["5 克左右","25–30 克","100 克以上"],"a":1,"why":"建议每天 25–30 克，但很多人只吃到一半左右。多吃蔬菜、水果、全谷类和豆类。"},{"q":"减重期间体重连续两个星期都没有下降，代表什么？","opts":["方法没效，应该放弃","可能进入平台期，这是正常的","应该马上不吃饭"],"a":1,"why":"平台期是减重的正常阶段。检查饮食、加强运动、和教练讨论调整，就能继续前进。"},{"q":"这 19 天以来，你觉得自己最大的改变是什么？","opts":["饮食习惯","喝水习惯","运动习惯"],"a":-1,"why":"不管你选了哪一个，都是值得骄傲的进步。最重要的信心，来自你自己的改变。"},{"q":"一个人减重，和一群人一起减重，哪一个更容易坚持？","opts":["一个人比较自由","一群人互相鼓励","没有差别"],"a":1,"why":"有同伴一起打卡、一起运动，遇到困难时有人鼓励，坚持下去的机会更高。"},{"q":"21 天课程结束后，接下来最重要的是什么？","opts":["回到以前的饮食习惯","把学到的变成长期的生活方式","马上找新的减重方法"],"a":1,"why":"21 天只是开始。把健康习惯持续下去，成果才会长久。"}];

window.DAYS_I18N={"en":[{"t":"Cut calories, not food","en":"Cut Calories, Not Food","tag":"Meal plan","lead":"Weight management isn't about starving — it's about eating the right amount your body needs.","intro":"When people think of losing weight, many skip a meal or stop eating dinner. But your body needs nutrition, not hunger. Today we start with the most basic idea: everyone has their own \"magic number\".","points":[{"h":"Your magic number is yours alone","p":"Your \"magic number\" is your daily calorie target.","list":["It isn't a one-size-fits-all number","Your coach will work out your own magic number for you","Everyone's magic number is different"]},{"h":"Losing and gaining weight use different numbers","p":"Two people with the same height and weight but different goals have different magic numbers.","list":["If you want to lose weight, you get a weight-loss number","If you want to gain weight, you get a weight-gain number","As your weight and metabolism change, your coach will adjust it regularly"]},{"h":"Eat according to your magic number","p":"Once you know your magic number, the most important thing is to eat by it every day.","viz":[{"type":"kcal","title":"Calories in common foods (rough estimates)","items":[["rice","A bowl of white rice","200 kcal"],["roticurry","Roti canai with curry","300 kcal"],["steak","A steak","600 kcal"],["burger2","Burger","600 kcal"],["nasilemak","Nasi lemak","640 kcal"],["maggi","Maggi goreng","600 kcal"],["bread2","A slice of white bread","100 kcal"],["vege","A plate of mixed stir-fried vegetables","150 kcal"],["guava","A guava","45 kcal"]],"note":"These calories are estimates only; actual values depend on portion size and cooking method."}],"list":["To lose weight: eat by your number","To gain weight: eat by your number","To maintain: also eat by your number"],"after":"Eat according to your own body data and you'll get the best results. Eating too much or too little both take you further from your goal."},{"h":"Drinks and  protein powder",150],["Nutrition shake",100]],"note":"Shake calories follow the coach's recommended recipe; other foods are approximate."}],"list":["One shake meal: about 100 calories","Add protein powder: still only about 140–150 calories","Balanced protein, vitamins and minerals","About a quarter of the calories of a plate of nasi lemak or Maggi goreng"],"after":"You stay full and stay within your magic number."},{"h":"Why doesn't starving work?","p":"If you eat too little for too long, your body thinks there's a famine:","list":["It starts breaking down muscle","It lowers metabolism to save energy","Once you eat normally again, the weight comes back — sometimes more than before"]},{"h":"What are carbohydrates? What is protein?","p":"You can estimate portions with your own hand:","viz":[{"type":"hands","title":"Estimate portions with your hand","items":[["k_fist_carb","Carbohydrates","About 200 kcal","One fist-sized portion, e.g. broccoli","carb"],["k_palm_pro","Protein","About 300 kcal","One palm-sized portion, e.g. a piece of meat","pro"]],"note":"The circle in the picture shows one portion."},{"type":"portion","title":"Which foods are carbs? Which are protein?","carb":{"h":"Carbohydrates","kcal":"About 200","unit":"1 portion = 1 fist","items":[["Vegetables","vege"],["Fruit","guava"],["Whole grains","brownrice_k"],["Rice","rice","Eat as little as possible"]]},"pro":{"h":"Protein","kcal":"About 300","unit":"1 portion = 1 palm","items":[["Chicken","chicken"],["Fish","salmon"],["Tofu","tofu"],["Eggs","egg"],["Tempeh","tempeh"]]},"note":"From class handouts. The protein we want is high-quality protein like chicken, fish, tofu and eggs — eat less fatty and processed meat."}],"list":["Carbs: 1 portion = 1 fist","Protein: 1 portion = 1 palm","The two have different calories"],"after":"Knowing which group each food belongs to lets you build each meal using the portions your coach gives you."},{"h":"Swap foods instead of eating less","p":"For an equally filling meal, different choices can differ several times in calories.","list":["Choose more: protein, vegetables and whole foods","Choose less: fried food, refined starch and sugary drinks","Cooking: steam, boil and bake more; fry less"],"after":"That way you stay full and still stay within your magic number."}],"viz":[{"type":"bars","title":"Eat a little extra every day — how much body fat after a year?","unit":"kg","note":"Theoretical estimate: extra calories per day × 365 days ÷ 7700 kcal (about 1 kg of body fat).","items":[["1 extra biscuit a day (about 50 kcal)",2.4],["1 extra sugary drink a day (about 150 kcal)",7.1],["1 extra slice of cake a day (about 300 kcal)",14.2]]},{"type":"caltable","title":"Calorie quick-reference","tabs":[{"name":"Local breakfasts","note":"Typical portions, approximate values.","rows":[["Mee goreng","1 plate",660],["Fried rice with egg","1 plate",635],["Maggi goreng","1 plate",600],["Fried bee hoon","1 plate",550],["Nasi minyak (plain)","1 plate",445],["Nasi lemak (sambal)","1 plate",400],["Mee sup","1 bowl",380],["Chicken rice (plain)","1 plate",300],["Chicken pau","1 piece",205],["Roti canai (plain)","1 piece",200],["Chapati (plain)","1 piece",180],["White bread","2 slices",160]]},{"name":"Roti canai","note":"Calories listed on one restaurant's menu, including sides; values differ with cooking.","rows":[["Roti pisang (banana)","1 piece",500],["Roti milo","1 piece",470],["Roti tisu","1 piece",465],["Roti boom","1 piece",465],["Roti telur (egg)","1 piece",455],["Roti cheese","1 piece",410],["Roti planta","1 piece",400],["Roti sardin","1 piece",355],["Roti bawang (onion)","1 piece",350],["Roti sayur (vegetable)","1 piece",350],["Roti salad","1 piece",350],["Roti biasa (plain)","1 piece",345]]},{"name":"Noodles","note":"Approximate calories per bowl.","rows":[["Beef brisket bee hoon","1 bowl",455],["Fish-skin dumpling noodles","1 bowl",389],["Meatball bee hoon","1 bowl",383],["Dumpling noodles","1 bowl",370],["Beef ball noodles","1 bowl",370],["Wonton
