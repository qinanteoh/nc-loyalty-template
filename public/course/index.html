al supaya dapat menikmati tanpa hilang kawalan."},"fact":{"num":"80/20","unit":"","text":"80% masa makan sihat, 20% masa berehat dan menikmati, lebih mudah untuk diteruskan dalam jangka panjang."},"tips":["Makan sedikit protein sebelum majlis untuk alas perut","Di bufet, ambil sepinggan sayur dahulu","Pilih air kosong atau teh tanpa gula sebagai minuman"],"task":"Pilih dua sarapan yang paling kerap anda makan, dan bandingkan kalori, protein dan gula bersama jurulatih.","share":"Adakah anda kenal sesiapa yang juga berminat dengan maklumat kesihatan 10 hari ini?"},{"t":"Kelab nutrisi dan kawalan lapar","en":"Nutrition Club · Hunger Control","tag":"Pelan nutrisi","lead":"Fasa pertama selesai! Semak kemajuan anda dan belajar mengawal rasa lapar.","intro":"Anda sudah melalui 10 hari pertama. Hari ini, imbas kembali perubahan anda, kemudian pelajari kemahiran paling penting fasa kedua: mengawal rasa lapar.","points":[{"h":"Apa itu kelab nutrisi?","p":"Kelab nutrisi ialah tempat untuk belajar ilmu nutrisi dan membina tabiat sihat bersama-sama.","list":["Jurulatih menyediakan pelan makan peribadi","Bimbingan pemakanan dan susulan hasil","Rakan saling memberi semangat"]},{"h":"Falsafah nutrisi global","p":"Nutrisi seimbang merangkumi tujuh nutrien: protein, karbohidrat, lemak, vitamin, mineral, serat dan air.","imgFull":true,"img":[{"f":"philosophy","cap":"Nutrisi seimbang Herbalife: 30% protein, 40% karbohidrat, 30% lemak, ditambah Omega-3, kurangkan lemak tepu, 25 g serat, air dan tidur yang cukup, serta senaman sederhana"}]},{"h":"Empat cara mengawal lapar","p":"Protein pada setiap hidangan, lebih banyak serat, minum air yang cukup, makan tepat pada masanya tanpa skip. Lakukan empat perkara ini dan kebanyakan rasa lapar akan berkurang."},{"h":"Bagaimana jika teringin makan pada waktu malam?","p":"Terlalu teringin makan pada waktu malam selalunya kerana protein dan air tidak cukup pada siang hari, atau makan tengah hari terlalu lewat. Semak dahulu sama ada pemakanan siang hari mencukupi."},{"h":"Bezakan lapar sebenar dan teringin","p":"Lapar sebenar datang perlahan-lahan dan anda sanggup makan apa sahaja; teringin datang tiba-tiba dan hanya mahu snek tertentu. Apabila teringin, minum air dan alihkan perhatian selama 10 minit."}],"viz":[{"type":"check","title":"Semakan kendiri fasa pertama (berbanding Hari 1)","items":["Adakah berat badan berubah?","Adakah lilitan pinggang berubah?","Adakah tenaga dan stamina lebih baik daripada dahulu?","Adakah kualiti tidur bertambah baik?","Adakah buang air besar teratur?","Adakah rasa lapar dan teringin makan berkurang?"]}],"myth":{"m":"Lapar bermakna kurang daya tahan diri, tahan sahaja.","f":"Lapar ialah isyarat badan. Makan makanan yang betul dan pada masa yang tetap, rasa lapar akan berkurang dengan sendirinya, tidak perlu menahan."},"fact":{"num":"10","unit":" hari","text":"Anda sudah separuh jalan. Mulai sini, perubahan tabiat menjadi lebih mudah."},"tips":["Makan protein dahulu pada setiap hidangan","Sediakan snek sihat di antara hidangan","Selepas 8 malam, hanya minum air atau teh tanpa gula"],"task":"Ukur lilitan pinggang (pada paras pusat), catat, dan gunakan senarai semak di atas untuk berkongsi perubahan 10 hari ini dengan jurulatih.","share":"Adakah anda kenal sesiapa yang selalu teringin makan pada waktu malam dan tidak dapat mengawal selera?"},{"t":"Sains di sebalik produk","en":"The Science Behind the Products","tag":"Syarikat","lead":"Apabila memilih produk nutrisi, lihat sama ada ada sains dan kawalan kualiti di belakangnya.","intro":"Terdapat banyak produk nutrisi di pasaran, harga dan kualitinya sangat berbeza. Belajar melihat sains dan pengurusan kualiti di sebalik produk supaya dapat memilih produk yang boleh dipercayai.","points":[{"h":"Pasukan penyelidikan dan pembangunan profesional","p":"Di belakang Herbalife ialah pasukan profesional terdiri daripada doktor, pakar diet dan saintis yang bertanggungjawab atas pembangunan produk dan pendidikan nutrisi:","list":["Lebih 200 pakar yang diiktiraf antarabangsa di seluruh dunia, termasuk doktor, jurulatih, pakar diet dan ahli lembaga penasihat","Produk diuji di 16 makmal di seluruh dunia","Makmal mencapai piawaian antarabangsa tertinggi ISO 17025"],"imgFull":true,"img":[{"f":"sci_team","cap":"Lembaga Penasihat Nutrisi Herbalife: pasukan doktor, pakar diet dan saintis"}],"viz":[{"type":"chips","cols":3,"title":"Angka di sebalik sains","items":[["200+","Pakar diiktiraf antarabangsa"],["16","Makmal ujian di seluruh dunia"],["ISO 17025","Piawaian makmal antarabangsa tertinggi"]]}]},{"h":"Berasaskan kajian","p":"Formula yang baik berasaskan kajian sains nutrisi, bukan hanya bergantung pada iklan dan cakap mulut."},{"h":"Bahan yang telus","p":"Label menyenaraikan semua bahan dan kandungannya dengan jelas, serta mematuhi peraturan makanan tempatan."},{"h":"Pelbagai ujian kualiti","p":"Daripada bahan mentah, proses pengeluaran hingga produk siap, semuanya diuji untuk memastikan setiap produk sepadan dengan label, selamat dan boleh dipercayai."},{"h":"Program duta","p":"Jika anda berpuas hati dengan produk dan hasilnya, anda boleh mengenali program duta untuk menikmati lebih banyak kelebihan. Terdapat dua syarat untuk menjadi duta:","list":["Pelanggan setia: yakin dengan produk dan syarikat, dan sanggup membantu 2 orang memulakan pelan nutrisi seperti anda","Pengguna setia produk: memutuskan untuk menjadikan sarapan nutrisi sebagai sarapan ideal jangka panjang"]},{"h":"Kongsikan perkara yang baik","p":"Ajak ahli keluarga menyertai pelan nutrisi bersama, supaya seluruh keluarga menikmati gaya hidup sihat dan aktif. Jurulatih akan sentiasa membantu anda."}],"viz":[{"type":"timeline","title":"4 soalan untuk ditanya ketika memilih produk nutrisi","items":[["Siapa yang membangunkannya?","Adakah ada pasukan profesional nutrisi dan sains?"],["Adakah ada asasnya?","Adakah formula berasaskan kajian?"],["Adakah label jelas?","Adakah semua bahan dan kandungan disenaraikan?"],["Adakah ia diuji?","Adakah bahan mentah dan produk siap melalui ujian kualiti?"]]}],"myth":{"m":"Semua produk nutrisi lebih kurang sama, beli yang paling murah sudah memadai.","f":"Sumber bahan mentah, formula dan pengurusan kualiti sangat berbeza. Memilih produk yang berasaskan sains dan kawalan kualiti yang ketat lebih meyakinkan."},"fact":{"num":"3","unit":" peringkat","text":"Pemeriksaan bahan mentah, proses pengeluaran, ujian produk siap: tiga peringkat kawalan kualiti."},"tips":["Lihat bahan dan label nutrisi sebelum membeli","Jangan percaya iklan \"kesan segera\" atau \"ajaib\"","Jika ragu-ragu, tanya jurulatih atau pakar"],"task":"Fikirkan siapa di sekeliling anda yang juga mahu lebih sihat, dan kongsikan kursus 21 hari ini dengan mereka.","share":"Adakah anda kenal sesiapa yang membeli produk nutrisi hanya berdasarkan harga dan iklan?"},{"t":"Dari benih ke meja makan","en":"Seed to Feed","tag":"Syarikat","lead":"Produk yang baik perlu dikawal dari punca asalnya.","intro":"\"Dari benih ke meja makan\" bermakna kualiti produk bukan hanya diperiksa pada peringkat akhir di kilang, tetapi setiap langkah mempunyai piawaian bermula dari penanaman bahan mentah.","points":[{"h":"Nutrisi berasaskan sains","p":"Pasukan sains memastikan formula produk berasaskan kajian nutrisi terkini.","imgFull":true,"img":[{"f":"sci_quality","cap":"Proses kualiti saintifik: 5 kali ujian, iaitu selepas penanaman dan penuaian, bahan mentah, selepas pencampuran, selepas pengangkutan dan selepas pembungkusan"}]},{"h":"Produk terbaik berasal daripada bahan mentah terbaik","p":"Bahan dalam produk mesti melalui pengesahan dan ujian ketulenan yang ketat, sehingga ke peringkat molekul."},{"h":"Ujian ketat pada setiap langkah","p":"Daripada mengesahkan ketulenan dan keberkesanan bahan hingga ujian akhir produk siap, barisan pengeluaran diuji tanpa henti untuk memastikan produk memenuhi atau melebihi garis panduan peraturan yang paling ketat."},{"h":"Pengeluaran selamat","p":"Produk dikeluarkan memenuhi atau melebihi piawaian Amalan Pengilangan Baik (cGMP), memastikan proses dan kemudahan pengeluaran direka dan dipantau dengan betul."},{"h":"Kualiti sampai ke tangan anda","p":"Teknologi canggih memantau persekitaran penyimpanan produk siap, dan sampel disimpan untuk memastikan kualiti produk sepanjang tempoh sah."}],"viz":[{"type":"timeline","title":"5 kali ujian kualiti","items":[["Selepas penanaman dan penuaian","Menguji sumber bahan mentah"],["Ujian bahan mentah","Mengesahkan bahan dan ketulenan"],["Ujian selepas pencampuran","Memastikan formula tepat"],["Ujian selepas pengangkutan","Mengesahkan kualiti tidak berubah"],["Ujian selepas pembungkusan","Memastikan sepadan dengan label"]]}],"myth":{"m":"Asalkan \"semula jadi\", pasti selamat.","f":"Bahan semula jadi juga boleh tercemar atau kualitinya tidak stabil. Bahan yang diuji dengan ketat lebih selamat."},"fact":{"num":"4","unit":" langkah","text":"Penanaman → pemeriksaan bahan mentah → pengeluaran → ujian produk siap."},"tips":["Lihat sama ada produk mempunyai maklumat pengeluar yang jelas","Perhatikan tarikh luput dan cara penyimpanan produk","Gunakan mengikut sukatan yang disyorkan"],"task":"Ambil produk nutrisi yang sedang anda gunakan, lihat bahan, maklumat nutrisi dan maklumat pengeluar pada label.","share":"Adakah anda kenal sesiapa yang sangat mementingkan keselamatan dan kualiti makanan?"},{"t":"Suplemen nutrisi harian","en":"Daily Nutritional Supplements","tag":"Nutrisi","lead":"Suplemen nutrisi digunakan untuk mengisi jurang pemakanan, bukan menggantikan hidangan utama.","intro":"Idealnya, semua nutrisi patut datang daripada makanan. Tetapi kehidupan sibuk, kerap makan di luar dan kurang makan sayur dan buah menyebabkan ramai orang mempunyai jurang nutrisi setiap hari.","points":[{"h":"Kenapa ada jurang nutrisi?","p":"Makanan luar yang berminyak dan masin, kurang sayur dan buah, pemakanan yang kurang pelbagai, ditambah tekanan dan rutin tidak teratur, semuanya boleh menyebabkan badan kekurangan vitamin dan mineral tertentu."},{"h":"Nutrisi makanan asli lebih rendah berbanding dahulu","p":"Ramai berkata \"makan makanan asli sudah cukup\". Makanan asli memang perlu dimakan, tetapi nutrisi sayur dan buah hari ini sudah berbeza berbanding beberapa dekad lalu:","list":["Satu kajian dalam Journal of the American College of Nutrition membandingkan data nutrisi 43 jenis sayur dan buah pada tahun 1950 dan 1999","Kalsium, zat besi, vitamin C, riboflavin (vitamin B2) dan nutrien lain menurun dalam pelbagai sayur dan buah","Contohnya kalsium dalam brokoli menurun daripada 130 mg setiap hidangan pada tahun 1950 kepada kira-kira 48 mg","Antara puncanya ialah kehilangan nutrien tanah dan pembiakan baka yang mengutamakan hasil dan rupa"],"after":"Jadi suplemen nutrisi harian membantu menampung kekurangan nutrisi apabila kita tidak dapat makan seimbang setiap hari, bukan menggantikan makanan asli.","imgFull":true,"img":[{"f":"nut_study","cap":"Journal of the American College of Nutrition 2004: perubahan kandungan nutrien 43 tanaman kebun, 1950–1999"},{"f":"nut_decline","cap":"Brokoli, kubis bunga, tembikai susu, terung, tomato, asparagus: perubahan nutrien 1950 vs 1999 (%)"}]},{"h":"Nutrien yang biasa tidak mencukupi","p":"Serat diet, kalsium, vitamin D, zat besi (terutamanya wanita) dan Omega-3 ialah nutrien yang mudah kurang dalam pemakanan ramai orang."},{"h":"Fungsi vitamin dan mineral","p":"Badan memerlukan vitamin dan mineral yang secukupnya untuk mengekalkan keseimbangan fungsi.","viz":[{"type":"cloud","title":"Vitamin dan mineral yang diperlukan badan setiap hari","items":[["Vitamin A","","v",1],["B1","","v",3],["B2","","v",3],["B3","","v",3],["B5","","v",3],["B6","","v",3],["B12","","v",3],["Vitamin C","","v",2],["Vitamin D","","v",1],["Vitamin E","","v",1],["Vitamin K","","v",3],["Asid folik","","v",3],["Biotin","","v",3],["Kalsium","","m",2],["Zat besi","","m",1],["Zink","","m",1],["Magnesium","","m",1],["Kalium","","m",1],["Iodin","","m",3],["Selenium","","m",3],["Kromium","","m",3],["Molibdenum","","m",3],["Mangan","","m",3]],"note":"Oren ialah vitamin, biru ialah mineral."}],"after":"Keperluannya tidak banyak, tetapi pemakanan harian belum tentu mencukupi setiap hari."},{"h":"Ambil suplemen secara sederhana","p":"Suplemen bukan semakin banyak semakin baik; gunakan mengikut sukatan yang disyorkan. Sesetengah vitamin dan mineral boleh memudaratkan jika berlebihan."},{"h":"Keadaan khas: tanya doktor dahulu","p":"Jika anda mempunyai penyakit kronik, hamil, menyusu atau sedang mengambil ubat, rujuk doktor atau ahli farmasi sebelum memulakan sebarang suplemen."},{"h":"Senaman dan tidur juga sebahagian daripada nutrisi","p":"Selain makan dengan betul, senaman sederhana dan tidur yang cukup juga sebahagian daripada gaya hidup sihat."}],"viz":[{"type":"chips","title":"Jurang nutrisi biasa dan sumber makanan","items":[["Serat diet","Sayur, buah, bijirin penuh, kekacang"],["Kalsium","Susu, tauhu, ikan bilis, sayur hijau gelap"],["Vitamin D","Cahaya matahari, telur, ikan laut dalam"],["Zat besi","Daging merah, sayur hijau gelap, kekacang"],["Omega-3","Salmon, makarel, sardin, biji rami"]]}],"myth":{"m":"Jika makan vitamin, tidak perlu makan sayur.","f":"Sayur dan buah mengandungi serat dan banyak nutrien yang tiada dalam suplemen. Suplemen hanya membantu, tidak boleh menggantikan pemakanan seimbang."},"fact":{"num":"5","unit":" hidangan","text":"Disyorkan makan sekurang-kurangnya 5 hidangan sayur dan buah sehari (kira-kira 400 g), sumber nutrisi paling asas."},"tips":["Sayur memenuhi separuh pinggan pada setiap hidangan","Berjemur di bawah matahari 10–15 minit setiap hari","Ambil suplemen bersama makanan untuk penyerapan lebih baik"],"task":"Kira berapa hidangan sayur dan buah yang anda makan hari ini (satu hidangan kira-kira sebesar penumbuk), sasarannya 5 hidangan.","share":"Adakah anda kenal sesiapa yang kerap makan di luar dan jarang makan sayur dan buah?","philo":"Vitamin dan mineral membantu mengisi jurang nutrisi seimbang:"},{"t":"Nutrisi luaran","en":"Outer Nutrition","tag":"Produk","lead":"Kulit cantik memerlukan gabungan dalam dan luar: nutrisi dalaman + penjagaan luaran, barulah hasilnya terbaik.","intro":"Kulit ialah organ terbesar badan dan patut dijaga dengan baik. Kecantikan datang dari dalam; kulit, rambut dan kuku diperbaharui setiap hari, dan bahan mentahnya datang daripada nutrisi yang anda makan.","points":[{"h":"Vitamin B kompleks","p":"Vitamin B2, B3, B6 dan biotin membantu mengekalkan kesihatan kulit dan rambut. Vitamin B larut dalam air dan perlu diambil setiap hari."},{"h":"Zink dan kuprum","p":"Zink membantu mengekalkan kesihatan kulit, rambut dan kuku; kuprum membantu pigmentasi normal rambut dan kulit."},{"h":"Protein","p":"Rambut dan kuku kebanyakannya terdiri daripada protein, dan kolagen kulit juga memerlukan protein sebagai bahan mentah. Jika kurang protein, rambut menjadi kering dan mudah patah."},{"h":"Air dan lemak baik","p":"Minum air yang cukup memastikan kulit lembap; lemak baik seperti Omega-3 membantu mengekalkan lapisan pelindung kulit."},{"h":"Penjagaan luaran sama penting","p":"Pelindung matahari setiap hari, tidur yang cukup, pembersihan lembut, kurangkan tidur lewat dan tidak merokok, semuanya membantu kulit kekal sihat."},{"h":"Produk nutrisi luaran Herbalife","p":"Kulit ialah organ terbesar badan. Selain makan nutrisi yang betul dari dalam, ia juga perlu dijaga dari luar. Herbalife mempunyai rangkaian produk penjagaan luaran:","list":["Siri SKIN: pencuci muka, toner, serum, krim siang, krim malam, pengelupas dan penjagaan harian lain","Siri Aloe: krim tangan, sabun mandi, gel penenang, syampu dan perapi","Topeng muka vitamin: 12 jenis vitamin, ditambah aloe dan avokado untuk membantu melembapkan"],"after":"Kulit memerlukan gabungan dalam dan luar: makan nutrisi yang betul dari dalam dan jaga dengan baik dari luar; gabungan kedua-duanya memberi hasil terbaik. Berminat untuk tahu lebih lanjut? Minta jurulatih aturkan satu sesi Skin Spa untuk anda merasai sendiri nutrisi luaran kami.","imgFull":true,"img":[{"f":"skin_products2","cap":"Nutrisi luaran Herbalife: siri penjagaan kulit SKIN, siri penjagaan badan dan rambut Aloe, topeng muka vitamin"}]}],"viz":[{"type":"chips","title":"Nutrien untuk kulit dan rambut, serta sumber makanan","items":[["Vitamin B2","Susu, telur, sayur berdaun hijau"],["Vitamin B3","Ayam, ikan, kacang tanah"],["Vitamin B6","Ayam, pisang, kentang"],["Biotin","Kuning telur, kekacang, biji-bijian"],["Kuprum","Kekacang, kerang-kerangan, bijirin penuh"],["Zink","Tiram, daging merah, biji labu"]]}],"myth":{"m":"Kulit cantik hanya bergantung pada produk penjagaan.","f":"Produk penjagaan bertindak di permukaan; bahan mentah kulit datang daripada pemakanan. Nutrisi dalaman dan penjagaan luaran bersama memberi hasil lebih baik."},"fact":{"num":"7–9","unit":" jam","text":"Tempoh tidur yang disyorkan untuk orang dewasa setiap malam. Waktu tidur ialah masa penting untuk kulit membaiki diri."},"tips":["Sapu pelindung matahari sebelum keluar","Letak telefon sejam sebelum tidur","Segenggam kecil kekacang sehari"],"task":"Malam ini tidur 30 minit lebih awal daripada biasa, letak telefon, dan lihat sama ada anda lebih bertenaga esok pagi. Jika mahu tahu tentang penjagaan luaran, minta jurulatih aturkan satu sesi Skin Spa.","share":"Adakah anda kenal sesiapa yang sangat mementingkan penjagaan kulit dan rambut?","leadHL":true},{"t":"Hidrasi dan kesihatan sel","en":"Hydration & Cellular Health","tag":"Nutrisi","lead":"Minum air bukan sekadar hilangkan dahaga; air ialah persekitaran sel berfungsi.","intro":"Pada Hari 2 kita belajar perlu minum air yang cukup. Hari ini kita pergi lebih jauh: bagaimana menilai sama ada minum cukup, dan hubungan air dengan kesihatan sel.","points":[{"h":"Tiga soalan hidrasi: berapa banyak? kenapa? minum apa?","p":"Keperluan setiap orang berbeza, tetapi ingat tiga perkara ini:","list":["Berapa banyak: disyorkan 8–10 cawan air sehari (400 ml secawan, kira-kira 3–4 liter) supaya badan berada dalam keadaan terbaik","Kenapa: kekurangan air menyebabkan keletihan, sembelit, kulit kering, migrain dan kejang otot","Minum apa: selain air kosong, minuman pekat aloe dan teh herba rosel Herbalife yang dibancuh dengan air juga membantu mencukupkan keperluan air harian"],"after":"Rasa air kosong tawar dan sukar diminum? Bancuh minuman aloe atau teh herba, rendah kalori dan menyegarkan, lebih mudah minum 8–10 cawan.","viz":[{"type":"kcal","title":"Pembantu untuk minum air yang cukup","items":[["aloe","Minuman pekat aloe","Rendah kalori","Bancuh dengan air"],["tea","Teh herba rosel","Rendah kalori","Panas atau sejuk"],["s_water","Air kosong","0 kalori","8–10 cawan sehari"]]}]},{"h":"8–10 cawan sehari (3–4 liter)","p":"Sama ada semasa aktiviti harian atau bersenam, air sangat penting untuk badan.","list":["8–10 cawan sehari, kira-kira 3–4 liter","Atau 40–50 ml setiap kg berat badan","Minum lebih banyak apabila berpeluh semasa bersenam"]},{"h":"Kesan kekurangan air","p":"Kekurangan air boleh menyebabkan sakit kepala, kejang otot, keletihan otot, sembelit, kulit kering, dan selalu rasa letih.","viz":[{"type":"bubbles","title":"Kesan kekurangan air","items":["Sakit kepala","Kejang otot","Keletihan otot","Sembelit","Kulit kering","Selalu letih"]}]},{"h":"Keseimbangan di dalam dan di luar sel","p":"Otot, saraf dan metabolisme tenaga hanya dapat berfungsi dengan normal apabila air dan elektrolit (natrium, kalium, magnesium) di dalam dan di luar sel seimbang."},{"h":"Gantikan elektrolit apabila banyak berpeluh","p":"Apabila banyak berpeluh semasa bersenam atau cuaca panas, selain minum air, gantikan juga elektrolit untuk mengelakkan kejang dan keletihan."},{"h":"Nilai melalui warna air kencing","p":"Air kencing hampir kuning pucat bermakna badan cukup air; semakin gelap warnanya, semakin perlu minum air. (Sesetengah vitamin boleh menjadikan air kencing kuning, ini perkara biasa.)"},{"h":"Minuman yang membantu hidrasi","p":"Air kosong paling baik; teh herba dan teh tanpa gula juga membantu hidrasi. Minuman bergula tidak dikira, malah menambah kalori."},{"h":"Masa yang baik untuk minum air","p":"Selepas bangun tidur, sebelum setiap hidangan, sebelum dan selepas bersenam, ketika letih atau teringin snek, semuanya masa yang baik untuk minum air."}],"viz":[{"type":"swatch","title":"Semak hidrasi melalui warna air kencing","items":[["#f6f2c8","Cukup air"],["#f1e58f","Cukup air"],["#e9cf55","Boleh minum lebih sedikit"],["#d9ad2d","Perlu minum air"],["#b9831d","Jelas kekurangan air, minum segera"]],"note":"Untuk rujukan harian sahaja. Jika warna luar biasa atau sentiasa gelap, rujuk doktor."}],"myth":{"m":"Pada musim sejuk atau dalam bilik berhawa dingin tidak berpeluh, jadi tidak perlu minum banyak air.","f":"Badan kehilangan air melalui pernafasan dan kulit setiap hari, dan udara dalam bilik berhawa dingin kering, jadi tetap perlu minum air."},"fact":{"num":"Kuning pucat","unit":"","text":"Air kencing hampir kuning pucat bermakna badan cukup air."},"tips":["Letakkan botol air di tempat yang mudah dilihat","Tambah hirisan lemon atau daun pudina ke dalam air","Minum segelas air sebelum setiap hidangan"],"task":"Hari ini, tukar segelas minuman bergula kepada air kosong atau teh tanpa gula, dan perhatikan warna air kencing.","share":"Adakah anda kenal sesiapa yang selalu letih dan sakit kepala tetapi jarang minum air?","philo":"Air yang mencukupi ialah bahagian penting nutrisi seimbang:"},{"t":"Penuaan sihat dan serat","en":"Healthy Aging · Greens Power","tag":"Nutrisi","lead":"Hidup lama tidak cukup, kita mahu hidup bertenaga dan bersemangat.","intro":"Penuaan sihat bermakna masih boleh bergerak bebas, bertenaga dan kurang penyakit apabila usia meningkat. Protein dan serat dalam pemakanan ialah dua pembantu paling penting.","points":[{"h":"Otot ialah modal penuaan sihat","p":"Penuaan ialah proses struktur atau fungsi badan merosot perlahan-lahan. Tanpa latihan, otot berkurang kira-kira 1% setahun selepas umur 30:","list":["Otot berkurang, lemak bertambah, nampak lebih gemuk walaupun berat sama","Kurang otot, keupayaan membakar lemak menurun, lebih mudah gemuk","Pada umur 70, otot mungkin tinggal kira-kira dua pertiga berbanding umur 30","Kekal aktif, bersenam secara berkala dan makan protein yang cukup boleh melambatkan kehilangan otot"],"viz":[{"type":"bars","title":"Perubahan jisim otot mengikut usia tanpa latihan (ilustrasi)","unit":"%","items":[["Umur 30",100],["Umur 40",90],["Umur 50",82],["Umur 60",74],["Umur 70",67,1]],"note":"Nilai ilustrasi dengan jisim otot pada umur 30 sebagai 100%. Senaman sederhana dan protein yang cukup boleh mengekalkan jisim otot."}]},{"h":"Tiga kebaikan utama serat","p":"Serat diet bukan hanya membantu buang air besar, malah banyak lagi kebaikannya:","list":["Pencernaan: menggalakkan pergerakan usus, menambah isi najis, menyokong pertumbuhan bakteria baik dan mengurangkan risiko penyakit usus","Imuniti: serat yang boleh ditapai seperti inulin dan kanji rintang ialah \"prebiotik\", makanan bakteria baik dalam usus. Asid lemak rantai pendek yang dihasilkan membantu mengawal tindak balas imun dan mengurangkan keradangan","Kesihatan metabolik: lebih banyak sayur, buah, ikan, produk tenusu, kopi dan teh membantu mencegah sindrom metabolik"],"imgFull":true,"img":[{"f":"fib_benefit","cap":"Serat dan pencernaan, imuniti serta sindrom metabolik (rujukan: Microorganisms 2023; Academy of Nutrition and Dietetics 2015)"}]},{"h":"Kajian membuktikan: protein dan serat yang cukup, penurunan berat badan lebih berjaya","p":"Satu kajian 2024 dalam jurnal Obesity Science and Practice menjejaki peserta program penurunan berat badan selama setahun:","list":["Mereka yang berjaya, berat badan purata turun kira-kira 13% selepas setahun","Yang tidak berjaya hanya turun kira-kira 2%","Perbezaan utama: yang berjaya makan lebih banyak protein dan serat sambil mengawal kalori"],"after":"Kesimpulan kajian: untuk berjaya mengurus berat badan, makan lebih banyak protein dan serat sambil mengawal kalori.","imgFull":true,"img":[{"f":"fib_study","cap":"Lee et al., 2024, Obesity Science and Practice: perubahan pemakanan yang berjaya berkait dengan hasil penurunan berat badan"}]},{"h":"Serat menstabilkan gula darah dan kolesterol","p":"Serat larut (oat, kekacang, epal) melambatkan penyerapan gula dan membantu menurunkan kolesterol."},{"h":"Kebanyakan orang tidak cukup serat","p":"Orang dewasa memerlukan kira-kira 25 g serat sehari, tetapi jika hanya bergantung pada makanan semula jadi, perlu makan banyak:","list":["5 g serat ≈ 2 biji ubi keledek atau 3 biji oren","25 g serat ≈ 10 biji ubi keledek atau 15 biji oren","Kebanyakan orang hanya mendapat kira-kira separuh setiap hari"],"imgFull":true,"img":[{"f":"fib_25g","cap":"25 g serat ≈ 10 biji ubi keledek ≈ 15 biji oren"}],"viz":[{"type":"cmp2","title":"Berapa kalori perlu dimakan untuk serat yang cukup?","a":"Makanan semula jadi","b":"Herbalife Active Fiber Complex","rows":[{"h":"5 g serat","a":[["2 biji ubi keledek","Kira-kira 200 kcal"],["3 biji oren","Kira-kira 190 kcal"]],"b":["1 hidangan","9 kcal"]},{"h":"25 g serat","a":[["10 biji ubi keledek","Kira-kira 1000 kcal"],["15 biji oren","Kira-kira 930 kcal"]],"b":["5 hidangan","45 kcal"]}],"note":"Kalori makanan semula jadi adalah anggaran. Makanan semula jadi tetap perlu dimakan; minuman serat membantu mengisi kekurangan tanpa menambah banyak kalori."}]},{"h":"Serat ada tiga jenis, terbaik diambil bersama","p":"Serat bukan satu jenis sahaja; serat berbeza mempunyai fungsi berbeza:","list":["Serat larut: membentuk gel dalam usus, melambatkan penyerapan gula, membantu menstabilkan gula darah dan kolesterol, serta menambah rasa kenyang","Serat tak larut: menambah isi najis, menggalakkan pergerakan usus dan melancarkan buang air besar","Inulin: sejenis prebiotik, makanan bakteria baik dalam usus, membantu mengekalkan kesihatan usus"],"after":"Herbalife Active Fiber Complex (mengandungi inulin) mempunyai serat larut dan tak larut, 5 g serat setiap hidangan dengan hanya 9 kalori, membantu anda mencukupkan keperluan serat harian dengan mudah.","viz":[{"type":"chips","cols":3,"title":"Tiga jenis serat, setiap satu ada fungsinya","items":[["Larut","Menstabilkan gula darah, menurunkan kolesterol"],["Tak larut","Membantu buang air besar"],["Inulin","Memberi makan bakteria baik usus"]]}],"imgFull":true,"img":[{"f":"fib_product","cap":"Herbalife Active Fiber Complex (mengandungi inulin): serat larut + tak larut, 5 g setiap hidangan"}]},{"h":"Tingkatkan perlahan-lahan, minum lebih banyak air","p":"Menambah serat secara mendadak boleh menyebabkan kembung. Tingkatkan secara beransur-ansur dan minum lebih banyak air supaya serat berfungsi dengan baik."}],"viz":[{"type":"bars","title":"Serat dan kalori dalam satu hidangan makanan biasa","unit":"g","target":[25,"Sasaran harian 25 g"],"items":[["Semangkuk kacang dal masak (kira-kira 200 g)",15,0,230],["Sebiji pir",5.5,0,100],["Herbalife Active Fiber Complex (1 hidangan)",5,0,9],["Semangkuk brokoli masak",5,0,55],["Semangkuk bubur oat",4,0,160],["Sekeping roti gandum penuh",2,0,80],["Semangkuk nasi putih",0.6,0,200]],"note":"Nilai anggaran. Herbalife Active Fiber Complex mengandungi 5 g serat setiap hidangan dengan hanya 9 kalori."}],"myth":{"m":"Makan serat menyebabkan selalu ke tandas.","f":"Serat yang secukupnya menjadikan buang air besar lebih teratur. Tingkatkan secara beransur-ansur dan minum lebih banyak air, badan akan menyesuaikan diri."},"fact":{"num":"25–30","unit":"g","text":"Pengambilan serat diet harian yang disyorkan untuk orang dewasa. Ramai orang hanya mendapat kira-kira separuh."},"tips":["Tukar nasi putih kepada beras perang pada makan tengah hari atau malam","Tambah satu hidangan sayur, buah atau kekacang pada setiap hidangan","Untuk snek, pilih biskut gandum penuh, buah, kekacang atau bubur kacang hijau"],"task":"Hari ini tambah satu hidangan sayur hijau pada setiap hidangan, dan minum dua gelas air lagi.","share":"Adakah anda kenal sesiapa yang selalu sembelit dan jarang makan sayur?","philo":"25 g serat sehari juga sebahagian daripada nutrisi seimbang:"},{"t":"Hidup sihat dan peringkat penurunan berat badan","en":"Healthy Active Lifestyle","tag":"Pelan peningkatan","lead":"Fahami peringkat-peringkat penurunan berat badan supaya tidak panik apabila sampai ke fasa mendatar.","intro":"Penurunan berat badan bukan garis lurus ke bawah. Fahami apa yang berlaku pada setiap peringkat supaya tidak berputus asa apabila berat terhenti, dan terus menyesuaikan diri.","points":[{"h":"Kenali dahulu peratus lemak badan","p":"Peratus lemak badan ialah peratusan lemak daripada berat badan; ia lebih menggambarkan bentuk badan dan tahap kesihatan berbanding berat badan.","list":["Dengan berat yang sama, semakin rendah peratus lemak badan, semakin tegap badan","Piawaian lelaki dan wanita berbeza; wanita memang memerlukan lebih sedikit lemak","Setiap peringkat di bawah dinilai berdasarkan peratus lemak badan"],"viz":[{"type":"table","title":"Rujukan peratus lemak badan","head":["Kategori","Wanita","Lelaki"],"rows":[["Atlet","14–20%","6–13%"],["Sihat","21–24%","14–17%"],["Biasa","25–31%","18–24%"],["Obes","Melebihi 32%","Melebihi 25%"]],"best":1,"note":"Berdasarkan klasifikasi umum peratus lemak badan; angka ialah julat anggaran. Minta jurulatih mengukur untuk mengetahui julat anda."}]},{"h":"Di mana lemak anda tersimpan?","p":"Setiap orang menyimpan lemak di tempat yang berbeza:","list":["Perut (bentuk epal): lemak tertumpu di pinggang dan perut, lebih biasa pada lelaki","Pinggul dan peha (bentuk pir): lebih biasa pada wanita","Seluruh badan: lemak tersebar sekata di seluruh badan"],"after":"Lemak perut paling perlu diberi perhatian. Kebanyakan lemak di pinggang ialah \"lemak viseral\" yang membalut organ dalaman, paling berkait rapat dengan penyakit jantung, diabetes dan hati berlemak. Jadi selain berat badan, ukur juga lilitan pinggang secara berkala.","viz":[{"type":"chips","title":"Rujukan lilitan pinggang (orang Asia)","items":[["Lelaki","Lilitan pinggang bawah 90 cm"],["Wanita","Lilitan pinggang bawah 80 cm"]]}]},{"h":"Peringkat 1: dari gemuk ke sederhana","p":"Kriteria: peratus lemak badan lelaki melebihi 25%, wanita melebihi 30%. Dari segi pemakanan, makan kurang daripada dahulu, hentikan snek dan makan lewat malam, jauhi makanan bergoreng dan tinggi gula."},{"h":"Peringkat 2: dari sederhana ke kurus","p":"Kriteria: peratus lemak badan lelaki 20–25%, wanita 25–30%. Pada peringkat ini, ikut pelan makan jurulatih dengan bersungguh-sungguh."},{"h":"Peringkat 3: fasa mendatar","p":"Badan \"menyesuaikan diri\" dengan penurunan berat, metabolisme menurun, dan berat badan berhenti turun buat sementara. Ini normal, jangan berputus asa.","list":["Pemakanan: lebihkan makanan kaya vitamin B, serat diet dan protein berkualiti","Buah: tukar kepada buah GI rendah seperti epal, kiwi dan limau gedang","Senaman: ubah cara bersenam untuk memecah fasa mendatar"]},{"h":"Peringkat akhir: dari kurus ke sempurna (fasa membentuk)","p":"Tahniah, anda sudah melalui peringkat paling sukar!","list":["Pemakanan: hidangan kurang lemak, pastikan protein mencukupi untuk membantu pembinaan otot","Senaman: aerobik setiap hari, latihan kekuatan sekurang-kurangnya 3 kali seminggu","Fokus pada bahagian yang masih belum memuaskan","Ingat untuk regangan selepas bersenam"]},{"h":"Kebaikan hidup sihat dan aktif","p":"Makan teratur, tidur cukup dan aktif setiap hari bukan sahaja membantu bentuk badan, malah melegakan tekanan, meningkatkan produktiviti dan keyakinan diri, serta menjadikan emosi dan kehidupan lebih baik."}],"viz":[{"type":"timeline","title":"4 peringkat penurunan berat badan","items":[["Gemuk ke sederhana","Lelaki > 25% · Wanita > 30%","Kurangkan snek dan makan malam lewat, jauhi makanan bergoreng dan tinggi gula"],["Sederhana ke kurus","Lelaki 20–25% · Wanita 25–30%","Ikut pelan makan dengan bersungguh-sungguh"],["Fasa mendatar","Berat badan terhenti","Ubah pemakanan dan cara bersenam untuk memecahkannya"],["Kurus ke sempurna","Fasa membentuk","Tinggi protein + aerobik + latihan kekuatan 3 kali seminggu"]],"note":"Peratusan ialah kriteria peratus lemak badan, daripada nota kelas."}],"myth":{"m":"Apabila berat badan terhenti, bermakna cara itu sudah tidak berkesan.","f":"Fasa mendatar ialah proses biasa. Teruskan usaha dan buat penyesuaian kecil, badan akan terus menunjukkan kemajuan."},"fact":{"num":"3","unit":" kali/minggu","text":"Dalam fasa membentuk, disyorkan latihan kekuatan sekurang-kurangnya 3 kali seminggu, ditambah senaman aerobik setiap hari."},"tips":["Timbang berat badan pada hari dan masa yang sama setiap minggu","Catat juga lilitan pinggang dan lemak badan","Ambil gambar seluruh badan dan bandingkan selepas sebulan"],"task":"Tetapkan matlamat peringkat seterusnya (berat badan, lilitan pinggang atau lemak badan) bersama jurulatih, dan tuliskan.","share":"Adakah anda kenal sesiapa yang berputus asa apabila penurunan berat badan sampai ke fasa mendatar?","philo":"Walau di peringkat mana pun, makan mengikut carta ini:"},{"t":"Kenapa kami yakin","en":"What Makes Us Confident","tag":"Keyakinan","lead":"Yakin dengan produk, syarikat, dan perubahan diri sendiri.","intro":"Sampai Hari 19, anda sudah mempunyai pengetahuan nutrisi yang kukuh. Hari ini kita bercakap tentang keyakinan: terhadap produk, syarikat, dan paling penting, diri anda sendiri.","points":[{"h":"Keyakinan terhadap produk","p":"Berdasarkan data 2024 daripada firma kajian pasaran antarabangsa Euromonitor, Herbalife meraih tiga kedudukan No.1 dunia:","imgFull":true,"img":[{"f":"no1_three","cap":"Tiga No.1 dunia (sumber: Euromonitor, edisi 2025, data jualan runcit 2024)"}],"list":["Jenama pengurusan berat badan dan kesihatan No.1 dunia","Shake protein No.1 dunia","Jenama nutrisi gaya hidup aktif No.1 dunia"],"after":"Ditambah dengan bahan, ujian kualiti, serta perubahan sebenar pada diri anda dan orang di sekeliling, itulah keyakinan kami terhadap produk."},{"h":"Keyakinan terhadap syarikat","p":"Herbalife diasaskan pada tahun 1980 di Los Angeles, Amerika Syarikat, kini beroperasi di lebih 90 negara dan wilayah, dan disenaraikan di Bursa Saham New York."},{"h":"Pensijilan pihak ketiga antarabangsa","p":"Produk Herbalife diiktiraf oleh beberapa badan pihak ketiga antarabangsa, termasuk:","list":["Pensijilan GI Rendah (Low GI)","NSF Certified for Sport: bebas bahan terlarang untuk atlet","Pensijilan Halal","Pengesahan Bukan GMO (Non-GMO)","Pensijilan vegetarian, bebas gluten, organik AS dan lain-lain"],"imgFull":true,"img":[{"f":"sci_cert","cap":"Pensijilan antarabangsa produk Herbalife"}]},{"h":"187 anugerah kecemerlangan di Asia Pasifik","p":"Dari 2015 hingga 2024, Herbalife memenangi 187 anugerah kecemerlangan di Asia Pasifik, termasuk:","list":["Korea: Anugerah Jenama Paling Dipercayai 13 tahun berturut-turut (kategori makanan kesihatan berfungsi)","Taiwan: Tanda Kualiti Kebangsaan 13 tahun berturut-turut","Vietnam: Anugerah Produk Emas Kesihatan Awam 9 tahun berturut-turut","Thailand: Logo \"Pilihan Lebih Sihat\" Institut Nutrisi Universiti Mahidol 7 tahun berturut-turut","Malaysia: Anugerah Jenama Kesihatan dan Kesejahteraan 2019"],"imgFull":true,"img":[{"f":"sci_187","cap":"187 anugerah kecemerlangan di Asia Pasifik, 2015–2024"},{"f":"sci_award1","cap":"Anugerah kualiti produk Asia Pasifik (Korea)"},{"f":"sci_award2","cap":"Anugerah kualiti produk Asia Pasifik (Vietnam, Taiwan, Thailand, Hong Kong, Malaysia)"}]},{"h":"Atlet juga menggunakannya","p":"Produk nutrisi Herbalife juga digunakan dalam bidang sukan.","list":["Menaja lebih 190 atlet, pasukan dan acara sukan","Atlet menggunakannya untuk membantu mengekalkan tenaga semasa bersukan"]},{"h":"Lebih 40 tahun memberi tumpuan kepada nutrisi","p":"Lebih 40 tahun memberi tumpuan kepada produk dan pendidikan nutrisi, dengan formula dibangunkan oleh pasukan nutrisi dan sains."},{"h":"Keyakinan terhadap sistem","p":"Ada susulan jurulatih, ada kursus, ada sokongan pasukan; anda tidak berseorangan menurunkan berat badan."},{"h":"Keyakinan terhadap diri sendiri","p":"Keyakinan paling penting datang daripada diri anda. Dalam 19 hari ini, anda sudah mula mengubah tabiat makan, minum air dan bersenam."}],"viz":[{"type":"chips","title":"Fakta ringkas Herbalife","items":[["1980","Diasaskan di Los Angeles, AS"],["90+","Negara dan wilayah beroperasi"],["NYSE","Syarikat tersenarai"],["40+ tahun","Fokus dalam bidang nutrisi"],["190+","Atlet, pasukan dan acara yang ditaja"]]}],"myth":{"m":"Mengubah tabiat terlalu sukar, saya tidak mampu.","f":"Anda sudah bertahan selama 19 hari. Setiap perubahan kecil membuktikan anda mampu."},"fact":{"num":"1980","unit":"","text":"Tahun Herbalife diasaskan."},"tips":["Imbas kembali catatan Hari 1","Tulis kemajuan anda dan tampal di tempat yang mudah dilihat","Kongsi perubahan anda dengan jurulatih"],"task":"Tulis satu perubahan paling ketara pada badan atau tabiat anda dalam 19 hari ini, dan kongsikan dengan jurulatih.","share":"Adakah anda kenal sesiapa yang mahu berubah tetapi kurang yakin dengan diri sendiri?"},{"t":"Semangat saling membantu dan kerja berpasukan","en":"Bayanihan Spirit & Teamwork","tag":"Sistem pendidikan","lead":"Berseorangan kita pergi cepat, bersama kita pergi jauh.","intro":"Bahagian paling sukar dalam tabiat sihat bukan bermula, tetapi meneruskannya. Pasukan yang menyokong menjadikannya jauh lebih mudah.","points":[{"h":"Apa itu Bayanihan?","p":"Bayanihan ialah perkataan Filipina yang asalnya bermaksud jiran tetangga bergotong-royong mengangkat rumah, melambangkan semangat saling membantu dan memikul beban bersama."},{"h":"Kekuatan rakan","p":"Dengan rakan untuk melapor diri, bersenam dan berkongsi pelan makan bersama, serta galakan ketika menghadapi kesukaran, peluang untuk terus konsisten lebih tinggi."},{"h":"Apa itu kelab nutrisi?","p":"Kelab nutrisi ialah tempat yang menyeronokkan untuk menikmati sarapan sihat.","list":["Berkongsi maklumat kesihatan, kecergasan dan nutrisi","Berkongsi pengalaman kejayaan","Lokasinya boleh di rumah atau tempat lain"],"after":"Dialu-alukan membawa ahli keluarga dan rakan yang mahu sihat."},{"h":"Sistem pendidikan","p":"Sistem pendidikan kelab nutrisi merangkumi kursus pengetahuan kesihatan, susulan peribadi jurulatih dan aktiviti berpasukan, membantu anda terus belajar dan maju."},{"h":"Kesihatan dan kekayaan","p":"Sistem pendidikan merangkumi aspek kesihatan dan kekayaan. Apabila anda sendiri sudah berubah, anda juga boleh menjadi orang yang membantu orang lain."},{"h":"Daripada dibantu kepada membantu","p":"Jika anda juga mahu membantu orang di sekeliling menjadi sihat, tanya jurulatih tentang program perkongsian."}],"viz":[{"type":"timeline","title":"Sistem sokongan anda","items":[["Jurulatih","Pelan makan peribadi, bimbingan pemakanan, susulan hasil"],["Kursus","Terus belajar ilmu nutrisi"],["Pasukan","Melapor diri, bersenam dan saling memberi semangat"],["Kongsi","Bantu orang di sekeliling menjadi sihat bersama"]]}],"myth":{"m":"Kesihatan urusan sendiri, tidak perlu bantuan orang lain.","f":"Kajian dan pengalaman menunjukkan bahawa mereka yang mempunyai sistem sokongan lebih mudah mengekalkan tabiat sihat."},"fact":{"num":"1+1","unit":"","text":"Cari rakan sihat untuk saling mengingatkan dan memberi semangat."},"tips":["Sertai satu aktiviti kelab nutrisi","Melapor diri dengan rakan sihat setiap hari","Kongsi pelan makan anda dengan rakan"],"task":"Ajak seorang rakan atau ahli keluarga untuk bersarapan sihat bersama anda esok.","share":"Adakah anda kenal sesiapa yang mahu sihat tetapi sukar untuk konsisten berseorangan?"},{"t":"Jadi ahli dan terus maju","en":"Become a Member","tag":"Ahli","lead":"Tahniah kerana menamatkan 21 hari! Ini permulaan tabiat baharu, bukan pengakhiran.","intro":"Dalam 21 hari, anda telah belajar tentang kalori, air, nutrisi sel, sarapan, indeks glisemik, protein, lemak, label, senaman dan banyak lagi. Seterusnya, jadikan ilmu ini tabiat sepanjang hayat.","points":[{"h":"Imbas kembali apa yang diperoleh","p":"Daripada konsep kalori pada Hari 1 hingga peringkat penurunan berat badan pada Hari 18, anda kini mempunyai ilmu pemakanan sihat yang lengkap."},{"h":"Kelebihan ahli","p":"Sebagai ahli, anda boleh:","list":["Membeli semua produk dengan diskaun sekurang-kurangnya 25%","Merujuk ahli baharu menggunakan akaun sendiri","Mengumpul mata untuk kelebihan yang lebih tinggi","Sebagai ahli aktif, mengenali peluang pendapatan runcit dan borong"]},{"h":"Menjadi ahli hanya perlukan 2 perkara","p":"Memohon keahlian sangat mudah:","list":["Hadiri mesyuarat peluang perniagaan Herbalife (NCOM) selama 75–90 minit","Beli pek keahlian (IBP); tanya jurulatih untuk harga terkini"]},{"h":"Bimbingan berterusan","p":"Terus menerima pelan makan peribadi, bimbingan pemakanan dan susulan hasil daripada jurulatih, dengan pelan disesuaikan mengikut kemajuan anda."},{"h":"Pasukan dan aktiviti","p":"Sertai kursus dan aktiviti kelab nutrisi, dan bergerak ke arah matlamat seterusnya bersama pasukan."},{"h":"Matlamat seterusnya","p":"Tetapkan matlamat untuk 3 bulan akan datang, dan capai diri yang lebih sihat langkah demi langkah."}],"viz":[{"type":"chips","title":"Kelebihan ahli","items":[["Diskaun sekurang-kurangnya 25%","Beli semua produk"],["Rujuk ahli baharu","Menggunakan akaun peribadi sendiri"],["Kumpul mata","Capai kelebihan lebih tinggi"],["Peluang pendapatan","Ahli aktif boleh mengenali pendapatan runcit dan borong"]]},{"type":"recap","title":"Dalam 21 hari ini anda telah belajar"}],"myth":{"m":"Selepas 21 hari tamat, boleh kembali kepada cara makan lama.","f":"21 hari hanyalah permulaan sesuatu tabiat. Teruskan, barulah hasilnya kekal lama."},"fact":{"num":"21","unit":" hari","text":"Anda telah menamatkan keseluruhan kursus. Tepuk tangan untuk diri sendiri!"},"tips":["Terus minum air yang cukup setiap hari","Terus ada protein pada setiap hidangan","Bersenam sekurang-kurangnya 150 minit seminggu"],"task":"Tetapkan masa bersama jurulatih untuk mengimbas hasil 21 hari ini, dan tetapkan matlamat untuk 3 bulan akan datang.","share":"Adakah anda kenal sesiapa yang juga mahu memulakan perjalanan kesihatan 21 hari ini?","philo":"Semua yang dipelajari dalam 21 hari ada dalam satu carta ini:"}]};
window.QS_I18N={"en":[{"q":"Do you know what a \"magic number\" is?","opts":["It's the same for everyone — about 2000 kcal a day","Your personal daily calorie target worked out by your coach","A number where the less you eat, the better"],"a":1,"why":"The magic number is yours alone. Your coach will work out your own daily calorie target — everyone's is different."},{"q":"When you feel thirsty, what state is your body in?","opts":["Just right — a reminder that you can drink now","Already mildly dehydrated","Too much water in the body"],"a":1,"why":"Thirst is a signal your body sends only after it's short of water. So drink regularly — don't wait until you're thirsty."},{"q":"Does feeling very full mean your body has enough nutrition?","opts":["Yes, being full is enough","Not necessarily — being full only means enough calories","Just eat lots of meat and that's enough"],"a":1,"why":"Being full and being nourished are two different things. Cells need seven nutrients; only a balanced variety truly feeds them."},{"q":"Which breakfast will best keep you full until lunch?","opts":["A plate of nasi lemak with a sweet coffee","Two slices of white bread with jam","A breakfast with protein and fibre, such as eggs with wholemeal bread or a nutrition shake"],"a":2,"why":"Protein and fibre digest slowly, keeping blood sugar steady and fullness lasting longer. Breakfasts high in oil, sugar and refined starch leave you hungry again soon."},{"q":"White rice or a slice of cake — which raises blood sugar faster?","opts":["The cake, of course","White rice actually has a high GI too","Neither raises blood sugar"],"a":1,"why":"White rice is a high-GI food (92 in the class handout), and fried bee hoon is even higher at 98. Avoiding sweets doesn't mean your blood sugar won't spike."},{"q":"A 60 kg person who wants to maintain weight needs roughly how many grams of protein a day?","opts":["About 10–20 g","About 48–72 g","Over 200 g"],"a":1,"why":"The reference for maintaining weight is 0.8–1.2 g per kg of body weight: 60 kg × 0.8–1.2 ≈ 48–72 g. To lose weight, raise it to 1.2–1.6 g per kg (about 72–96 g); to gain, 1.6–2.2 g per kg (about 96–132 g)."},{"q":"To lose weight, should you cut out oil completely?","opts":["Yes, the less oil the better","No, choose the right kind of fat","Just eat coconut milk and butter"],"a":1,"why":"Your body needs good fats to make hormones and absorb vitamins. What to avoid is trans fat, and cut down on saturated fat."},{"q":"A snack label says \"150 kcal per serving\". Does the whole pack have just 150 kcal?","opts":["Yes","Not necessarily — check how many servings are in the pack","The numbers on labels are all inaccurate"],"a":1,"why":"Many snack packs hold 2–3 servings, so multiply the calories by the number of servings. Check the serving size first, then the numbers."},{"q":"Roughly how many calories does 30 minutes of jogging burn?","opts":["About 250 kcal","About 1000 kcal","About 2000 kcal"],"a":0,"why":"30 minutes of jogging burns about 250 kcal — one cup of milk tea puts it right back. So don't reward yourself with a feast after exercise."},{"q":"At the same 2000 kcal, does a day of balanced meals affect your body the same as a few burgers and fries?","opts":["Yes, the same calories is all that matters","No, the nutrition is completely different","Burgers are more nutritious"],"a":1,"why":"Calories can be the same while nutrition differs hugely. Nutrient-rich foods keep you fuller and healthier; calorie-dense foods are low in nutrients and leave you hungry again soon."},{"q":"What's the most common reason for strong night-time cravings?","opts":["Being born with weak willpower","Not enough protein and water during the day, or eating too late","Digestion is better at night"],"a":1,"why":"Night-time cravings often mean you didn't eat or drink enough during the day. Get your daytime meals and snacks right, and you'll crave less at night."},{"q":"What should you look at most when choosing nutrition products?","opts":["The cheaper the better","The one with the most amazing ads","R&D team, ingredient label and quality testing"],"a":2,"why":"A reliable product is developed by a science team, has transparent ingredients, and is quality-tested from raw materials to finished product."},{"q":"Are \"natural\" ingredients always safe?","opts":["Yes, natural means safe","Not necessarily — they still need testing","Natural is actually worse"],"a":1,"why":"Natural ingredients can also be contaminated or vary in quality. Testing from source to finished product gives more peace of mind."},{"q":"If you take a vitamin supplement every day, can you skip vegetables?","opts":["Yes, supplements are more convenient","No — supplements support your diet, they can't replace food","Vegetables don't have much nutrition"],"a":1,"why":"Vegetables and fruit have fibre and many nutrients supplements don't. Eat a balanced diet first, and use supplements to fill the gaps."},{"q":"Hair that's dry and breaks easily may be linked to a lack of what in your diet?","opts":["Protein","Sugar","Salt"],"a":0,"why":"Hair and nails are mainly made of protein. Without enough protein, hair becomes dry and breaks easily. B vitamins and zinc matter too."},{"q":"What's an easy way to tell if you're drinking enough water?","opts":["Check your urine colour","Check whether you sweat","Check your weight"],"a":0,"why":"Urine close to pale yellow means you're roughly well hydrated; the darker it is, the more you need to drink."},{"q":"How much dietary fibre should adults eat each day?","opts":["About 5 g","25–30 g","Over 100 g"],"a":1,"why":"25–30 g a day is recommended, but many people get only about half. Eat more vegetables, fruit, whole grains and beans."},{"q":"If your weight hasn't dropped for two weeks while losing weight, what does it mean?","opts":["The method doesn't work — give up","You may have reached a plateau — this is normal","Stop eating rice immediately"],"a":1,"why":"A plateau is a normal stage of weight loss. Review your diet, step up exercise and talk to your coach about adjustments, and you'll keep moving forward."},{"q":"Over these 19 days, what do you feel is your biggest change?","opts":["Eating habits","Water-drinking habits","Exercise habits"],"a":-1,"why":"Whichever you chose, it's progress to be proud of. The most important confidence comes from your own change."},{"q":"Losing weight alone or with a group — which is easier to stick with?","opts":["Alone gives more freedom","A group encouraging each other","No difference"],"a":1,"why":"With peers to check in and exercise with, and encouragement when things get hard, you're more likely to keep going."},{"q":"After the 21-day course, what matters most next?","opts":["Go back to old eating habits","Turn what you've learned into a long-term lifestyle","Find a new weight-loss method right away"],"a":1,"why":"21 days is just the beginning. Keep up your healthy habits and the results will last."}],"ms":[{"q":"Adakah anda tahu apa itu \"nombor ajaib\"?","opts":["Semua orang sama, kira-kira 2000 kcal sehari","Sasaran kalori harian peribadi yang dikira oleh jurulatih untuk anda","Nombor di mana semakin sedikit makan semakin baik"],"a":1,"why":"Nombor ajaib ialah nombor anda sendiri. Jurulatih akan mengira sasaran kalori harian khas untuk anda; setiap orang berbeza."},{"q":"Apabila terasa dahaga, badan berada dalam keadaan apa?","opts":["Air badan cukup, sekadar peringatan boleh minum","Sudah sedikit kekurangan air","Terlalu banyak air dalam badan"],"a":1,"why":"Dahaga ialah isyarat yang dihantar badan selepas kekurangan air. Jadi minum air secara berkala, jangan tunggu dahaga."},{"q":"Adakah makan sampai kenyang bermakna nutrisi badan sudah cukup?","opts":["Ya, kenyang sudah cukup","Belum tentu, kenyang hanya bermakna kalori cukup","Asalkan makan banyak daging sudah cukup"],"a":1,"why":"Kenyang dan mendapat nutrisi ialah dua perkara berbeza. Sel memerlukan tujuh nutrien utama; hanya kepelbagaian yang seimbang benar-benar memberi makan kepada sel."},{"q":"Sarapan yang mana paling dapat membuatkan anda tidak lapar hingga tengah hari?","opts":["Sepinggan nasi lemak dengan secawan kopi manis","Dua keping roti putih dengan jem","Sarapan yang ada protein dan serat, contohnya telur dengan roti gandum penuh atau shake nutrisi"],"a":2,"why":"Protein dan serat lambat dicerna, menstabilkan gula darah dan rasa kenyang lebih lama. Sarapan yang tinggi minyak, gula dan kanji halus cepat membuatkan lapar semula."},{"q":"Nasi putih atau sepotong kek, yang mana menaikkan gula darah lebih cepat?","opts":["Sudah tentu kek","Nasi putih sebenarnya juga mempunyai GI yang tinggi","Kedua-duanya tidak menaikkan gula darah"],"a":1,"why":"Nasi putih ialah makanan GI tinggi (nota kelas menyenaraikan 92), bihun goreng lebih tinggi lagi iaitu 98. Tidak makan manis tidak bermakna gula darah tidak akan melonjak."},{"q":"Seseorang 60 kg yang mahu kekalkan berat badan memerlukan kira-kira berapa gram protein sehari?","opts":["Kira-kira 10–20 g","Kira-kira 48–72 g","Lebih 200 g"],"a":1,"why":"Rujukan untuk kekalkan berat badan ialah 0.8–1.2 g setiap kg berat badan: 60 kg × 0.8–1.2 ≈ 48–72 g. Untuk turun berat, tingkatkan kepada 1.2–1.6 g setiap kg (kira-kira 72–96 g); untuk naik berat, 1.6–2.2 g setiap kg (kira-kira 96–132 g)."},{"q":"Untuk turun berat badan, patutkah langsung tidak makan minyak?","opts":["Ya, semakin kurang minyak semakin baik","Tidak, pilih jenis lemak yang betul","Makan santan dan mentega sahaja"],"a":1,"why":"Badan memerlukan lemak baik untuk menghasilkan hormon dan menyerap vitamin. Yang perlu dielakkan ialah lemak trans, dan kurangkan lemak tepu."},{"q":"Label nutrisi sebungkus snek tertulis \"150 kcal setiap hidangan\". Adakah sebungkus itu hanya 150 kcal?","opts":["Ya","Belum tentu, lihat berapa hidangan dalam sebungkus","Angka pada label semuanya tidak tepat"],"a":1,"why":"Banyak snek mengandungi 2–3 hidangan sebungkus, kalori perlu didarab dengan bilangan hidangan. Lihat saiz hidangan dahulu, kemudian angkanya."},{"q":"Joging 30 minit membakar kira-kira berapa kalori?","opts":["Kira-kira 250 kcal","Kira-kira 1000 kcal","Kira-kira 2000 kcal"],"a":0,"why":"Joging 30 minit membakar kira-kira 250 kcal, secawan teh susu sudah menggantikannya. Jadi jangan beri ganjaran kepada diri dengan makan besar selepas bersenam."},{"q":"Dengan 2000 kcal yang sama, adakah sehari hidangan seimbang dan beberapa burger dengan kentang goreng memberi kesan yang sama kepada badan?","opts":["Sama, asalkan kalori sama","Tidak sama, nutrisinya sangat berbeza","Burger lebih berkhasiat"],"a":1,"why":"Kalori sama, nutrisi boleh jauh berbeza. Makanan kaya nutrisi membuatkan anda lebih kenyang dan sihat; makanan padat kalori rendah nutrisi dan cepat lapar semula."},{"q":"Apa punca paling biasa terlalu teringin makan pada waktu malam?","opts":["Memang kurang daya tahan diri sejak lahir","Protein dan air tidak cukup pada siang hari, atau makan terlalu lewat","Perut lebih baik pada waktu malam"],"a":1,"why":"Teringin makan pada waktu malam selalunya kerana tidak cukup makan dan minum pada siang hari. Makan tiga hidangan dan snek siang hari dengan betul, malam nanti kurang teringin."},{"q":"Apa yang paling perlu dilihat ketika memilih produk nutrisi?","opts":["Semakin murah semakin baik","Yang iklannya paling hebat","Pasukan penyelidikan, label bahan dan ujian kualiti"],"a":2,"why":"Produk yang boleh dipercayai dibangunkan oleh pasukan sains, bahannya telus, dan melalui ujian kualiti daripada bahan mentah hingga produk siap."},{"q":"Adakah bahan \"semula jadi\" pasti selamat?","opts":["Ya, semula jadi bermakna selamat","Belum tentu, masih perlu diuji","Semula jadi sebenarnya tidak baik"],"a":1,"why":"Bahan semula jadi juga boleh tercemar atau kualitinya tidak stabil. Diuji dari punca hingga produk siap barulah lebih yakin."},{"q":"Jika makan suplemen vitamin setiap hari, bolehkah tidak makan sayur?","opts":["Boleh, suplemen lebih mudah","Tidak boleh, suplemen hanya membantu, tidak boleh menggantikan makanan","Sayur tidak banyak nutrisi"],"a":1,"why":"Sayur dan buah mengandungi serat dan banyak nutrien yang tiada dalam suplemen. Makan seimbang dahulu, gunakan suplemen untuk mengisi kekurangan."},{"q":"Rambut yang mudah kering dan patah mungkin berkait dengan kekurangan apa dalam pemakanan?","opts":["Protein","Gula","Garam"],"a":0,"why":"Rambut dan kuku kebanyakannya terdiri daripada protein. Jika kurang protein, rambut mudah kering dan patah. Vitamin B dan zink juga penting."},{"q":"Apakah cara mudah menilai sama ada anda cukup minum air?","opts":["Lihat warna air kencing","Lihat sama ada berpeluh","Lihat berat badan"],"a":0,"why":"Air kencing hampir kuning pucat bermakna badan cukup air; semakin gelap warnanya, semakin perlu minum air."},{"q":"Berapa banyak serat diet disyorkan untuk orang dewasa setiap hari?","opts":["Kira-kira 5 g","25–30 g","Lebih 100 g"],"a":1,"why":"Disyorkan 25–30 g sehari, tetapi ramai orang hanya mendapat kira-kira separuh. Lebihkan sayur, buah, bijirin penuh dan kekacang."},{"q":"Jika berat badan tidak turun selama dua minggu berturut-turut semasa menurunkan berat, apa maksudnya?","opts":["Cara ini tidak berkesan, patut berputus asa","Mungkin sampai ke fasa mendatar, ini normal","Patut terus berhenti makan nasi"],"a":1,"why":"Fasa mendatar ialah peringkat normal dalam penurunan berat badan. Semak pemakanan, tingkatkan senaman dan berbincang dengan jurulatih untuk penyesuaian, dan anda akan terus maju."},{"q":"Dalam 19 hari ini, apakah perubahan terbesar yang anda rasa?","opts":["Tabiat makan","Tabiat minum air","Tabiat bersenam"],"a":-1,"why":"Apa pun pilihan anda, ia kemajuan yang patut dibanggakan. Keyakinan paling penting datang daripada perubahan diri anda sendiri."},{"q":"Turun berat badan berseorangan atau bersama kumpulan, yang mana lebih mudah untuk konsisten?","opts":["Berseorangan lebih bebas","Kumpulan yang saling memberi semangat","Tiada perbezaan"],"a":1,"why":"Dengan rakan untuk melapor diri dan bersenam bersama, serta galakan ketika menghadapi kesukaran, peluang untuk terus konsisten lebih tinggi."},{"q":"Selepas kursus 21 hari tamat, apa yang paling penting seterusnya?","opts":["Kembali kepada tabiat makan lama","Jadikan apa yang dipelajari sebagai gaya hidup jangka panjang","Segera cari cara turun berat badan yang baharu"],"a":1,"why":"21 hari hanyalah permulaan. Teruskan tabiat sihat, barulah hasilnya kekal lama."}]};

    body = '<div class="c2">'+v.rows.map(r=>'<div class="c2-row"><div class="c2-h">'+esc(r.h)+'</div><div class="c2-cols"><div class="c2-a"><small>'+esc(v.a)+'</small>'+r.a.map(x=>'<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join("")+'</div><div class="c2-b"><small>'+esc(v.b)+'</small><div><span>'+esc(r.b[0])+'</span><b>'+esc(r.b[1])+'</b></div></div></div></div>').join("")+'</div>';

    body = '<div class="ct"><div class="ct-tabs" role="tablist">'+v.tabs.map((tb,i)=>'<button type="button" role="tab" class="ct-tab'+(i?'':' on')+'" data-ct="'+i+'" aria-selected="'+(i?'false':'true')+'">'+esc(tb.name)+'</button>').join("")+'</div>'+
      v.tabs.map((tb,i)=>'<div class="ct-panel" data-ctp="'+i+'"'+(i?' hidden':'')+'>'+tb.rows.map(([n,por,k])=>'<div class="ct-row"><div class="ct-name"><span>'+esc(n)+'</span><small>'+esc(por)+'</small></div><div class="ct-bar"><i class="'+tier(k)+'" style="width:'+Math.max(2,Math.min(100,k/700*100))+'%"></i></div><b class="ct-k '+tier(k)+'">'+k+'</b></div>').join("")+
      '<div class="ct-note">'+esc(tb.note)+'</div></div>').join("")+

  return '<div class="viz"><div class="viz-title">'+esc(v.title)+'</div>'+body+(v.note?'<div class="viz-note">'+esc(v.note)+'</div>':'')+'</div>';
}

function renderHeader(){
  const count = Object.keys(done).filter(k=>done[k]).length;
  document.getElementById("progNum").innerHTML = count + "<small>"+T(" / 21 天")+"</small>";
  const bar = document.getElementById("bar"); bar.innerHTML = "";
  for(let n=1;n<=21;n++){ const i = document.createElement("i"); if(done[n]) i.className="on"; bar.appendChild(i); }
  const st = document.getElementById("status"), nd = nextDay();
  if(nd===null) st.innerHTML = T("恭喜你完成全部 21 天课程！所有内容可以随时回看。");
  else if(isUnlocked(nd)) st.innerHTML = T("今天可以阅读：")+"<b>"+DN(nd)+"</b> · "+esc(DAYS[nd-1].t);
  else st.innerHTML = T("今天的已经读完了。{0} 将在 {1} 后解锁", DN(nd), "<b class=\"cd\">"+fmt(msToMidnight())+"</b>");
}

function renderCal(){
  const cal = document.getElementById("cal"); cal.innerHTML = "";
  const names = ["第一周 · 营养基础","第二周 · 吃对与动起来","第三周 · 持续与提升"].map(x=>T(x));
  for(let w=0; w<3; w++){
    const lab = document.createElement("div"); lab.className="week-label";
    lab.innerHTML = "<span>"+names[w]+"</span><span>"+T("Day")+" "+(w*7+1)+"–"+(w*7+7)+"</span>";
    const row = document.createElement("div"); row.className="week";
    for(let k=1;k<=7;k++){
      const n = w*7+k, s = state(n);
      const b = document.createElement("button"); b.type="button"; b.id="day-"+n;
      b.className = "tile "+s + (preview && s==="locked" ? " preview":"") + (selected===n?" sel":"");
      b.innerHTML = '<span class="n">'+n+'</span><span class="s">'+(s==="done"?T("已读"):s==="today"?T("今天"):LOCK)+'</span>';
      b.setAttribute("aria-label",DN(n)+(LANG==="zh"?"，":", ")+T(s==="done"?"已读完":s==="today"?"今天可读":"未解锁"));
      b.addEventListener("click", ()=>{
        selected = (s==="locked" && !preview) ? nextDay() : n;
        renderAll(); document.getElementById("lesson").scrollIntoView({behavior:"smooth",block:"start"});
      });
      row.appendChild(b);
    }
    cal.appendChild(lab); cal.appendChild(row);
  }
}

/* ---------- 听讲解 (speech synthesis) ---------- */
const TTS = { on:false, queue:[], idx:0, voice:null, rate:1 };
function ttsVoice(){
  if(!("speechSynthesis" in window)) return null;
  const vs = speechSynthesis.getVoices();
  const pick = l => vs.find(v=>v.lang && v.lang.replace("_","-").toLowerCase().startsWith(l));
  if(LANG==="en") return pick("en-gb") || pick("en-us") || pick("en-au") || pick("en") || null;
  if(LANG==="ms") return pick("ms-my") || pick("ms") || pick("id-id") || pick("id") || null;
  return pick("zh-cn") || pick("cmn") || pick("zh-sg") || pick("zh-tw") || pick("zh-hk") || pick("zh") || null;
}
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = ()=>{ TTS.voice = ttsVoice(); }; TTS.voice = ttsVoice(); }
function ttsClean(s){
  if(LANG!=="zh"){ const en = LANG==="en";
    return String(s||"").replace(/≈/g, en?" about ":" kira-kira ").replace(/(\d)\s*[–-]\s*(\d)/g, en?"$1 to $2":"$1 hingga $2").replace(/kcal/gi, en?"calories":"kalori").replace(/g\/kg/gi, en?"grams per kilo":"gram sekilogram")
      .replace(/(\d)\s*g\b/g, en?"$1 grams":"$1 gram").replace(/(\d)\s*ml\b/gi, en?"$1 millilitres":"$1 mililiter").replace(/→/g,", ").replace(/\+/g, en?" plus ":" tambah ").replace(/×/g, en?" times ":" darab ").replace(/[“”"()·•]/g," ").replace(/\s+/g," ").trim(); }
  return String(s||"").replace(/≈/g,"约等于").replace(/(\d)\s*[–-]\s*(\d)/g,"$1到$2").replace(/kcal/gi,"卡路里").replace(/g\/kg/gi,"克每公斤")
    .replace(/(\d)\s*g\b/g,"$1克").replace(/→|＋|\+/g,"，").replace(/[「」“”《》（）()·•]/g," ").replace(/\s+/g," ").trim();
}
function ttsSplit(s){ const out=[]; String(s).split(/(?<=[。！？；!?;]|\.\s)/).forEach(x=>{ x=x.trim(); while(x.length>(LANG==="zh"?140:220)){ let k = LANG==="zh"?140:x.lastIndexOf(" ",220); if(k<60) k=220; out.push(x.slice(0,k)); x=x.slice(k).trim(); } if(x) out.push(x); }); return out; }
function ttsScript(n){
  const d = DAYS[n-1], q = QS[n-1], parts = [];
  const add = (text, pi) => ttsSplit(ttsClean(text)).forEach(s=>parts.push({s, pi}));
  const zh = LANG==="zh", P = zh?"。":". ", end = x => /[。！？.!?:：]$/.test(String(x).trim()) ? x : x+P;
  add(DN(n).replace(/ /g, zh?"":" ")+(zh?"，":". ")+end(d.t)); if(d.lead) add(d.lead); if(d.intro) add(d.intro);
  if(q && q.q) add(T("先想一想：")+q.q+T(" 想好了，可以在页面上选出你的答案。"));
  if(d.points){ add(end(T("今天要知道的 {0} 件事", d.points.length).replace(/ /g, zh?"":" "))); d.points.forEach((p,i)=>{ add(T("第{0}点，", i+1)+end(p.h), i); add(p.p, i); (p.list||[]).forEach(x=>add(end(x), i)); if(p.after) add(p.after, i); }); }
  if(d.fact) add(T("关键数字：")+d.fact.num+(d.fact.unit||"")+P+d.fact.text);
  if(d.myth) add(T("常见误区：")+d.myth.m+T(" 真相是：")+d.myth.f);
  if(d.tips && d.tips.length) add(T("实用小技巧：")+d.tips.join(zh?"；":"; ")+P);
  if(d.share) add(T("想一想：")+d.share);
  if(d.task) add(T("今日小任务：")+d.task);
  add(T("今天的讲解到这里，记得完成今日小任务。"));
  return parts;
}
function ttsMark(pi){ document.querySelectorAll(".points>li.reading").forEach(x=>x.classList.remove("reading")); if(pi!==undefined){ const li = document.querySelector('.points>li[data-pi="'+pi+'"]'); if(li) li.classList.add("reading"); } }
function ttsUI(){ const a=document.getElementById("ttsPlay"), b=document.getElementById("ttsStop"); if(!a) return; a.textContent = TTS.on ? (speechSynthesis.paused ? T("▶ 继续") : T("❚❚ 暂停")) : T("▶ 听讲解"); b.hidden = !TTS.on; }
function ttsStop(){ TTS.on = false; TTS.queue = []; try{ speechSynthesis.cancel(); }catch(e){} ttsMark(); ttsUI(); }
function ttsNext(){
  if(!TTS.on) return;
  if(TTS.idx >= TTS.queue.length){ ttsStop(); const m=document.getElementById("ttsMsg"); if(m) m.textContent = T("讲解完毕"); return; }
  const c = TTS.queue[TTS.idx++]; ttsMark(c.pi);
  const u = new SpeechSynthesisUtterance(c.s); u.lang = (TTS.voice && TTS.voice.lang) || ({zh:"zh-CN",en:"en-GB",ms:"ms-MY"})[LANG]; if(TTS.voice) u.voice = TTS.voice; u.rate = TTS.rate;
  u.onend = ()=>ttsNext(); u.onerror = e=>{ if(e.error!=="interrupted" && e.error!=="canceled") ttsNext(); };
  speechSynthesis.speak(u);
}
function ttsBind(n){
  const a=document.getElementById("ttsPlay"); if(!a) return;
  const m=document.getElementById("ttsMsg"), r=document.getElementById("ttsRate");
  if(!("speechSynthesis" in window)){ a.disabled = true; m.textContent = T("这个浏览器不支持朗读"); return; }
  r.value = String(TTS.rate); r.onchange = ()=>{ TTS.rate = parseFloat(r.value); if(TTS.on){ TTS.idx = Math.max(0,TTS.idx-1); speechSynthesis.cancel(); setTimeout(ttsNext,60); } };
  a.onclick = ()=>{
    if(!TTS.on){ TTS.voice = ttsVoice(); m.textContent = TTS.voice ? "" : T("找不到中文语音，可能会用其他语言的声音朗读");
      TTS.on = true; TTS.queue = ttsScript(n); TTS.idx = 0; speechSynthesis.cancel(); ttsNext(); }
    else if(speechSynthesis.paused){ speechSynthesis.resume(); }
    else { speechSynthesis.pause(); }
    setTimeout(ttsUI,50);
  };
  document.getElementById("ttsStop").onclick = ttsStop;
  ttsUI();
}
function renderLesson(){
  ttsStop();
  const el = document.getElementById("lesson"), nd = nextDay();
  if(selected===null) selected = nd===null ? 21 : nd;
  const n = selected, s = state(n);
  if(s==="locked" && !preview){
    el.className = "lesson locked-card";
    el.innerHTML = done[n-1]
      ? '<div class="eyebrow">'+T('下一则资讯')+'</div><h2>'+T('{0} · 明天见', DN(n))+'</h2><p class="lead">'+T('今天的内容已经读完了，给身体一点时间消化。')+'</p><p>'+T('{0} 将在', DN(n))+'</p><div class="clock cd">'+fmt(msToMidnight())+'</div><p class="note">'+T('后解锁（明天 00:00）')+'</p><p class="peek">'+T('明天的主题：')+'<b>'+esc(DAYS[n-1].t)+'</b><br>'+T('完成的内容可以随时点上面的绿色格子回看。')+'</p>'+videoHTML(n-1)
      : '<div class="eyebrow">'+T('尚未解锁')+'</div><h2>'+DN(n)+'</h2><p class="lead">'+T('请先读完前一天的内容。')+'</p>';
    return;
  }
  el.className = "lesson";
  el.innerHTML = lessonHTML(n);
  ttsBind(n);
  const fb = document.getElementById("finishBtn");
  if(fb) fb.addEventListener("click", ()=>{
    done[n] = today(); saveLocal(); saveRemote();
    const nx = nextDay(); selected = nx===null ? n : nx; renderAll();
    document.getElementById("lesson").scrollIntoView({behavior:"smooth",block:"start"});
  });
  el.querySelectorAll("[data-opt]").forEach(b=>b.addEventListener("click", ()=>{
    answered[n] = +b.dataset.opt;
    const hook = el.querySelector(".hook"); const tmp = document.createElement("div"); tmp.innerHTML = hookHTML(n);
    hook.replaceWith(tmp.firstChild); bindOpts(); }));
  function bindOpts(){ el.querySelectorAll("[data-opt]:not([disabled])").forEach(b=>b.addEventListener("click", ()=>{ answered[n] = +b.dataset.opt; renderLesson(); })); }
  const wt = document.getElementById("wt"), goal = document.getElementById("goal");
  const calc = ()=>{
    const w = parseFloat(wt.value) || (wt.dataset.k==="protein" ? 60 : NaN);
    const ok = w>=25 && w<=250, water = wt.dataset.k==="water";
    document.getElementById("wtOut").textContent = water ? (ok ? T("{0}–{1} 公升（约 {2}–{3} 杯）",(w*0.04).toFixed(1),(w*0.05).toFixed(1),Math.round(w*0.04/0.4),Math.round(w*0.05/0.4)) : T("{0}–{1} 公升（约 {2}–{3} 杯）","2.4","3.0",6,8)) : (()=>{ const [a,b]=(goal?goal.value:"0.8,1.2").split(",").map(Number); return ok ? Math.round(w*a)+"–"+Math.round(w*b) : "—"; })();
  };
  if(wt) wt.addEventListener("input", calc);
  if(goal) goal.addEventListener("change", calc);
  el.querySelectorAll("[data-ct]").forEach(b=>b.addEventListener("click", ()=>{
    const box = b.closest(".ct"), i = b.dataset.ct;
    box.querySelectorAll("[data-ct]").forEach(x=>{ const on = x.dataset.ct===i; x.classList.toggle("on",on); x.setAttribute("aria-selected",on?"true":"false"); });
    box.querySelectorAll("[data-ctp]").forEach(pn=>{ pn.hidden = pn.dataset.ctp!==i; });
  }));
  el.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click", ()=>{
    document.getElementById("lbImg").src = b.dataset.zoom;
    document.getElementById("lbImg").alt = b.getAttribute("aria-label");
    document.getElementById("lb").hidden = false;
  }));
}
function renderAll(){ renderHeader(); renderCal(); renderLesson(); }

const lb = document.getElementById("lb");
document.getElementById("lbClose").addEventListener("click", ()=>{ lb.hidden = true; });
lb.addEventListener("click", e=>{ if(e.target===lb) lb.hidden = true; });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") lb.hidden = true; });

function showReset(){
  const box = document.getElementById("resetBox");
  box.innerHTML = '<button class="linkbtn" id="resetBtn" type="button">'+T('重新开始 21 天')+'</button>';
  document.getElementById("resetBtn").onclick = ()=>{
    box.innerHTML = '<div class="confirm"><span>'+T('确定清除进度，从第 1 天重新开始？')+'</span><button class="linkbtn" id="yesReset" type="button">'+T('确定清除')+'</button><button class="linkbtn" id="noReset" type="button">'+T('取消')+'</button></div>';
    document.getElementById("yesReset").onclick = ()=>{ done = {}; selected = 1; saveLocal(); saveRemote(); renderAll(); showReset(); };
    document.getElementById("noReset").onclick = showReset;
  };
}
showReset();

document.getElementById("previewAll").addEventListener("change", e=>{ preview = e.target.checked; renderAll(); });

let lastDay = today();
setInterval(()=>{
  if(today()!==lastDay){ lastDay = today(); selected = null; renderAll(); return; }
  document.querySelectorAll(".cd").forEach(x=> x.textContent = fmt(msToMidnight()));
}, 1000);

window.onLangChange = ()=>{ loadContent(); renderAll(); showReset(); };
document.getElementById("langTop").innerHTML = langSwitchHTML();
applyStatic();
done = ADMIN ? {} : loadLocal();
if(ADMIN){ const ob=document.getElementById("ownerBox"); ob.hidden=false; ob.innerHTML='<span data-t="管理员预览：21 天全部打开，进度不会被记录。">'+T('管理员预览：21 天全部打开，进度不会被记录。')+'</span>'; document.getElementById("resetBox").hidden=true; }
renderAll();

(async ()=>{
  try{
    if(!window.claude || !window.claude.use) return;
    const user = await window.claude.use("user");
    if(user){ try{ isOwner = await user.isOwner(); }catch(e){} if(isOwner) document.getElementById("ownerBox").hidden = false; }
    const db = await window.claude.use("db");
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    dbRef = db.doc("data/users/"+id+"/progress");
    const snap = await dbRef.get();
    const remote = snap.exists ? ((snap.data()||{}).done || {}) : {};
    const merged = merge(done, remote);
    const changed = JSON.stringify(merged)!==JSON.stringify(done);
    const remoteBehind = JSON.stringify(merged)!==JSON.stringify(remote);
    done = merged; saveLocal();
    if(remoteBehind) saveRemote();
    if(changed){ selected = null; renderAll(); }
  }catch(e){}
})();
</script>
