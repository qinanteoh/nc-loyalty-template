holidays still included"]},"right":{"h":"Typical eating every day","cls":"bad","items":["7 days about 21,000 kcal","About 3,000 kcal a day on average","About 7,800 kcal extra ≈ 1 kg of fat"]}}]},{"h":"You can still eat","p":"It's not about never eating the foods you love again — it's about knowing the difference and making better choices most of the time."},{"h":"The energy balance equation","p":"Eat fewer calories than you burn and weight drops; equal and weight stays; more and weight rises.","viz":[{"type":"balance","title":"Calories in, calories out","rows":[["＜","Weight drops","down"],["＝","Weight stays","same"],["＞","Weight rises","up"]]}]},{"h":"Habits take 21 days to build","p":"Experts suggest a habit takes about 21 days to form.","list":["First 10 days: you've built the foundation","Next 11 days: your coach will update your meal plan","Keep working on your weight-loss or weight-gain goal"]}],"viz":[],"myth":{"m":"Indulging now and then is fine — it doesn't happen often anyway.","f":"If \"now and then\" happens two or three times a week, it adds up to a lot of calories. Plan ahead so you can enjoy without losing control."},"fact":{"num":"80/20","unit":"","text":"Eating healthily 80% of the time and relaxing 20% of the time makes it easier to stick with long term."},"tips":["Eat a little protein before a gathering to line your stomach","At a buffet, take a plate of vegetables first","Choose plain water or unsweetened tea to drink"],"task":"Pick the two breakfasts you eat most often and compare their calories, protein and sugar with your coach.","share":"Do you know anyone who'd also be interested in the health info from these 10 days?"},{"t":"Nutrition club and hunger control","en":"Nutrition Club · Hunger Control","tag":"Nutrition plan","lead":"Phase 1 complete! Check your progress and learn how to control hunger.","intro":"You've completed the first 10 days. Today, review your changes, then learn the most important skill of phase 2: controlling hunger.","points":[{"h":"What is a nutrition club?","p":"A nutrition club is a place to learn about nutrition and build healthy habits together.","list":["Your coach provides a personalised meal plan","Diet guidance and progress follow-up","Peers encourage each other"]},{"h":"A global nutrition philosophy","p":"Balanced nutrition includes seven nutrients: protein, carbohydrates, fat, vitamins, minerals, fibre and water.","imgFull":true,"img":[{"f":"philosophy","cap":"Herbalife balanced nutrition: 30% protein, 40% carbohydrates, 30% fat, plus Omega-3, less saturated fat, 25 g fibre, enough water and sleep, and moderate exercise"}]},{"h":"Four ways to control hunger","p":"Protein at every meal, more fibre, enough water, and regular meals without skipping. Do these four things and most hunger will ease."},{"h":"What about night-time cravings?","p":"Strong cravings at night often mean you didn't get enough protein and water during the day, or ate lunch too late. First check whether you ate enough during the day."},{"h":"Tell real hunger from cravings","p":"Real hunger builds slowly and you'll eat anything; cravings come suddenly and you only want a specific snack. When a craving hits, drink water and distract yourself for 10 minutes."}],"viz":[{"type":"check","title":"Phase 1 self-check (compared with Day 1)","items":["Has your weight changed?","Has your waist changed?","Are your energy and stamina better than before?","Has your sleep quality improved?","Are your bowel movements regular?","Have hunger and cravings decreased?"]}],"myth":{"m":"Hunger means weak willpower — just tough it out.","f":"Hunger is a signal from your body. Eat the right foods at regular times and hunger naturally eases — no need to tough it out."},"fact":{"num":"10","unit":" days","text":"You're halfway there. From here, changing habits gets easier."},"tips":["Eat protein first at every meal","Prepare a healthy snack between meals","After 8 pm, drink only water or unsweetened tea"],"task":"Measure your waist (at the navel), write it down, and use the checklist above to share your changes over these 10 days with your coach.","share":"Do you know anyone who often has night-time cravings and can't control their appetite?"},{"t":"The science behind the products","en":"The Science Behind the Products","tag":"Company","lead":"When choosing nutrition products, check whether there's science and quality control behind them.","intro":"There are many nutrition products on the market, with big differences in price and quality. Learn to look at the science and quality management behind a product so you can choose one you can trust.","points":[{"h":"A professional R&D team","p":"Behind Herbalife is a professional team of doctors, dietitians and scientists responsible for product development and nutrition education:","list":["More than 200 internationally recognised experts worldwide, including doctors, coaches, dietitians and advisory board members","Products are tested in 16 laboratories worldwide","Labs meet the highest international standard, ISO 17025"],"imgFull":true,"img":[{"f":"sci_team","cap":"Herbalife Nutrition Advisory Board: a team of doctors, dietitians and scientists"}],"viz":[{"type":"chips","cols":3,"title":"The numbers behind the science","items":[["200+","Internationally recognised experts"],["16","Testing laboratories worldwide"],["ISO 17025","Highest international laboratory standard"]]}]},{"h":"Research-based","p":"Good formulas are based on nutrition science research, not just advertising and word of mouth."},{"h":"Transparent ingredients","p":"Labels clearly list all ingredients and amounts, and meet local food regulations."},{"h":"Multiple quality tests","p":"From raw materials and production to the finished product, everything is tested to ensure every product matches its label and is safe and reliable."},{"h":"Ambassador programme","p":"If you're happy with the products and results, you can learn about the ambassador programme for more benefits. There are two requirements to become an ambassador:","list":["Loyal customer: confident in the products and company, and willing to help 2 people start a nutrition plan like you","Product lover: decides to make the nutrition breakfast their ideal breakfast for the long term"]},{"h":"Share good things","p":"Invite your family to join the nutrition plan so the whole family can enjoy a healthy, active lifestyle. Your coach will support you all the way."}],"viz":[{"type":"timeline","title":"4 questions to ask when choosing nutrition products","items":[["Who developed it?","Is there a professional nutrition and science team?"],["Is it evidence-based?","Is the formula based on research?"],["Is the label clear?","Are all ingredients and amounts listed?"],["Is it tested?","Are raw materials and finished products quality-tested?"]]}],"myth":{"m":"Supplements are all the same — just buy the cheapest.","f":"Raw material sources, formulas and quality management differ greatly. Products backed by science and strict quality control give more peace of mind."},"fact":{"num":"3","unit":" checkpoints","text":"Raw material testing, production, finished product testing: three quality checkpoints."},"tips":["Check ingredients and the nutrition label before buying","Don't trust \"instant results\" or \"miracle\" ads","If in doubt, ask your coach or a professional"],"task":"Think about who around you also wants to be healthier, and share this 21-day course with them.","share":"Do you know anyone who buys supplements based only on price and advertising?"},{"t":"From seed to feed","en":"Seed to Feed","tag":"Company","lead":"A good product needs quality control right from the source.","intro":"\"Seed to feed\" means product quality isn't just checked at the last step in the factory — every step, starting from growing the raw materials, follows standards.","points":[{"h":"Nutrition rooted in science","p":"The science team ensures product formulas come from the latest nutrition research.","imgFull":true,"img":[{"f":"sci_quality","cap":"Scientific quality process: 5 tests — after growing and harvesting, raw materials, after blending, after transport, after packaging"}]},{"h":"The best products come from the best raw materials","p":"Ingredients must pass strict verification and purity testing, right down to the molecular level."},{"h":"Strict testing at every step","p":"From verifying ingredient purity and potency to final testing of the finished product, the production line is tested continuously to ensure products meet or exceed the strictest regulatory standards."},{"h":"Safe manufacturing","p":"Products are made to meet or exceed current Good Manufacturing Practice (cGMP) standards, ensuring production processes and facilities are properly designed and monitored."},{"h":"Quality delivered to you","p":"Advanced technology monitors storage conditions for finished products, and samples are kept to ensure quality throughout the shelf life."}],"viz":[{"type":"timeline","title":"5 quality tests","items":[["After growing and harvesting","Test raw material sources"],["Raw material testing","Verify ingredients and purity"],["Testing after blending","Ensure the formula is accurate"],["Testing after transport","Confirm quality hasn't changed"],["Testing after packaging","Ensure it matches the label"]]}],"myth":{"m":"If it's \"natural\", it must be safe.","f":"Natural ingredients can also be contaminated or vary in quality. Strictly tested ingredients are safer."},"fact":{"num":"4","unit":" steps","text":"Growing → raw material testing → production → finished product testing."},"tips":["Check that the product has clear manufacturer information","Note the product's expiry date and storage instructions","Use the recommended serving"],"task":"Pick up a nutrition product you're using and look at the ingredients, nutrition information and manufacturer details on the label.","share":"Do you know anyone who cares a lot about food safety and quality?"},{"t":"Daily nutritional supplements","en":"Daily Nutritional Supplements","tag":"Nutrition","lead":"Supplements fill the gaps in your diet; they don't replace meals.","intro":"Ideally, all nutrition should come from food. But busy lives, eating out often and too few vegetables and fruit leave many people with daily nutrition gaps.","points":[{"h":"Why are there nutrition gaps?","p":"Oily, salty food when eating out, too few vegetables and fruit, a limited diet, plus stress and irregular routines can all leave your body short of certain vitamins and minerals."},{"h":"Whole foods have fewer nutrients than before","p":"Many people say \"eating whole foods is enough\". Of course you should eat whole foods, but today's vegetables and fruit aren't as nutritious as they were decades ago:","list":["A study in the Journal of the American College of Nutrition compared nutrient data for 43 vegetables and fruits in 1950 and 1999","Calcium, iron, vitamin C, riboflavin (vitamin B2) and other nutrients fell in many vegetables and fruits","For example, calcium in broccoli fell from 130 mg per serving in 1950 to about 48 mg","Reasons include soil nutrient depletion and breeding for yield and appearance"],"after":"So daily supplements help plug nutrition gaps when we can't eat a balanced diet every day — they don't replace whole foods.","imgFull":true,"img":[{"f":"nut_study","cap":"Journal of the American College of Nutrition, 2004: changes in nutrients of 43 garden crops, 1950–1999"},{"f":"nut_decline","cap":"Broccoli, cauliflower, cantaloupe, eggplant, tomato, asparagus: nutrient change 1950 vs 1999 (%)"}]},{"h":"Commonly lacking nutrients","p":"Dietary fibre, calcium, vitamin D, iron (especially for women) and Omega-3 are nutrients many people's diets lack."},{"h":"What vitamins and minerals do","p":"Your body needs the right amount of vitamins and minerals to keep its functions balanced.","viz":[{"type":"cloud","title":"Vitamins and minerals your body needs daily","items":[["Vitamin A","","v",1],["B1","","v",3],["B2","","v",3],["B3","","v",3],["B5","","v",3],["B6","","v",3],["B12","","v",3],["Vitamin C","","v",2],["Vitamin D","","v",1],["Vitamin E","","v",1],["Vitamin K","","v",3],["Folic acid","","v",3],["Biotin","","v",3],["Calcium","","m",2],["Iron","","m",1],["Zinc","","m",1],["Magnesium","","m",1],["Potassium","","m",1],["Iodine","","m",3],["Selenium","","m",3],["Chromium","","m",3],["Molybdenum","","m",3],["Manganese","","m",3]],"note":"Orange are vitamins, blue are minerals."}],"after":"You don't need much, but a normal diet may not provide enough every day."},{"h":"Supplement in moderation","p":"More supplements isn't better — use the recommended serving. Too much of some vitamins and minerals can be harmful."},{"h":"Special situations: ask your doctor first","p":"If you have a chronic illness, are pregnant or breastfeeding, or take medication, consult your doctor or pharmacist before starting any supplement."},{"h":"Exercise and sleep are part of nutrition too","p":"Besides eating right, moderate exercise and enough sleep are part of a healthy lifestyle."}],"viz":[{"type":"chips","title":"Common nutrition gaps and food sources","items":[["Dietary fibre","Vegetables, fruit, whole grains, beans"],["Calcium","Milk, tofu, dried small fish, dark green vegetables"],["Vitamin D","Sunlight, eggs, deep-sea fish"],["Iron","Red meat, dark green vegetables, beans"],["Omega-3","Salmon, mackerel, sardines, flaxseed"]]}],"myth":{"m":"If I take vitamins, I don't need to eat vegetables.","f":"Vegetables and fruit contain fibre and many nutrients supplements don't. Supplements support your diet; they can't replace a balanced diet."},"fact":{"num":"5","unit":" servings","text":"Eat at least 5 servings of vegetables and fruit a day (about 400 g) — the most basic source of nutrition."},"tips":["Vegetables fill half your plate at every meal","Get 10–15 minutes of sunlight every day","Take supplements with meals for better absorption"],"task":"Count how many servings of vegetables and fruit you ate today (one serving is about a fist). Aim for 5.","share":"Do you know anyone who eats out a lot and rarely eats vegetables and fruit?","philo":"Vitamins and minerals help fill the gaps in balanced nutrition:"},{"t":"Outer nutrition","en":"Outer Nutrition","tag":"Products","lead":"Good skin needs inside and outside working together: inner nutrition + outer care for the best results.","intro":"Skin is the body's largest organ and deserves good care. Beauty comes from within: skin, hair and nails renew every day, built from the nutrients you eat.","points":[{"h":"B vitamins","p":"Vitamins B2, B3, B6 and biotin help maintain healthy skin and hair. B vitamins are water-soluble and need topping up daily."},{"h":"Zinc and copper","p":"Zinc helps maintain healthy skin, hair and nails; copper supports normal hair and skin pigmentation."},{"h":"Protein","p":"Hair and nails are mainly made of protein, and skin collagen needs protein as raw material. Without enough protein, hair becomes dry and breaks easily."},{"h":"Water and good fats","p":"Drinking enough water keeps skin hydrated; good fats like Omega-3 help maintain the skin barrier."},{"h":"Outer care matters just as much","p":"Daily sun protection, enough sleep, gentle cleansing, fewer late nights and no smoking all help keep skin healthy."},{"h":"Herbalife outer nutrition products","p":"Skin is the body's largest organ. Besides eating the right nutrients from within, it needs good care from the outside too. Herbalife has a range of outer care products:","list":["SKIN range: cleanser, toner, serum, day cream, night cream, exfoliator and other daily care","Aloe range: hand cream, body wash, soothing gel, shampoo and conditioner","Vitamin face mask: 12 vitamins plus aloe and avocado to help moisturise"],"after":"Skin needs inside and outside working together: eat the right nutrients from within and care for it well from outside — the two together give the best results. Want to know more? Ask your coach to arrange a Skin Spa so you can experience our outer nutrition for yourself.","imgFull":true,"img":[{"f":"skin_products2","cap":"Herbalife outer nutrition: SKIN skincare range, Aloe body and hair care range, vitamin face mask"}]}],"viz":[{"type":"chips","title":"Nutrients for skin and hair, and food sources","items":[["Vitamin B2","Milk, eggs, leafy greens"],["Vitamin B3","Chicken, fish, peanuts"],["Vitamin B6","Chicken, bananas, potatoes"],["Biotin","Egg yolk, nuts, seeds"],["Copper","Nuts, shellfish, whole grains"],["Zinc","Oysters, red meat, pumpkin seeds"]]}],"myth":{"m":"Good skin depends only on skincare products.","f":"Skincare works on the surface; your skin's raw materials come from your diet. Inner nutrition plus outer care works best."},"fact":{"num":"7–9","unit":" hours","text":"Recommended nightly sleep for adults. Sleep is an important time for skin repair."},"tips":["Apply sunscreen before going out","Put your phone down an hour before bed","A small handful of nuts a day"],"task":"Go to bed 30 minutes earlier than usual tonight, put your phone away, and see if you feel more energetic tomorrow morning. To learn about outer care, ask your coach to arrange a Skin Spa experience.","share":"Do you know anyone who cares a lot about skin and hair care?","leadHL":true},{"t":"Hydration and cell health","en":"Hydration & Cellular Health","tag":"Nutrition","lead":"Drinking water isn't just about thirst — water is the environment your cells work in.","intro":"On Day 2 we learned to drink enough water. Today we go further: how to tell whether you're drinking enough, and how water relates to cell health.","points":[{"h":"Three hydration questions: how much? why? what?","p":"Everyone's needs differ, but remember these three points:","list":["How much: about 8–10 cups of water a day (at 400 ml a cup, about 3–4 litres) to keep your body at its best","Why: lack of water causes fatigue, constipation, dry skin, migraines and muscle cramps","What: besides plain water, Herbalife's aloe concentrate and hibiscus herbal tea, mixed with water, also help you get the water you need each day"],"after":"Find plain water too bland to drink? Make an aloe drink or herbal tea — low in calories and refreshing, making 8–10 cups easier.","viz":[{"type":"kcal","title":"Helpers for drinking enough water","items":[["aloe","Aloe concentrate","Low calorie","Mix with water"],["tea","Hibiscus herbal tea","Low calorie","Hot or cold"],["s_water","Plain water","0 calories","8–10 cups a day"]]}]},{"h":"8–10 cups a day (3–4 litres)","p":"Whether in daily activity or during exercise, water is vital for your body.","list":["8–10 cups a day, about 3–4 litres","Or 40–50 ml per kg of body weight","Drink more when you sweat during exercise"]},{"h":"Effects of dehydration","p":"Lack of water can cause headaches, muscle cramps, muscle fatigue, constipation, dry skin and frequent tiredness.","viz":[{"type":"bubbles","title":"Effects of lack of water","items":["Headache","Muscle cramps","Muscle fatigue","Constipation","Dry skin","Often tired"]}]},{"h":"Balance inside and outside cells","p":"Muscles, nerves and energy metabolism work properly only when water and electrolytes (sodium, potassium, magnesium) inside and outside cells are balanced."},{"h":"Replace electrolytes when you sweat a lot","p":"When you sweat heavily during exercise or hot weather, replace electrolytes as well as water to avoid cramps and fatigue."},{"h":"Check your urine colour","p":"Urine close to pale yellow means you're roughly well hydrated; the darker it is, the more you need to drink. (Some vitamins can turn urine yellow — this is normal.)"},{"h":"Drinks that hydrate","p":"Plain water is best; herbal tea and unsweetened tea also help. Sugary drinks don't count — they add calories."},{"h":"Good times to drink water","p":"After waking, before every meal, before and after exercise, and when you feel tired or want a snack are all good times to drink water."}],"viz":[{"type":"swatch","title":"Check hydration by urine colour","items":[["#f6f2c8","Well hydrated"],["#f1e58f","Well hydrated"],["#e9cf55","Could drink a bit more"],["#d9ad2d","Need to drink water"],["#b9831d","Clearly dehydrated — drink water now"]],"note":"For everyday reference only. If the colour is unusual or stays dark, consult a doctor."}],"myth":{"m":"In winter or an air-conditioned room you don't sweat, so you don't need as much water.","f":"You lose water through breathing and skin every day, and air-conditioned air is dry — you still need to hydrate."},"fact":{"num":"Pale yellow","unit":"","text":"Urine close to pale yellow means your body is roughly well hydrated."},"tips":["Keep your water bottle where you can see it","Add lemon slices or mint leaves to your water","Drink a glass of water before every meal"],"task":"Today, swap one sugary drink for plain water or unsweetened tea, and check your urine colour.","share":"Do you know anyone who often feels tired or has headaches but rarely drinks water?","philo":"Enough water is an essential part of balanced nutrition:"},{"t":"Healthy ageing and fibre","en":"Healthy Aging · Greens Power","tag":"Nutrition","lead":"Living long isn't enough — you want to live with strength and energy.","intro":"Healthy ageing means staying mobile, energetic and largely free of illness as you get older. Protein and fibre in your diet are the two most important helpers.","points":[{"h":"Muscle is the capital of healthy ageing","p":"Ageing is the slow decline of body structure or function. Without exercise, muscle drops by about 1% a year after age 30:","list":["Less muscle and more fat — you look bigger even at the same weight","With less muscle, you burn fat less well and gain weight more easily","By 70, you may have only about two-thirds of the muscle you had at 30","Staying active, exercising regularly and eating enough protein slow muscle loss"],"viz":[{"type":"bars","title":"Muscle mass with age without exercise (illustration)","unit":"%","items":[["Age 30",100],["Age 40",90],["Age 50",82],["Age 60",74],["Age 70",67,1]],"note":"Illustrative values with muscle mass at age 30 as 100%. Moderate exercise plus enough protein can maintain muscle mass."}]},{"h":"Three big benefits of fibre","p":"Dietary fibre doesn't just help bowel movements — it has many other benefits:","list":["Digestion: promotes gut movement, adds stool bulk, supports good gut bacteria and lowers the risk of digestive diseases","Immunity: fermentable fibres like inulin and resistant starch are \"prebiotics\" — food for good gut bacteria. The short-chain fatty acids they produce help regulate immune responses and reduce inflammation","Metabolic health: eating more vegetables, fruit, fish, dairy, coffee and tea helps prevent metabolic syndrome"],"imgFull":true,"img":[{"f":"fib_benefit","cap":"Fibre and digestion, immunity and metabolic syndrome (refs: Microorganisms 2023; Academy of Nutrition and Dietetics 2015)"}]},{"h":"Research shows: enough protein and fibre means more successful weight loss","p":"A 2024 study in Obesity Science and Practice followed people on a weight-loss programme for a full year:","list":["Those who succeeded lost about 13% of body weight on average after a year","Those who didn't lost only about 2%","The key difference: the successful group ate more protein and fibre while controlling calories"],"after":"Conclusion: to succeed at weight management, eat more protein and fibre while controlling calories.","imgFull":true,"img":[{"f":"fib_study","cap":"Lee et al., 2024, Obesity Science and Practice: successful dietary changes linked to weight-loss results"}]},{"h":"Fibre steadies blood sugar and cholesterol","p":"Soluble fibre (oats, beans, apples) slows sugar absorption and helps lower cholesterol."},{"h":"Most people don't get enough fibre","p":"Adults need about 25 g of fibre a day, but from natural foods alone you'd have to eat a lot:","list":["5 g fibre ≈ 2 sweet potatoes or 3 oranges","25 g fibre ≈ 10 sweet potatoes or 15 oranges","Most people get only about half that each day"],"imgFull":true,"img":[{"f":"fib_25g","cap":"25 g fibre ≈ 10 sweet potatoes ≈ 15 oranges"}],"viz":[{"type":"cmp2","title":"How many calories to get enough fibre?","a":"Natural foods","b":"Herbalife Active Fiber Complex","rows":[{"h":"5 g fibre","a":[["2 sweet potatoes","About 200 kcal"],["3 oranges","About 190 kcal"]],"b":["1 serving","9 kcal"]},{"h":"25 g fibre","a":[["10 sweet potatoes","About 1000 kcal"],["15 oranges","About 930 kcal"]],"b":["5 servings","45 kcal"]}],"note":"Natural food calories are approximate. Keep eating natural foods; the fibre drink helps fill the gap without adding many calories."}]},{"h":"There are three kinds of fibre — best to get them together","p":"Fibre isn't just one thing — different fibres do different jobs:","list":["Soluble fibre: forms a gel in the gut, slows sugar absorption, helps steady blood sugar and cholesterol, and increases fullness","Insoluble fibre: adds stool bulk and promotes gut movement for smooth bowel movements","Inulin: a prebiotic that feeds good gut bacteria and helps maintain gut health"],"after":"Herbalife Active Fiber Complex (with inulin) has both soluble and insoluble fibre — 5 g of fibre per serving at only 9 calories, making it easy to reach your daily fibre needs.","viz":[{"type":"chips","cols":3,"title":"Three fibres, each with its own job","items":[["Soluble","Steadies blood sugar, lowers cholesterol"],["Insoluble","Helps bowel movements"],["Inulin","Feeds good gut bacteria"]]}],"imgFull":true,"img":[{"f":"fib_product","cap":"Herbalife Active Fiber Complex (with inulin): soluble + insoluble fibre, 5 g per serving"}]},{"h":"Increase slowly and drink more water","p":"Suddenly eating a lot more fibre can cause bloating. Increase gradually and drink more water so the fibre can do its job."}],"viz":[{"type":"bars","title":"Fibre and calories in one serving of common foods","unit":"g","target":[25,"Daily target 25 g"],"items":[["A bowl of cooked lentils (about 200 g)",15,0,230],["A pear",5.5,0,100],["Herbalife Active Fiber Complex (1 serving)",5,0,9],["A bowl of cooked broccoli",5,0,55],["A bowl of oatmeal",4,0,160],["A slice of wholemeal bread",2,0,80],["A bowl of white rice",0.6,0,200]],"note":"Approximate values. Herbalife Active Fiber Complex has 5 g of fibre per serving at only 9 calories."}],"myth":{"m":"Eating fibre makes you run to the toilet all the time.","f":"The right amount of fibre makes bowel movements more regular. Increase gradually and drink more water, and your body will adapt."},"fact":{"num":"25–30","unit":"g","text":"Recommended daily fibre intake for adults. Many people get only about half."},"tips":["Swap white rice for brown rice at lunch or dinner","Add a portion of vegetables, fruit or beans to every meal","For snacks, choose wholemeal crackers, fruit, nuts or mung bean soup"],"task":"Add a portion of green vegetables to every meal today, and drink two more glasses of water.","share":"Do you know anyone who is often constipated and rarely eats vegetables?","philo":"25 g of fibre a day is also part of balanced nutrition:"},{"t":"Healthy living and weight-loss stages","en":"Healthy Active Lifestyle","tag":"Level up","lead":"Understand the stages of weight loss so you won't panic at a plateau.","intro":"Weight loss isn't a straight line down. Knowing what happens at each stage helps you keep going and adjusting when your weight stalls.","points":[{"h":"First, understand body fat percentage","p":"Body fat percentage is the share of your body weight that is fat. It reveals your shape and health better than weight does.","list":["At the same weight, the lower your body fat, the firmer you look","Men and women have different standards — women naturally need a bit more fat","Each stage below is judged by body fat percentage"],"viz":[{"type":"table","title":"Body fat reference","head":["Category","Women","Men"],"rows":[["Athlete","14–20%","6–13%"],["Healthy","21–24%","14–17%"],["Average","25–31%","18–24%"],["Obese","Above 32%","Above 25%"]],"best":1,"note":"Based on general body fat categories; figures are approximate ranges. Ask your coach to measure you so you know which range you're in."}]},{"h":"Where is your fat stored?","p":"Everyone stores fat in different places:","list":["Belly (apple shape): fat around the waist, more common in men","Hips and thighs (pear shape): more common in women","All over: fat spread evenly across the body"],"after":"Belly fat needs the most attention. Much of the fat around your waist is \"visceral fat\" wrapped around organs, most closely linked to heart disease, diabetes and fatty liver. So besides weight, measure your waist regularly too.","viz":[{"type":"chips","title":"Waist reference (Asians)","items":[["Men","Waist under 90 cm"],["Women","Waist under 80 cm"]]}]},{"h":"Stage 1: from heavy to medium","p":"Criteria: body fat above 25% for men, above 30% for women. Eat less than before, cut out snacks and late-night supper, and stay away from fried and high-sugar foods."},{"h":"Stage 2: from medium to slim","p":"Criteria: body fat 20–25% for men, 25–30% for women. At this stage, follow your coach's meal plan carefully."},{"h":"Stage 3: the plateau","p":"Your body \"adapts\" to weight loss, metabolism slows, and weight temporarily stops dropping. This is normal — don't be discouraged.","list":["Diet: eat more foods rich in B vitamins, dietary fibre and quality protein","Fruit: switch to low-GI apples, kiwis and grapefruit","Exercise: change your workout to break through"]},{"h":"Final stage: from slim to perfect (sculpting)","p":"Congratulations — you've come through the hardest stage!","list":["Diet: fat-loss meals with enough protein to help build muscle","Exercise: cardio every day, strength training at least 3 times a week","Focus on the areas you're still not happy with","Remember to stretch after exercise"]},{"h":"Benefits of a healthy, active life","p":"Regular meals, enough sleep and daily activity don't just help your figure — they relieve stress, boost productivity and confidence, and make your mood and life better."}],"viz":[{"type":"timeline","title":"The 4 stages of weight loss","items":[["Heavy to medium","Men > 25% · Women > 30%","Cut snacks and supper, avoid fried and high-sugar food"],["Medium to slim","Men 20–25% · Women 25–30%","Follow the meal plan carefully"],["Plateau","Weight pauses","Adjust diet and exercise to break through"],["Slim to perfect","Sculpting phase","High protein + cardio + strength training 3× a week"]],"note":"Percentages are body fat criteria, from class handouts."}],"myth":{"m":"If your weight stalls, the method isn't working.","f":"A plateau is a normal process. Keep going and make small adjustments, and your body will keep improving."},"fact":{"num":"3","unit":" ×/week","text":"In the sculpting phase, at least 3 strength sessions a week plus daily cardio is recommended."},"tips":["Weigh yourself on the same day and time each week","Record your waist and body fat too","Take a full-body photo and compare after a month"],"task":"Set your next-stage goal (weight, waist or body fat) with your coach, and write it down.","share":"Do you know anyone who gave up when their weight loss hit a plateau?","philo":"Whatever stage you're at, eat according to this chart:"},{"t":"Why we're confident","en":"What Makes Us Confident","tag":"Confidence","lead":"Confidence in the products, the company, and your own change.","intro":"At Day 19 you have a solid understanding of nutrition. Today let's talk about confidence: in the products, in the company and, most importantly, in yourself.","points":[{"h":"Confidence in the products","p":"According to 2024 data from international market research firm Euromonitor, Herbalife holds three global #1 positions:","imgFull":true,"img":[{"f":"no1_three","cap":"Three global #1s (source: Euromonitor, 2025 edition, 2024 retail sales data)"}],"list":["World's #1 weight management and wellness brand","World's #1 protein shake","Wor ence teams."},{"h":"Confidence in the system","p":"With coach follow-up, a course and team support, you're not losing weight alone."},{"h":"Confidence in yourself","p":"The most important confidence comes from you. Over these 19 days, you've already been changing your eating, drinking and exercise habits."}],"viz":[{"type":"chips","title":"Herbalife at a glance","items":[["1980","Founded in Los Angeles, USA"],["90+","Countries and regions of operation"],["NYSE","Listed company"],["40+ years","Focused on nutrition"],["190+","Athletes, teams and events sponsored"]]}],"myth":{"m":"Changing habits is too hard — I can't do it.","f":"You've kept going for 19 days. Every small change proves you can do it."},"fact":{"num":"1980","unit":"","text":"The year Herbalife was founded."},"tips":["Look back at your Day 1 records","Write down your progress and put it somewhere visible","Share your changes with your coach"],"task":"Write down the most noticeable change in your body or habits over these 19 days and share it with your coach.","share":"Do you know anyone who wants to change but lacks confidence in themselves?"},{"t":"The spirit of mutual help and teamwork","en":"Bayanihan Spirit & Teamwork","tag":"Education system","lead":"Alone you go fast; together you go far.","intro":"The hardest part of healthy habits isn't starting — it's sticking with them. A supportive team makes that much easier.","points":[{"h":"What is Bayanihan?","p":"Bayanihan is a Filipino word that originally meant neighbours helping to carry a house together — the spirit of helping each other and sharing the load."},{"h":"The power of peers","p":"With peers to check in, exercise and share meal plans with — and encouragement when things get hard — you're far more likely to keep going."},{"h":"What is a nutrition club?","p":"A nutrition club is a fun place to enjoy a healthy breakfast.","list":["Share health, fitness and nutrition info","Share success stories","It can be at home or elsewhere"],"after":"You' r hidangan","Ambil gambar dari atas dan masukkan seluruh pinggan","Ambil gambar setiap hidangan, snek dan minuman, dan hantar kepada jurulatih sebelum makan"],"note":"Label hijau dalam gambar ialah kalori yang dikira oleh jurulatih, contohnya sayur 200 kcal + ayam 300 kcal = 500 kcal."}},{"t":"Kepentingan air","en":"Importance of Water","tag":"Nutrisi","lead":"Setiap tindak balas kimia dalam badan memerlukan air. Minum air yang cukup ialah langkah pertama ke arah kesihatan.","intro":"Kita boleh hidup beberapa minggu tanpa makanan, tetapi beberapa hari tanpa air boleh mengancam nyawa. Air ialah nutrien paling asas dan paling mudah diabaikan.","points":[{"h":"Badan anda kira-kira 60% air","p":"Badan manusia kira-kira 60 hingga 70% air.","viz":[{"type":"body","title":"Air dalam badan","level":0.65,"items":[["Otak","75%"],["Hati","86%"],["Otot","86%"]],"note":"Seluruh badan kira-kira 60 hingga 70% air (sumber: nota kelas)."}],"list":["Otak, hati, otot dan darah semuanya mengandungi banyak air","Pengawalan suhu badan dan pengangkutan nutrien bergantung pada air","Membantu badan membuang sisa melalui peluh, air kencing dan najis"]},{"h":"Berapa banyak air perlu diminum sehari?","p":"Air lebih penting apabila anda meningkatkan pengambilan nutrisi dan menguruskan berat badan.","list":["40–50 ml bagi setiap kg berat badan sehari","Kira-kira 3–4 liter sehari","Dengan 400 ml secawan, kira-kira 8–10 cawan"]},{"h":"Setiap orang memerlukan air yang cukup","p":"Kecuali beberapa keadaan khas, setiap orang perlu minum air yang cukup.","list":["Pengecualian: mereka yang diarahkan doktor untuk menghadkan air kerana penyakit tertentu (contohnya sesetengah penyakit buah pinggang atau jantung)","Jika tidak pasti sama ada anda termasuk dalam keadaan ini, tanya doktor dahulu"]},{"h":"Bila dahaga, badan sudah kekurangan air","p":"Apabila terasa dahaga, badan sebenarnya sudah sedikit kekurangan air. Badan akan memberi amaran seperti kejang otot, keletihan, sembelit dan kulit kering."},{"h":"Dahaga dan lapar sering keliru","p":"Selalunya kita sangka lapar padahal hanya dahaga. Sebelum makan snek, minum segelas air dan tunggu 10 minit sebelum membuat keputusan."},{"h":"Pilihan hidrasi rendah kalori","p":"Selain air kosong, jus aloe dan minuman teh herba juga pilihan hidrasi yang baik.","viz":[{"type":"kcal","title":"Minuman hidrasi: pilih yang betul, kalorinya jauh berbeza","items":[["aloe","Jus aloe","Rendah kalori","Membantu hidrasi"],["tea","Minuman teh herba","Rendah kalori","Membantu hidrasi"],["icedrink","Minuman bergula","160–200 kcal","Secawan"]]}],"list":["Sangat rendah kalori","Rasa yang menyegarkan memudahkan anda minum air yang cukup setiap hari","Boleh menggantikan minuman bergula"]},{"h":"Air membantu metabolisme","p":"Badan memerlukan air untuk memecahkan lemak dan membuang sisa metabolik. Jika kurang minum air, metabolisme menjadi kurang cekap dan mudah sembelit."},{"h":"Air tidak menyebabkan bengkak, kurang minum air yang menyebabkannya","p":"Ramai takut minum banyak air akan menyebabkan badan bengkak. Sebenarnya sebaliknya.","list":["Kurang minum air: badan menyangka kekurangan air lalu menyimpannya, jadi badan mudah bengkak","Minum air cukup setiap hari: barulah badan berani membuang air yang berlebihan","Minum air cukup: kulit lebih lembap dan hasil penurunan berat badan lebih baik"],"after":"Mahu kurang garis halus di wajah dan kulit cantik, minumlah lebih banyak air!"},{"h":"Kurang minum air mungkin menyebabkan reaksi penyesuaian","p":"Pada awal mengubah pemakanan, jika kurang minum air, segelintir orang (kira-kira 5 daripada 100) mungkin mengalami reaksi penyesuaian badan.","viz":[{"type":"bubbles","title":"Reaksi penyesuaian yang mungkin berlaku","items":["Pening","Sakit kepala","Loya","Ruam","Degupan jantung laju","Cirit-birit","Sembelit"],"note":"Jika reaksi ini berlaku, ingat untuk minum lebih banyak air; ia reaksi semula jadi semasa badan menyesuaikan diri. Tetapi jangan anggap semua simptom sebagai reaksi penyesuaian; jika tidak sihat, segera berjumpa doktor."}],"list":["Paling penting, minum lebih banyak air","Teruskan makan mengikut pelan makan dan jangan hentikan shake nutrisi harian","Setiap badan berbeza; reaksi berbeza mengikut individu dan akan hilang perlahan-lahan selepas beberapa ketika"],"after":"Namun, jangan anggap semua ketidakselesaan sebagai reaksi penyesuaian; jika tidak sihat, segera berjumpa doktor."}],"viz":[{"type":"cups","title":"Berapa cawan air sehari? (1 cawan = 400 ml)","rows":[["Saranan umum",10,"8–10 cawan, kira-kira 3.2–4 liter"],["Lelaki",9,"Kira-kira 3.7 liter"],["Wanita",7,"Kira-kira 2.7 liter"]],"note":"Saranan umum ialah kira-kira 8–10 cawan sehari. Angka untuk lelaki dan wanita daripada US National Academies of Sciences, Engineering, and Medicine; kira-kira 20% air boleh datang daripada makanan."}],"myth":{"m":"Minum minuman bergas, kopi dan teh susu juga dikira sebagai minum air.","f":"Minuman bergula membawa banyak kalori, dan kafein juga bersifat diuretik. Cara terbaik untuk hidrasi masih air kosong, diikuti teh tanpa gula."},"fact":{"num":"60","unit":"%","text":"Anggaran peratusan air dalam berat badan orang dewasa."},"tips":["Minum segelas air suam sebaik bangun tidur","Minum beberapa teguk air setiap kali selepas ke tandas","Tetapkan peringatan setiap jam di telefon untuk minum air"],"task":"Gunakan kalkulator di bawah untuk mengira berapa banyak air perlu diminum setiap hari. Sediakan cawan 400 ml atau botol bersukat, dan catat berapa cawan yang anda minum hari ini.","share":"Adakah anda kenal sesiapa yang jarang minum air kosong?","calc":"water"},{"t":"Nutrisi sel","en":"Cellular Nutrition","tag":"Nutrisi","lead":"Manusia hanya ada satu penyakit: sel yang sakit. Perut kenyang tidak bermakna sel juga kenyang.","intro":"Badan terdiri daripada puluhan trilion sel, dan setiap minit banyak sel mati dan diperbaharui. Sihat atau tidak sel baharu bergantung pada bahan mentah yang anda beri.","points":[{"h":"Sel ialah unit asas kesihatan","p":"Kulit, otot, organ dan darah semuanya terdiri daripada sel. Dengan nutrisi yang cukup, sel berfungsi dan membaiki diri dengan normal; jika kurang, fungsi sel akan merosot perlahan-lahan."},{"h":"Sel memerlukan tujuh nutrien utama","p":"Protein, karbohidrat, lemak, vitamin, mineral, serat diet dan air, semuanya penting. Makan kenyang tetapi tidak betul, sel tetap \"lapar\"."},{"h":"Nutrien diserap di usus kecil","p":"Dinding usus kecil dipenuhi vilus halus yang meningkatkan luas permukaan penyerapan. Hanya usus yang sihat dapat menggunakan nutrien yang dimakan dengan sepenuhnya.","viz":[{"type":"villi","title":"Vilus usus: sihat vs rosak"}]},{"h":"Apa yang merosakkan vilus usus?","p":"Semua ini boleh menyumbat atau merosakkan vilus usus dan menjejaskan penyerapan nutrien:","list":["Makanan tidak sihat: lemak tepu, lemak trans, gula halus, kanji halus, garam berlebihan","Bahan tambah makanan dan pengawet","Tekanan","Merokok dan minum alkohol","Ubat-ubatan","Pencemaran, racun perosak dan bahan berbahaya di udara"],"after":"Nutrisi seimbang membantu melindungi dan membaiki usus supaya sel mendapat nutrien yang mencukupi."},{"h":"Bagaimana protein memberi makan kepada sel?","p":"Begini badan menggunakan protein daripada makanan:","viz":[{"type":"flow","title":"Perjalanan protein","steps":[["Protein dalam makanan","Ayam, ikan, telur, tauhu, shake nutrisi"],["Dipecahkan kepada asid amino","Dipecahkan dalam saluran pencernaan"],["Diserap oleh usus kecil","Diserap dengan cepat dalam kira-kira 15 minit"]],"targets":["Sel otak","Sel kulit","Sel otot","Sel organ lain"]}]},{"h":"Kalori berlebihan, nutrisi kurang","p":"Pemakanan moden selalunya tinggi minyak, gula dan kanji halus, tetapi rendah sayur, buah, protein dan mikronutrien. Ramai orang berlebihan berat badan tetapi selnya kekurangan nutrisi."},{"h":"Isi jurang nutrisi","p":"Makan seimbang dahulu, kemudian gunakan suplemen mengikut keperluan untuk mengisi jurang nutrisi dalam pemakanan harian."}],"viz":[{"type":"chips","title":"Tujuh nutrien yang diperlukan sel","items":[["Protein","Membina dan membaiki sel"],["Karbohidrat","Sumber tenaga utama"],["Lemak","Membran sel, bahan asas hormon"],["Vitamin","Mengawal fungsi badan"],["Mineral","Tulang, saraf, otot"],["Serat diet","Kesihatan usus"],["Air","Persekitaran bagi semua tindak balas"]]}],"myth":{"m":"Saya makan sampai kenyang, jadi nutrisi pasti cukup.","f":"Kenyang hanya bermakna kalori sudah cukup. Nutrisi cukup atau tidak bergantung pada sama ada jenis makanan yang dimakan seimbang."},"fact":{"num":"90","unit":"%","text":"Kira-kira 90% nutrien yang diperlukan badan diserap melalui vilus usus kecil."},"tips":["Satu hidangan protein pada setiap kali makan","Makan sayur dan buah pelbagai warna setiap hari","Kurangkan makanan diproses, lebihkan makanan asli"],"task":"Lihat pinggan anda hari ini, kira berapa daripada tujuh nutrien utama yang anda makan, dan yang mana tertinggal.","share":"Adakah anda kenal sesiapa yang selalu makan makanan tidak sihat dan gaya hidupnya kurang baik?","philo":"Untuk sel yang sihat, nutrisi mesti seimbang. Ingat carta ini:"},{"t":"Sarapan ideal","en":"Ideal Breakfast","tag":"Pelan makan","lead":"Sarapan yang berasaskan protein berkualiti dan tinggi serat boleh membantu menstabilkan gula darah sepanjang hari.","intro":"Selepas semalaman tidak makan, badan paling memerlukan nutrisi pada waktu pagi. Apa yang dimakan semasa sarapan mempengaruhi gula darah, tenaga dan selera sepanjang hari.","points":[{"h":"Sarapan memecahkan puasa semalaman","p":"Badan masih menggunakan tenaga semasa tidur. Nutrisi pada waktu pagi membantu badan bermula, menstabilkan gula darah dan memberi lebih tenaga pada waktu pagi."},{"h":"Apa itu sarapan ideal?","p":"Sarapan ideal = protein berkualiti + makanan tinggi serat + air yang cukup.","list":["Protein berkualiti: telur, tauhu, dada ayam, shake nutrisi","Makanan tinggi serat: sayur, buah, oat, bijirin penuh","Air yang cukup: minum segelas sebaik bangun"],"after":"Sarapan seperti ini lambat dicerna dan gula darah stabil, bukan sahaja kenyang hingga tengah hari malah membantu menstabilkan gula darah sepanjang hari.","viz":[{"type":"portion","title":"Apa yang dimakan untuk sarapan ideal?","carb":{"h":"Makanan tinggi serat","items":[["Sayur-sayuran","vege"],["Buah-buahan","guava"],["Oat / bijirin penuh","brownrice_k"]]},"pro":{"h":"Protein berkualiti","items":[["Telur","egg"],["Tauhu","tofu"],["Dada ayam","chicken"],["Shake nutrisi","shake"]]}}]},{"h":"Kenapa protein dan serat membuatkan anda tidak cepat lapar?","p":"Sistem pencernaan berkomunikasi dengan otak untuk memberitahu \"sudah kenyang atau belum\". Makanan berbeza menghantar isyarat berbeza:","list":["Makanan manis, kanji, alkohol: merangsang otak \"boleh makan lagi\", mudah makan berlebihan","Protein: selepas dicerna, memberitahu otak \"sudah kenyang, jangan makan lagi\"","Serat: menambah isi dalam usus, melambatkan pencernaan dan memberi rasa kenyang"],"after":"Ingat: makan perlahan-lahan. Jika makan terlalu cepat, anda sudah makan terlalu banyak sebelum otak menerima isyarat \"kenyang\".","viz":[{"type":"split","title":"Isyarat makanan kepada otak","left":{"h":"\"Sudah kenyang, jangan makan lagi\"","cls":"good","items":["Protein: telur, tauhu, ikan, ayam","Serat: sayur, buah, bijirin penuh","Rasa kenyang lebih lama"]},"right":{"h":"\"Boleh makan lagi\"","cls":"bad","items":["Makanan manis","Kanji","Alkohol","Mudah makan semakin banyak"]}}]},{"h":"Roller coaster gula darah","p":"Sarapan tinggi karbohidrat seperti bijirin, roti, bubur, mi dan nasi membuatkan gula darah seperti menaiki roller coaster:","list":["Naik mendadak: gula darah melonjak selepas makan","Turun: badan merembeskan banyak insulin untuk menurunkan gula darah dan menyimpannya sebagai lemak","Jatuh ke bawah: terasa letih dan cepat lapar semula","Naik semula: teringin gula dan kanji, lalu melonjak sekali lagi"],"after":"Menaiki roller coaster ini beberapa kali sehari ialah salah satu punca utama diabetes, darah tinggi dan berat badan berlebihan. Tukar kepada sarapan berasaskan protein, gula darah akan jauh lebih stabil.","viz":[{"type":"sugar","mode":"spike","cap":"Sarapan tinggi karbohidrat: roller coaster gula darah","title":"Perubahan gula darah sepanjang hari"},{"type":"sugar","mode":"steady","cap":"Sarapan berasaskan protein berkualiti: gula darah stabil","title":"Perubahan gula darah sepanjang hari"}]},{"h":"Tidak bersarapan pun sama","p":"Tidak bersarapan juga membawa anda ke dalam kitaran gula darah:","list":["Gula darah turun, terasa lapar dan tidak bertenaga","Teringin karbohidrat ringkas untuk hilangkan lapar","Gula darah melonjak dan jatuh semula"]},{"h":"Makan sedikit tetapi kerap lebih stabil","p":"Makan 5 kali sehari: sarapan, snek pagi, makan tengah hari, snek petang, makan malam. Elakkan terlalu lapar supaya tidak makan berlebihan pada hidangan seterusnya."},{"h":"Cepat dan berkhasiat","p":"Waktu pagi selalunya kesuntukan masa. Satu shake nutrisi atau sarapan protein ringkas boleh disediakan dalam beberapa minit, lebih jimat masa daripada beratur membeli sarapan di luar."}],"viz":[{"type":"timeline","title":"Kitaran ganas sarapan tinggi karbohidrat","items":[["Makan sarapan tinggi karbohidrat","Roti, bubur, mi, nasi, minuman manis"],["Gula darah melonjak","Pankreas merembeskan banyak insulin"],["Gula ditukar menjadi lemak","Gula darah jatuh mendadak dalam masa singkat"],["Lapar dan teringin gula","Makan lebih banyak karbohidrat, kitaran berulang"]]},{"type":"timeline","title":"Contoh jadual 5 hidangan sehari","items":[["Sarapan","Kira-kira 150 kcal","Berasaskan protein"],["9 pagi","Kira-kira 100 kcal","Satu hidangan buah"],["Makan tengah hari","Kira-kira 500 kcal","Sayur + protein + karbohidrat kompleks"],["4 petang","Kira-kira 150 kcal","Snek protein"],["Makan malam","Kira-kira 500 kcal","Sayur + daging tanpa lemak / ikan"]],"note":"Contoh dengan jumlah kira-kira 1400 kcal. Jurulatih akan menyesuaikan saiz hidangan sebenar mengikut ketinggian, berat dan matlamat anda."}],"myth":{"m":"Tidak bersarapan bermakna kurang satu hidangan, jadi lebih mudah kurus.","f":"Tidak bersarapan mudah menyebabkan makan lebih banyak pada waktu tengah hari dan malam, serta lebih teringin makanan manis dan berkanji. Makan secara teratur lebih mudah mengawal jumlah kalori."},"fact":{"num":"5","unit":" hidangan","text":"Makan 5 kali sehari (3 hidangan utama + 2 snek) membantu menstabilkan gula darah dan mengawal rasa lapar."},"tips":["Sediakan sarapan pada malam sebelumnya","Tukar kopi manis kepada kopi O kosong atau teh tanpa gula","Sediakan satu hidangan buah sebagai snek pagi"],"task":"Tambah satu hidangan protein dalam sarapan esok, seperti telur, susu soya tanpa gula, atau serbuk protein F3 dalam shake nutrisi. Perhatikan sama ada rasa lapar pada waktu pagi berbeza.","share":"Adakah anda kenal sesiapa yang selalu makan sarapan berasaskan karbohidrat, atau kerap tidak bersarapan?","leadHL":true,"philo":"Sarapan ideal bermakna meletakkan carta ini ke dalam hidangan pertama anda:"},{"t":"Mengenali indeks glisemik","en":"Low Glycemic Index","tag":"Nutrisi","lead":"Tidak makan manis maka tidak akan dapat diabetes? Kerap makan makanan GI tinggi ialah pembunuh gula darah yang sebenar.","intro":"Bukan hanya gula-gula dan kek yang menaikkan gula darah. Makanan ruji harian seperti nasi putih, roti putih dan mi juga menaikkan gula darah dengan cepat.","points":[{"h":"Apa itu indeks glisemik (GI)?","p":"GI menunjukkan kelajuan makanan karbohidrat dicerna menjadi glukosa dan menaikkan gula darah. Semakin tinggi GI, semakin cepat gula darah naik.","foods":[{"h":"Makanan GI tinggi","sub":"70 atau lebih","cls":"hi","items":[["chaomifen","Bihun goreng",98],["karipap","Karipap",87],["fries","Kentang goreng",85],["soda","Minuman bergas",85],["tehtarik","Teh tarik",73],["roticanai","Roti canai",71],["bread","Roti putih",70]]},{"h":"Makanan GI sederhana","sub":"56–69","cls":"mid","items":[["burger","Burger",67],["sushi","Sushi",67],["apricot","Aprikot",61],["mango","Mangga",60],["udon","Udon",58],["papaya","Betik",58]]},{"h":"Makanan GI rendah","sub":"55 atau kurang","cls":"lo","items":[["apple","Epal",55],["brownrice","Nasi beras perang",50],["sweetpotato","Ubi keledek",48],["tomato","Tomato",30],["corn","Jagung putih",26],["f1","Shake F1",16],["peanut","Kacang tanah",14],["broccoli","Kubis bunga",10],["mushroom","Cendawan",10]]}]},{"h":"Ingat roller coaster gula darah pada Hari 4?","p":"Makanan GI tinggi itulah yang membawa gula darah naik roller coaster.","list":["Makanan GI tinggi: gula darah cepat naik, cepat turun, cepat lapar semula","Makanan GI rendah: gula darah naik perlahan, stabil dan tahan lama"],"after":"Jadi pilih GI yang betul untuk turun dari roller coaster, tiada lagi turun naik."},{"h":"Pankreas yang terlalu penat akhirnya akan \"mogok\"","p":"Apabila gula darah naik, pankreas merembeskan insulin untuk menurunkannya. Bayangkan pankreas sebagai seorang pekerja:","list":["Kerap makan makanan GI tinggi: pankreas terpaksa kerja lebih masa setiap hari","Badan semakin kurang sensitif terhadap insulin: pankreas perlu merembeskan lebih banyak insulin untuk mengawal gula darah, inilah \"rintangan insulin\" (insulin resistance)","Terlalu penat dalam jangka panjang: pankreas keletihan dan mula \"mogok\", gula darah tidak terkawal"],"after":"Pada tahap ini, risiko diabetes jenis 2 meningkat dengan ketara."},{"h":"Risiko jangka panjang","p":"Turun naik gula darah yang besar dalam jangka panjang paling kerap membawa kepada rintangan insulin dan diabetes jenis 2, dan mungkin juga menjejaskan bahagian badan ini:","viz":[{"type":"chips","title":"Gula darah tinggi dalam jangka panjang mungkin menjejaskan","items":[["Mata","Masalah penglihatan"],["Jantung","Serangan jantung"],["Otak","Strok"],["Buah pinggang","Kerosakan buah pinggang"],["Saraf","Kerosakan saraf"],["Luka","Lambat sembuh"]]}]},{"h":"Pilihan GI rendah","p":"Makanan GI rendah lebih perlahan ditukar menjadi gula darah, dengan banyak kebaikan:","viz":[{"type":"swap","title":"Tukar pemakanan: daripada GI tinggi kepada GI rendah","rows":[[["Nasi putih","92","hi","k_rice"],["Nasi beras perang","50","lo","k_brownrice_k"]],[["Bihun goreng","98","hi","food_chaomifen"],["Udon","58","mid","food_udon"]],[["Roti putih","70","hi","food_bread"],["Roti gandum penuh","64","mid"]],[["Minuman bergas","85","hi","food_soda"],["Air kosong","","lo"]],[["Teh tarik","73","hi","food_tehtarik"],["Teh tanpa gula","","lo"]],[["Mangga","60","mid","food_mango"],["Epal","55","lo","food_apple"]]],"note":"Nilai daripada nota kelas."}],"list":["Rasa kenyang lebih lama","Tenaga disalurkan secara stabil ke seluruh badan","Sangat sesuai untuk mereka yang sedang menguruskan berat badan"],"after":"Beras perang, oat, kekacang dan kebanyakan sayur ialah pilihan yang baik."}],"viz":[{"type":"scale","title":"GI makanan tempatan biasa","min":0,"max":100,"zones":[[0,55,"GI rendah","lo"],[55,70,"Sederhana","mid"],[70,100,"GI tinggi","hi"]],"marks":[["Bihun goreng",98],["Nasi putih",92],["Karipap",87],["Mi",85],["Minuman bergas",85],["Kentang goreng",85],["Teh tarik",73],["Roti canai",71],["Roti putih",70],["Burger",67],["Roti gandum penuh",64],["Mangga",60],["Pisang",52],["Nasi beras perang",50],["Ubi keledek",48],["Tomato",30],["Shake F1",16],["Kacang tanah",14],["Kubis bunga",10]],"note":"Nilai daripada nota kelas; nilai sebenar berbeza mengikut jenis dan cara masakan."}],"myth":{"m":"Saya tidak makan manis, jadi tidak akan ada masalah gula darah.","f":"Kanji halus seperti nasi putih, roti putih dan bubur juga mempunyai GI tinggi. Mengawal gula darah bergantung pada keseluruhan pemakanan, bukan hanya makanan manis."},"fact":{"num":"≤55","unit":"","text":"GI 55 ke bawah ialah rendah, 56–69 sederhana, 70 ke atas tinggi."},"tips":["Gantikan nasi putih dengan separuh beras perang atau nasi bijirin campur","Semasa makan, makan sayur dan daging dahulu, nasi paling akhir","Makan buah terus, jangan dijadikan jus"],"task":"Untuk salah satu hidangan hari ini, gantikan nasi putih dengan separuh beras perang, atau tambah satu hidangan sayur dan kurangkan separuh mangkuk nasi.","share":"Adakah anda kenal sesiapa yang tidak tahu tentang indeks glisemik atau bahaya makanan GI tinggi?"},{"t":"Kepentingan protein","en":"Importance of Protein","tag":"Nutrisi","lead":"Selain lemak dan tulang, \"berat tanpa lemak\" badan kebanyakannya terdiri daripada protein.","intro":"Protein ialah bahan binaan badan. Otot, kulit, rambut, enzim, hormon dan antibodi semuanya memerlukannya, dan badan tidak dapat menyimpan banyak protein, jadi perlu diambil setiap hari.","points":[{"h":"Lapan fungsi utama protein","p":"Protein melakukan banyak kerja dalam badan, lihat carta di bawah:","viz":[{"type":"chips","title":"Fungsi protein dalam badan","items":[["Memberi struktur badan","Menyokong badan"],["Membina dan membaiki tisu","Otot, kulit, rambut"],["Membantu enzim pencernaan","Mempercepatkan tindak balas kimia"],["Menyokong imuniti","Menghasilkan antibodi"],["Menyelaraskan hormon","Mengawal fungsi badan"],["Mengangkut nutrien","Menggerakkan molekul penting dalam badan"],["Mengawal DNA","Menyokong ekspresi DNA dan RNA"],["Menyokong otot","Pengecutan dan pergerakan"]]}]},{"h":"Berapa banyak protein diperlukan setiap hari?","p":"Keperluan protein bergantung pada matlamat anda:","list":["Kekalkan berat: 0.8–1.2 g setiap kg berat badan sehari","Turun berat: 1.2–1.6 g setiap kg berat badan sehari","Naik berat: 1.6–2.2 g setiap kg berat badan sehari"],"after":"Contohnya, seseorang 60 kg memerlukan kira-kira 48–72 g untuk kekalkan berat, 72–96 g untuk turun berat, dan 96–132 g untuk naik berat. Mereka yang turun berat badan paling perlu protein yang cukup; jika tidak, otot terus hilang dan berat badan mudah naik semula selepas berhenti. Gunakan kalkulator dalam \"Tugasan hari ini\" di bawah untuk mengira keperluan anda."},{"h":"Rasa kenyang lebih lama","p":"Protein lambat dicerna dan membuatkan anda kenyang lebih lama. Protein yang cukup pada setiap hidangan ialah cara paling mudah mengawal selera."},{"h":"Penurunan berat badan ada yang sihat dan tidak sihat","p":"Badan terdiri daripada otot, air dan lemak; yang mana satu hilang sangat penting.","viz":[{"type":"mwf","title":"Badan terdiri daripada otot, air dan lemak: tiga hasil penurunan berat badan","rows":[["Asal",44,44,44,"",""],["Diet ketat",28,30,44,"Tidak sihat","no"],["Nutrisi seimbang",44,44,26,"Sihat","ok"]],"note":"M otot, W air, F lemak. Diet ketat menghilangkan otot dan air; nutrisi seimbang terutamanya menghilangkan lemak."}],"list":["Diet ketat: kebanyakan yang hilang ialah otot dan air, lemak kekal, tenaga, imuniti dan metabolisme menurun","Turun berat dengan nutrisi seimbang: kurangkan kalori sambil mendapat nutrisi seimbang, terutamanya hilang lemak dan kekalkan otot","Hasilnya: bertenaga, imuniti meningkat, metabolisme terjaga, dan tidak terasa lapar"]},{"h":"Protein yang cukup, berat badan tidak mudah naik semula","p":"Hanya dengan protein yang cukup semasa turun berat badan, badan dapat mengekalkan otot.","list":["Otot dikekalkan, metabolisme tidak menjadi perlahan","Metabolisme normal, berat badan lebih stabil apabila kembali makan seperti biasa","Protein tidak cukup: otot terus hilang, metabolisme perlahan, berat badan mudah naik semula selepas berhenti"],"after":"Jadi semasa turun berat badan, ambil 1.2–1.6 g protein setiap kg berat badan, bukan sekadar makan kurang."},{"h":"Semakin berusia, semakin penting","p":"Selepas umur 30, jisim otot berkurang perlahan-lahan mengikut usia. Protein yang cukup dan latihan kekuatan boleh melambatkan proses ini."},{"h":"Protein berkualiti vs protein berkualiti rendah","p":"Walaupun sama-sama protein, berapa banyak yang diserap badan dan berapa banyak perlu dimakan sangat berbeza.","list":["Protein berkualiti: kadar penyerapan tinggi, mengandungi asid amino lengkap yang diperlukan badan, sedikit sudah cukup","Protein berkualiti rendah: kadar penyerapan rendah, kekurangan sesetengah asid amino perlu, perlu makan banyak baru cukup"],"after":"Jadi pilih protein berkualiti pada setiap hidangan untuk benar-benar mendapat protein yang diperlukan badan.","viz":[{"type":"versus","title":"Protein berkualiti vs protein berkualiti rendah","good":{"h":"Protein berkualiti · penyerapan tinggi","items":[["chicken","Ayam"],["salmon","Ikan"],["egg","Telur"],["tofu","Tauhu"],["shake","Shake nutrisi"]],"points":["Penyerapan tinggi, skor hampir 1.00","Mengandungi asid amino perlu yang lengkap","Sedikit sudah cukup"]},"bad":{"h":"Protein berkualiti rendah · penyerapan rendah","items":[["redbean","Kacang merah"],["mungbean","Kacang hijau"],["brownrice_k","Bijirin penuh"],["bread","Roti"]],"points":["Penyerapan lebih rendah","Kekurangan sesetengah asid amino perlu","Perlu makan banyak baru cukup"]}},{"type":"bars","title":"Skor penyerapan protein (maksimum 1.00)","unit":"","items":[["Soya",1,0],["Kasein (susu)",1,0],["Putih telur",1,0],["Daging lembu",0.92],["Serbuk kacang pea",0.69],["Kacang merah",0.68],["Kacang pinto",0.63],["Gandum penuh",0.4],["Gluten gandum",0.25]],"note":"Skor ini (PDCAAS) menunjukkan sejauh mana protein diserap dan digunakan oleh badan; semakin tinggi semakin baik. Soya, susu dan telur semuanya protein berkualiti dengan skor penuh 1.00."},{"type":"kcal","title":"Berapa banyak perlu dimakan untuk mendapat kira-kira 25 g protein?","items":[["chicken","Dada ayam","Kira-kira 80 g","Satu tapak tangan"],["salmon","Ikan","Kira-kira 115 g","Seketul fillet ikan"],["egg","Telur","Kira-kira 4 biji",""],["tofu","Tauhu","Kira-kira 170 g","Lebih separuh ketul"],["redbean","Kacang merah (dimasak)","Kira-kira 280 g","Semangkuk besar"],["brownrice_k","Nasi beras perang","Kira-kira 830 g","Kira-kira 5 mangkuk nasi"]],"note":"Dikira berdasarkan anggaran kandungan protein setiap 100 g. Protein berkualiti rendah perlu dimakan banyak, dan kalorinya turut bertambah."}]},{"h":"Bagaimana vegetarian boleh mendapat protein berkualiti yang cukup?","p":"Vegetarian juga boleh mendapat protein berkualiti yang cukup; kuncinya memilih sumber yang betul dan tahu menggabungkannya:","list":["Makanan soya paling baik: tauhu, tempe, edamame, susu soya tanpa gula, skor penyerapan penuh 1.00","Vegetarian lakto-ovo: telur dan susu rendah lemak juga protein berkualiti dengan skor penuh","Makan kekacang + bijirin bersama: contohnya kacang merah atau kacang pea dengan nasi beras perang atau oat, asid amino saling melengkapi","Shake nutrisi: berasaskan protein soya, mudah untuk mencukupkan protein harian"],"after":"Vegan perlu lebih berhati-hati: setiap hidangan mesti ada satu hidangan makanan soya.","viz":[{"type":"kcal","title":"Sumber protein vegetarian (setiap 100 g)","items":[["soybean","Kacang soya (edamame)","Kira-kira 13 g","Skor penyerapan penuh"],["tempeh","Tempe","Kira-kira 19 g","Kacang soya diperam"],["tofu","Tauhu","Kira-kira 17 g","Tauhu keras"],["egg","Telur","Kira-kira 13 g","Vegetarian lakto-ovo"],["oats","Oat","Kira-kira 17 g","Makan bersama kekacang"],["redbean","Kacang buah pinggang merah","Kira-kira 5 g","Makan bersama bijirin"],["peas","Kacang pea","Kira-kira 5 g","Makan bersama bijirin"],["pb","Mentega kacang","Kira-kira 25 g","Tinggi lemak, 1 sudu besar sudah cukup"],["shake","Shake nutrisi","Protein soya","Mudah ditambah"]],"note":"Nilai anggaran. Makanan soya, telur dan susu mempunyai kadar penyerapan tertinggi; kekacang dan bijirin (oat, beras perang) perlu dimakan bersama untuk nutrisi lengkap. Mentega kacang tinggi protein tetapi juga tinggi lemak dan kalori, jadi kawal saiz hidangan."},{"type":"bars","title":"Kandungan protein makanan tumbuhan (setiap 100 g)","unit":"g","items":[["Biji labu",33],["Mentega kacang",25.1],["Badam",22.1],["Biji rami",19.5],["Tauhu",17.2],["Oat",16.9],["Biji chia",15.6],["Gajus",15.3],["Walnut",15],["Kacang soya (edamame)",13.1],["Kacang dal",9],["Kacang kuda",8.9],["Roti gandum penuh",8.8],["Kacang pea",5.4],["Kacang buah pinggang merah",4.8],["Kuinoa",4.4],["Bayam",2.9],["Beras perang",2.6],["Kentang",2.5]],"note":"Kekacang dan biji-bijian tinggi protein tetapi juga sangat tinggi lemak dan kalori, segenggam kecil sehari sudah cukup. Makanan soya (tauhu, tempe, edamame) ialah sumber protein terbaik untuk vegetarian."}]},{"h":"Cari protein daripada makanan semula jadi","p":"Protein berkualiti datang daripada dua sumber:","list":["Protein tumbuhan: tauhu, tempe, kacang dal, kacang soya","Protein haiwan: telur, dada ayam, ikan, udang, produk tenusu rendah lemak"],"after":"Perhatian: kekacang dan daging berlemak juga tinggi kalori dan lemak, kawal saiz hidangan."},{"h":"Jangan hanya lihat berat badan","p":"Dengan berat yang sama, bentuk badan boleh sangat berbeza. Kuncinya sama ada badan anda lebih banyak otot atau lemak:","list":["1 kg yang sama: isipadu otot kecil, isipadu lemak besar","Lebih banyak otot: badan tegap, bertenaga, membakar lebih banyak kalori setiap hari","Lebih banyak lemak: badan kendur, mudah letih, lebih mudah gemuk"],"after":"Jadi penurunan berat badan bukan sekadar nombor pada penimbang, peratus lemak badan dan jisim otot lebih penting. Itulah sebabnya kita mengukur dan membuat susulan secara berkala.","viz":[{"type":"vs2","title":"Sama-sama 50 kg, kenapa bentuk badan begitu berbeza?","left":{"h":"Lebih banyak otot","cls":"good","bar":[["Otot",62],["Lemak",22],["Lain-lain",16]],"items":["Badan tegap","Bertenaga","Mudah kekal kurus","Membakar lebih banyak kalori"]},"right":{"h":"Lebih banyak lemak","cls":"bad","bar":[["Otot",34],["Lemak",50],["Lain-lain",16]],"items":["Badan kendur","Mudah letih","Mudah gemuk","Isipadu besar, nampak lebih gemuk"]},"note":"Gambar ilustrasi, nisbah hanya untuk penerangan. Lemak dengan berat yang sama mempunyai isipadu jauh lebih besar daripada otot."}]}],"viz":[{"type":"bars","title":"Kandungan protein setiap 100 g makanan","unit":"g","items":[["Dada ayam",31],["Daging lembu",26],["Daging babi",26],["Peha ayam",25],["Salmon",22],["Telur",13],["Tauhu",15],["Kacang dal",9],["Nasi beras perang",3]],"note":"Nilai anggaran setiap 100 g, dimasak, tanpa t":["Telur hancur goreng: kadar serapan minyak sehingga 43%","Makanan bersalut tepung: lapisan tepung sangat menyerap minyak","Bahan yang sama jika dikukus, direbus atau dibakar jauh lebih rendah lemak dan kalori berbanding digoreng"],"viz":[{"type":"bars","title":"Kadar serapan minyak makanan bergoreng biasa","unit":"%","items":[["Telur hancur goreng",43,1],["Udang kecil goreng tepung",35,1],["Cendawan goreng tepung",23,1],["Akar teratai goreng",19],["Terung sumbat goreng",17],["Kentang goreng",15]],"note":"Kadar serapan minyak: minyak yang diserap makanan selepas digoreng, sebagai peratusan berat makanan. Disusun daripada bahan rujukan kelas; kentang goreng dianggarkan kira-kira 15 g minyak setiap 100 g."}]},{"h":"Lemak tak tepu: pilih lebih","p":"Minyak zaitun, minyak kanola, avokado, kekacang dan biji-bijian mengandungi lemak tak tepu mono atau poli, yang cecair pada suhu bilik dan membantu menurunkan kolesterol jahat."},{"h":"Bagaimana memilih minyak masak?","p":"Jenis lemak dalam setiap minyak sangat berbeza. Semasa memasak, pilih minyak yang tinggi lemak tak tepu dan rendah lemak tepu:","list":["Pilih lebih: minyak kanola, minyak zaitun (tinggi lemak tak tepu mono)","Secara sederhana: minyak bunga matahari, minyak jagung, minyak soya","Kurangkan: minyak babi, minyak sawit, mentega, minyak kelapa (tinggi lemak tepu)"],"viz":[{"type":"stack","title":"Komposisi lemak minyak masak biasa (%)","keys":[["Lemak tepu","var(--bad)"],["Omega-6","var(--water)"],["Omega-3","var(--sun)"],["Omega-9","var(--leaf)"]],"rows":[["Minyak biji rami",[9,16,57,18]],["Minyak kanola",[7,21,11,61]],["Minyak zaitun",[15,9,1,75]],["Minyak soya",[15,54,8,23]],["Minyak kacang tanah",[19,33,0,48]],["Minyak jagung",[13,57,1,29]],["Minyak bunga matahari",[12,71,1,16]],["Minyak babi",[43,9,1,47]],["Minyak sawit",[51,10,0,39]],["Mentega",[68,3,1,28]],["Minyak kelapa",[91,2,0,7]]],"note":"Setiap minyak mengandungi Omega-3, 6 dan 9, tetapi nisbahnya sangat berbeza. Oren (Omega-3) biasanya sangat sedikit, hanya minyak biji rami yang lebih banyak. Disusun daripada carta rujukan kelas; angka adalah anggaran."}]},{"h":"Omega-3: badan tidak dapat menghasilkannya","p":"Omega-3 ialah asid lemak perlu yang tidak dapat dihasilkan oleh badan, jadi mesti diperoleh daripada makanan. Minyak ikan mengandungi dua jenis utama Omega-3:","list":["DHA: komponen penting otak dan retina mata, membantu mengekalkan kesihatan otak dan penglihatan","EPA: membantu mengekalkan paras trigliserida normal dan kesihatan saluran darah","Sumber: ikan laut dalam (salmon, makarel, sardin), biji rami"],"viz":[{"type":"table","title":"Panduan dos Omega-3","head":["Organisasi","Untuk","Saranan harian"],"wrap":[1],"rows":[["FDA","Dewasa umum: had atas selamat sehari","3 g"],["AHA","Penyakit jantung koronari","1 g"],["AHA","Trigliserida tinggi","3–4 g"],["AHA","Darah tinggi","2 g"],["AHA","Artritis reumatoid","2.7 g"],["WHO","Wanita hamil dan menyusu","300 mg"],["WHO","Kesihatan mata, melegakan mata kering","1 g"]],"best":-1,"note":"FDA: Pentadbiran Makanan dan Ubat AS; AHA: Persatuan Jantung Amerika; WHO: Pertubuhan Kesihatan Sedunia. Disusun daripada nota kelas; angka merujuk kepada EPA + DHA. Kebanyakan orang hanya perlu makan ikan laut dalam 2 kali seminggu atau suplemen minyak ikan secara sederhana; jika ada penyakit, hamil atau sedang mengambil ubat, rujuk doktor sebelum mengambil suplemen."},{"type":"chips","title":"Apa kebimbangan terbesar tentang minyak ikan?","items":[["Merkuri dan logam berat","Ikan besar mudah mengumpul logam berat seperti merkuri; inilah kebimbangan utama tentang minyak ikan"],["Pilih ikan laut dalam yang kecil","Ikan kecil seperti makarel, ikan bilis dan sardin kurang mengumpul logam berat"],["Semak laporan ujian","Diuji untuk logam berat dengan keputusan tidak dikesan, lebih yakin untuk diambil"],["Ditambah vitamin E","Membantu mencegah pengoksidaan minyak ikan dan mengekalkan kualiti"]]},{"type":"kcal","title":"Dari mana datangnya Omega-3?","items":[["fishoil","Minyak ikan Omega-3","Logam berat tidak dikesan","Ujian analisis logam berat"],["salmon","Ikan laut dalam","2 kali seminggu","Sumber semula jadi"]],"note":"Minyak ikan Herbalife menggunakan ikan laut dalam kecil dari Atlantik Utara (makarel, ikan bilis, sardin). Ujian logam berat menunjukkan tidak dikesan, dan ditambah vitamin E untuk mencegah pengoksidaan."}],"img":[{"f":"fishoil_report","cap":"Ujian analisis logam berat kapsul minyak ikan laut dalam Herbalife: logam berat tidak dikesan"}]},{"h":"Adakah Omega-3 tumbuhan (ALA) mencukupi?","p":"Omega-3 dalam biji rami, biji chia dan walnut dipanggil ALA. Ramai sangka makan ini sudah cukup, tetapi ALA perlu ditukar dalam badan sebelum menjadi EPA dan DHA yang benar-benar diperlukan:","list":["ALA ditukar kepada EPA: hanya kira-kira 5–10%","ALA ditukar kepada DHA: lebih sedikit, hanya kira-kira 0.5–5% (ramai kurang daripada 1%)","Kadar penukaran berbeza mengikut individu; terlalu banyak Omega-6 dalam pemakanan akan merendahkannya lagi"],"after":"Jadi ALA tumbuhan boleh dimakan, tetapi untuk EPA dan DHA yang mencukupi, sumber paling langsung masih ikan laut dalam dan minyak ikan.","viz":[{"type":"bars","title":"Makan 100 unit ALA, paling banyak boleh menjadi berapa?","unit":" hidangan","items":[["ALA yang dimakan",100],["Menjadi EPA",10,1],["Menjadi DHA",5,1]],"note":"Dikira menggunakan kadar penukaran yang lebih tinggi dalam kajian; sebenarnya ramai orang lebih rendah. Sumber: anggaran gabungan kadar penukaran ALA daripada kajian nutrisi."}]},{"h":"Apa berlaku jika terlalu banyak makan lemak jahat?","p":"Terlalu banyak lemak tepu dan lemak trans dalam jangka panjang meningkatkan kolesterol jahat dan perlahan-lahan menjejaskan badan:","list":["Saluran darah: plak lemak terkumpul pada dinding saluran darah, menjadi sempit dan keras","Jantung: saluran darah tersumbat meningkatkan risiko serangan jantung dan strok; jantung perlu bekerja lebih kuat","Hati: lemak terkumpul di hati, menyebabkan hati berlemak","Perut: lemak viseral bertambah, lilitan pinggang membesar"],"after":"Berita baiknya: dengan mengubah tabiat makan dan lebih bersenam, saluran darah boleh kekal lebih muda.","imgFull":true,"img":[{"f":"heart_attack","cap":"Serangan jantung: saluran darah tersumbat oleh plak, otot jantung tidak mendapat darah beroksigen, dan setiap minit lebih banyak tisu rosak dan mati"},{"f":"liver_real","cap":"Hati sihat (kiri) vs hati berlemak (kanan)"}]},{"h":"Omega-3, 6, 9: yang perlu ditambah ialah Omega-3","p":"Lemak tak tepu dalam makanan terdiri daripada tiga jenis utama: Omega-3, Omega-6 dan Omega-9:","list":["Omega-6: terdapat dalam kebanyakan minyak masak dan makanan diproses, mudah didapati. Terlalu banyak boleh menggalakkan keradangan dalam badan","Omega-9: banyak dalam minyak zaitun, minyak kanola dan kekacang, badan juga boleh menghasilkannya sendiri","Omega-3: membantu mengurangkan keradangan tidak normal, tetapi pemakanan biasa jarang membekalkannya, inilah yang paling perlu ditambah"],"after":"Pemakanan moden terlalu banyak Omega-6 dan terlalu sedikit Omega-3. Jadi tidak perlu menambah Omega-6 dan Omega-9; yang perlu diambil lebih ialah Omega-3."},{"h":"Lemak baik juga ada kalori","p":"Walaupun lemak baik seperti minyak zaitun dan kekacang, setiap gram mengandungi 9 kalori, lebih dua kali ganda protein dan karbohidrat. Pilih jenis yang betul, dan kawal juga saiz hidangan."}],"viz":[{"type":"split","title":"Bezakan lemak baik dan lemak jahat sekali pandang","left":{"h":"Lemak baik · pilih lebih","cls":"good","items":["Ikan laut dalam: salmon, makarel, sardin","Minyak zaitun, minyak kanola","Avokado","Kekacang asli seperti badam dan walnut","Biji rami, biji chia"]},"right":{"h":"Lemak jahat · kurangkan atau elakkan","cls":"bad","items":["Daging berlemak, kulit ayam, minyak babi","Mentega, krim, susu pekat","Santan, minyak sawit (lemak tepu)","Marjerin, lemak sayuran (lemak trans)","Biskut, kek, pastri, makanan bergoreng"]}}],"myth":{"m":"Mahu turun berat badan mesti langsung tidak ma
